<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร้านหนังสือ/ชีทเรียน</title>

<!--SHOP-DATA-->
<style>
:root{
  --bg:#EDF1F7;--surface:#FFFFFF;--ink:#0F1B33;--muted:#56637D;--line:#D3DBE8;
  --brand:#2440E8;--hero-ink:#FFFFFF;--accent:#FFD23F;--accent-ink:#0F1B33;
  --ok:#0F7A55;--okbg:#DDF3EA;--warn:#8A5300;--warnbg:#FCEBC8;--bad:#B42318;--badbg:#FBE1DE;
  --font-body:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun',system-ui,-apple-system,sans-serif;
  --font-head:'Mitr','Prompt','IBM Plex Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220;--surface:#131C30;--ink:#EAF0FF;--muted:#9AA7C4;--line:#27334F;
    --brand:#8EA0FF;
    --ok:#5FD3A5;--okbg:#0F3527;--warn:#F3B85B;--warnbg:#3A2A0A;--bad:#FF8F84;--badbg:#3F1512;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220;--surface:#131C30;--ink:#EAF0FF;--muted:#9AA7C4;--line:#27334F;
  --brand:#8EA0FF;
  --ok:#5FD3A5;--okbg:#0F3527;--warn:#F3B85B;--warnbg:#3A2A0A;--bad:#FF8F84;--badbg:#3F1512;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65}
h1,h2,h3{font-family:var(--font-head);font-weight:500;line-height:1.3;margin:0}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;word-break:break-all}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.wrap.wide{max-width:960px}
.muted{color:var(--muted)}
.fine{font-size:14px;color:var(--muted)}

/* demo bar */
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;max-width:960px;margin:0 auto}
.bar-note{font-size:13px;color:var(--muted);line-height:1.3}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;flex-shrink:0}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.urlbar{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 0}
.urlbar-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.urlbar select{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;max-width:100%}
.draftnote{background:var(--warnbg);color:var(--warn);padding:8px 16px;text-align:center;font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 22px;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.98)}
.btn-cta{background:var(--accent);color:var(--accent-ink)}
.btn-cta:hover{filter:brightness(.96)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn-block{width:100%}

/* hero */
.hero{background:var(--hero,#2440E8);color:var(--hero-ink);padding:36px 0 40px}
.hero-in{display:grid;gap:28px}
.hero h1{font-size:clamp(28px,7.2vw,44px);letter-spacing:-.01em}
.lead{font-size:17px;margin-top:14px;opacity:.92;max-width:34em}
.price-row{display:flex;align-items:baseline;gap:12px;margin:22px 0 16px}
.price-row .old{text-decoration:line-through;opacity:.65;font-size:18px}
.price-row .now{font-family:var(--font-head);font-size:34px}
.hero .fine{color:var(--hero-ink);opacity:.8;margin-top:12px}
.cover{width:100%;max-width:300px;height:auto;justify-self:center}
@media(min-width:760px){.hero-in{grid-template-columns:1fr 1fr;align-items:center}}

/* sections */
.section{padding:34px 0}
.section h2{font-size:24px;margin-bottom:16px}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.feat li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tick{flex:0 0 24px;height:24px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.field .lbl{font-weight:500;font-size:15px}
.input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.input:focus{border-color:var(--brand);outline:none}
textarea.input{min-height:110px;resize:vertical}
.row{display:flex;gap:8px}
.row .input{flex:1;min-width:0}
.err{color:var(--bad);font-size:14px}
.okmsg{color:var(--ok);font-size:14px}
.methods{display:grid;gap:10px;margin-bottom:16px}
.method{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--bg)}
.method:has(input:checked){border-color:var(--brand);background:var(--surface);box-shadow:inset 0 0 0 1px var(--brand)}
.method input{accent-color:var(--brand);width:18px;height:18px}
.sum{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;display:grid;gap:6px;margin-bottom:16px}
.sum div{display:flex;justify-content:space-between}
.sum .total{font-weight:600;font-size:18px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
summary{cursor:pointer;font-weight:500}
details p{margin-top:8px;color:var(--muted)}
footer{padding:28px 0 110px;text-align:center}

/* sticky cta */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;transform:translateY(0);transition:transform .2s ease}
.sticky.hide{transform:translateY(110%)}
.sticky-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px}
.sticky-in .p{font-family:var(--font-head);font-size:20px;white-space:nowrap}
.sticky-in .btn{flex:1}
.sp-chat{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--brand);text-decoration:none;padding:0 6px;flex:none}.sp-chat small{font-size:11px}
.sp-sp{display:flex;flex-direction:column;line-height:1.1}.sp-sp s{font-size:12px;color:var(--muted)}
/* shopee-style top */
.spx{background:var(--surface)}
.sp-car-wrap{position:relative;max-width:560px;margin:0 auto;background:#fff}
.sp-car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.sp-car::-webkit-scrollbar{display:none}
.sp-car>*{flex:0 0 100%;scroll-snap-align:center;border:0;padding:0;background:#fff;cursor:zoom-in}
.sp-car img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain}
.sp-art{display:grid;place-items:center;aspect-ratio:1/1;cursor:default;padding:40px}
.sp-count{position:absolute;right:12px;bottom:12px;background:rgba(15,27,51,.72);color:#fff;border-radius:999px;padding:5px 13px;font-size:15px;font-weight:600}
.sp-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:26px;line-height:1;color:#0F1B33;cursor:pointer;display:grid;place-items:center;padding:0 0 3px}
.sp-nav.prev{left:10px}.sp-nav.next{right:10px}
.sp-thumbs{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 4px;max-width:560px;margin:0 auto;align-items:center;scrollbar-width:none}.sp-thumbs::-webkit-scrollbar{display:none}
.sp-th{flex:0 0 58px;height:58px;border:2px solid var(--line);border-radius:8px;overflow:hidden;padding:0;background:#fff;cursor:pointer}.sp-th img{width:100%;height:100%;object-fit:cover}.sp-th.on{border-color:#EE4D2D}
.sp-hint{flex:none;font-size:12px;color:var(--muted);white-space:nowrap;padding-left:4px}
.btn-buy{background:#EE4D2D;color:#fff;border:0;font-weight:700}.btn-buy:hover{background:#d73f22}.btn-buy:focus-visible{outline:3px solid #ffb199;outline-offset:2px}
.sp-off{position:absolute;left:0;top:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:5px 12px 5px 10px;border-radius:0 999px 999px 0;font-size:14px}
.sp-band{background:linear-gradient(100deg,var(--hero,#2440E8),color-mix(in srgb,var(--hero,#2440E8) 55%,#ff5a36));color:#fff}
.sp-band-in{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.sp-price{display:flex;align-items:baseline;gap:10px}.sp-price .now{font-family:var(--font-head);font-size:32px;line-height:1}.sp-price .old{text-decoration:line-through;opacity:.75;font-size:16px}
.sp-cd{display:flex;align-items:center;gap:4px;font-size:13px}.sp-cd span{margin-right:4px;opacity:.9}.sp-cd b{background:#0F1B33;color:#fff;border-radius:6px;padding:2px 6px;font-variant-numeric:tabular-nums;font-size:15px}.sp-cd i{font-style:normal;font-weight:700}
.sp-info{padding-top:16px;padding-bottom:22px}.sp-info h1{font-size:clamp(21px,5.2vw,30px);line-height:1.3;color:var(--ink)}
.sp-meta{display:flex;gap:14px;color:var(--muted);font-size:14px;margin-top:6px}
.sp-info .lead{margin-top:10px;color:var(--ink)}
.paylogos{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0 6px}
.paylogos.sm{justify-content:flex-start;margin:12px 0 0;gap:6px}
.paylogos .pl{background:#fff;border:1px solid #D3DBE8;border-radius:8px;height:34px;min-width:52px;padding:6px 8px;display:inline-flex;align-items:center;justify-content:center}
.paylogos .pl svg{height:100%;width:auto;display:block}
.paylogos .pl.tqr{padding:0;border:0;background:transparent}
.paylogos.sm .pl{height:30px;min-width:48px;padding:5px 8px}
.paysafe{display:flex;gap:6px;align-items:flex-start;justify-content:center;font-size:14px;color:var(--muted);margin:6px 0 0;text-align:left}
.paysafe svg{flex:none;margin-top:3px;color:#16a34a}
.stripe-w{color:#635BFF;font-family:Arial,Helvetica,sans-serif;font-weight:800;letter-spacing:-.3px}
.sp-perks{display:flex;flex-wrap:wrap;gap:6px 14px;margin:14px 0;font-size:14px;color:var(--muted)}
.sp-info .hero-cta{margin-top:6px}.sp-info .proof{color:var(--muted)}
/* preview pages */
.pv{display:grid;gap:14px;max-width:560px;margin:0 auto}
.pvp{display:block;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;padding:0;box-shadow:0 4px 14px rgba(15,27,51,.08);position:relative}
.pvp img{display:block;width:100%;height:auto}
.pvp.locked{max-height:520px}.pvp.locked img{filter:blur(3px)}
.pv-lock{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;padding:24px 16px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.85) 45%,#fff 70%)}
.pv-lock b{font-size:20px;color:var(--ink)}.pv-lock span{color:var(--muted);font-size:14px;margin-bottom:6px}
.pvthumb img{object-fit:cover;object-position:top}
@media(min-width:900px){.spx{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);max-width:1180px;margin:0 auto;gap:0 28px;background:transparent;padding:24px 16px 0}.spx .sp-media{grid-row:1/3;grid-column:1}.spx .sp-thumbs{padding-left:0}.spx .sp-car-wrap{border-radius:14px;overflow:hidden;margin:0}.spx .sp-band{border-radius:12px;align-self:start}.spx .sp-band .wrap,.spx .sp-info.wrap{max-width:none;padding-left:16px;padding-right:16px}}

/* pay + thanks */
.center{text-align:center}
.qrbox{background:#fff;border-radius:14px;padding:10px;width:230px;margin:14px auto;border:1px solid var(--line)}
.qrbox svg{display:block;width:100%;height:auto}
.amount{font-family:var(--font-head);font-size:38px;margin:4px 0}
.stack{display:grid;gap:10px;margin-top:16px}
.big-ok{width:64px;height:64px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}

/* admin */
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:14px 0 4px}
.tabs button{border:1.5px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500;white-space:nowrap;font-size:15px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media(max-width:640px){
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;overflow:visible;padding:10px 0 6px;position:sticky;top:0;z-index:5;background:var(--bg)}
  .tabs button{padding:9px 4px;font-size:13px;white-space:normal;line-height:1.2;border-radius:12px;min-height:40px}
  .tabs button .tcount{margin-left:4px;min-width:18px;line-height:18px;font-size:11px}
}
.chat{max-width:720px}
.msg{display:flex;gap:10px;align-items:flex-end;margin:10px 0}
.chat .msg .ava,.chat .msg .ava.sm{width:52px;height:52px;border-width:2px}
.msg .bub{background:var(--surface);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;max-width:78%;font-size:15px;line-height:1.45}
.msg .who{font-size:12px;color:var(--muted);margin-bottom:2px}
.msg.me{flex-direction:row-reverse}.msg.me .bub{background:var(--ink);color:var(--bg);border-color:var(--ink);border-radius:16px 16px 4px 16px}.msg.me .who{text-align:right}
.msg .t{font-size:11px;color:var(--muted);margin:0 4px 2px}
.daysep{text-align:center;font-size:12px;color:var(--muted);margin:14px 0 4px}
.online{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 12px}.online span{position:relative;display:inline-block;line-height:0}.online .ava,.online .ava.sm{width:34px;height:34px;border-width:2px}.online i{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#9ca3af;border:2px solid var(--bg)}.online i.on{background:#22c55e}.online i.idle{background:#facc15}
.msg.typing .bub{color:var(--muted);font-style:italic;background:transparent;border-style:dashed}
.msg .qt{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding:2px 8px;margin:0 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}.msg.me .qt{color:var(--bg);opacity:.8;border-color:var(--bg)}
.msg .rx{display:flex;gap:4px;flex-wrap:wrap;align-items:center;margin:4px 0 0 4px;min-height:18px}.msg.me .rx{justify-content:flex-end;margin-right:4px}
.rxb{border:1px solid var(--line);background:var(--surface);border-radius:999px;font-size:12px;padding:1px 7px;cursor:pointer;line-height:1.5;color:var(--ink)}.rxb.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,var(--surface))}.rxb.rxadd{opacity:.45;padding:1px 6px}.rxb.rxadd:hover,.msg:hover .rxb.rxadd{opacity:1}.rxb.pick{font-size:15px;padding:0 5px}
.seen{font-size:11px;color:var(--muted);margin-left:4px}
.msg .who{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.msg.me .who{justify-content:flex-end}.msg .who .evtag{display:inline-block;width:max-content;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 6px;line-height:1.5}
.poll{margin-top:8px;display:grid;gap:4px;min-width:220px}.poll .po{position:relative;border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg);cursor:pointer;overflow:hidden;display:flex;justify-content:space-between;font-size:13px;text-align:left}.poll .po i{position:absolute;left:0;top:0;bottom:0;background:color-mix(in srgb,var(--brand) 18%,transparent);z-index:0}.poll .po span,.poll .po em{position:relative;z-index:1;font-style:normal}.poll .po.on{border-color:var(--brand)}.poll small{color:var(--muted);font-size:11px}
.chatbox{display:flex;gap:8px;margin-top:14px;position:sticky;bottom:0;background:var(--bg);padding:8px 0}
.chatbox input{flex:1;border:1.5px solid var(--line);border-radius:999px;padding:10px 14px;font:inherit}
@media(max-width:640px){
  .msg{gap:10px;margin:14px 0}
  .chat .msg .ava,.chat .msg .ava.sm{width:72px;height:72px}
  .msg{gap:12px}
  .msg .bub{font-size:17px;line-height:1.5;padding:10px 14px;max-width:82%;border-radius:18px 18px 18px 6px}
  .msg.me .bub{border-radius:18px 18px 6px 18px}
  .msg .who{font-size:14px;margin-bottom:3px}
  .msg .t{font-size:12px}
  .daysep{font-size:13px}
  .chatbox input{font-size:16px;padding:12px 16px}
}
}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.post{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:grid;grid-template-columns:96px 1fr;gap:14px}
.post img{width:96px;height:96px;object-fit:cover;border-radius:10px;background:var(--bg)}
.post .noimg{width:96px;height:96px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--muted);font-size:12px}
.post textarea{width:100%;min-height:120px;white-space:pre-wrap}
.post .meta{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted);margin-top:8px}
.post .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.post.compact{padding:10px 12px;grid-template-columns:64px 1fr;gap:10px;margin-bottom:8px}
.post.compact img,.post.compact .noimg,.post video.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:#000;cursor:pointer}
.post.compact .noimg{background:var(--bg);font-size:11px}
.post.compact .acts{margin-top:6px}
.post.compact .ava.sm{width:22px;height:22px}.post.compact .by{font-size:13px}
.ptxt{margin-top:6px;white-space:pre-wrap;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;font-size:14px;line-height:1.45}
.ptxt.n2{-webkit-line-clamp:2}.note-card.slim{padding:10px 12px;margin-bottom:6px;white-space:normal}
.cbar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0}
.cstat{display:flex;gap:6px 14px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.cstat .dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#9ca3af;margin-right:5px;vertical-align:middle}.cstat .dot.on{background:#16a34a}.cstat .dot.off{background:#ef4444}
.daysep{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 6px;display:flex;align-items:center;gap:8px}.daysep:after{content:'';flex:1;height:1px;background:var(--line)}.daysep.urgent{color:#b91c1c}
.filters.sticky{position:sticky;top:0;z-index:4;background:var(--bg);padding:8px 0;margin:0}

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const baht=n=>'฿'+Number(n).toLocaleString('th-TH');
const fdt=t=>new Date(t).toLocaleString('th-TH',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const methodName=m=>m==='promptpay'?'PromptPay QR':m==='stripe'?'Stripe':'บัตรเครดิต';
const TICK='<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
const COLORS=[['#2440E8','น้ำเงิน'],['#0F6B4F','เขียว'],['#7A2A8C','ม่วง'],['#B4400E','ส้มอิฐ']];
const BASE_KINDS={sheet:'ชีทเรียน',book:'หนังสือ / อีบุ๊ก',exam:'แนวข้อสอบ / แบบฝึกหัด',course:'คอร์สวิดีโอ',template:'เทมเพลต / ไฟล์งาน',other:'สินค้าดิจิทัลอื่นๆ'};
function customKinds(){return lines(D.settings&&D.settings.customKinds).map(l=>l.trim()).filter(Boolean);}
function KIND_LIST(){const r=Object.assign({},BASE_KINDS);customKinds().forEach(l=>{r['c:'+l]=l;});return r;}
const kindName=k=>KIND_LIST()[k]||(String(k||'').startsWith('c:')?String(k).slice(2):'สินค้าดิจิทัล');
const DOMAIN=(location.origin&&location.origin!=='null'?location.origin:'https://yourshop.com')+'/p/';

/* ---------- storage (Supabase) ----------
   ข้อมูลร้านเก็บในตาราง shop_state 2 แถว
   - 'main'    : สินค้า คูปอง ตั้งค่า  → ทุกคนอ่านได้ แอดมินเขียนได้
   - 'private' : ออเดอร์ แคมเปญ อีเวนต์ → แอดมินเท่านั้น
   localStorage ใช้เป็นแคชให้หน้าเปิดเร็ว และเป็นที่พักข้อมูลฝั่งลูกค้า (เช่นออเดอร์ทดลอง) */
const SB_URL='https://lpeqaorswhwzlplsaqpe.supabase.co';
const SB_KEY='sb_publishable_q4qdE3WFYdH15Klf7TToSQ_Tbh87eNs';
let sb=null; // สร้างเมื่อจำเป็น (แอดมิน) เท่านั้น ลูกค้าทั่วไปไม่ต้องโหลดไลบรารี 200KB
function loadSb(){
  if(sb)return Promise.resolve(sb);
  return new Promise((res,rej)=>{
    if(window.supabase){sb=window.supabase.createClient(SB_URL,SB_KEY);return res(sb);}
    const t=document.createElement('script');t.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';
    t.onload=()=>{sb=window.supabase.createClient(SB_URL,SB_KEY);res(sb);};t.onerror=()=>rej(new Error('โหลด Supabase ไม่ได้'));
    document.head.appendChild(t);
  });
}
const hasAdminToken=()=>{try{return !!localStorage.getItem('sb-lpeqaorswhwzlplsaqpe-auth-token');}catch(e){return false;}};
let sbSession=null,remoteReady=false,needsMigrate=false,remoteStamp='';
const CACHE='dp-cache-v1',LEGACY='dp-demo-v3';
const PUBLIC_KEYS=['settings','products','coupons'],PRIVATE_KEYS=['orders','campaigns','events'];
const pick=(o,keys)=>{const r={};keys.forEach(k=>{if(o[k]!==undefined)r[k]=o[k];});return r;};
function load(){try{const r=localStorage.getItem(CACHE);if(r)return JSON.parse(r);}catch(e){}return null;}
function loadLegacy(){try{const r=localStorage.getItem(LEGACY);if(r)return JSON.parse(r);}catch(e){}return null;}
let saveWarned=false;
function saveCache(){
  try{localStorage.setItem(CACHE,JSON.stringify(D));saveWarned=false;}
  catch(e){if(!saveWarned){saveWarned=true;try{toast('พื้นที่จัดเก็บในเบราว์เซอร์เต็ม ลองลดจำนวนหรือขนาดภาพ');}catch(_){}}}
}
let saveTimer=null,savePending=false;
function save(){
  saveCache();
  if(!sb||!sbSession)return; // ลูกค้าทั่วไปไม่มีสิทธิ์เขียน เก็บแค่แคช
  savePending=true;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flushRemote,400);
}
async function flushRemote(){
  if(!savePending||!sb||!sbSession)return;
  savePending=false;
  const chk=await sb.from('shop_state').select('id,updated_at');
  const newest=(chk.data||[]).map(r=>r.updated_at||'').sort().pop()||'';
  if(remoteStamp&&Date.parse(newest)>Date.parse(remoteStamp)){ // มีคนบันทึกจากแท็บ/เครื่องอื่นหลังจากเราโหลด
    await loadRemote();S.edit=null;S.draft=null;render(true);
    toast('ข้อมูลถูกแก้จากที่อื่นก่อนหน้านี้ โหลดข้อมูลล่าสุดมาแล้ว กรุณาแก้อีกครั้ง');return;
  }
  const now=new Date().toISOString();
  // ลิงก์ไฟล์สินค้า (link) เป็นความลับ: แยกออกจากข้อมูลสาธารณะไปเก็บในแถว private
  const pub=pick(D,PUBLIC_KEYS),links={};
  pub.products=D.products.map(p=>{links[p.id]=p.link||'';const q=Object.assign({},p);delete q.link;return q;});
  const priv=pick(D,PRIVATE_KEYS);priv.links=links;
  priv.orders=(priv.orders||[]).filter(o=>o.src!=='stripe'); // ออเดอร์จริงอยู่ในตาราง orders ไม่เก็บซ้ำในก้อนนี้
  const rows=[{id:'main',data:pub,updated_at:now},{id:'private',data:priv,updated_at:now}];
  const {error}=await sb.from('shop_state').upsert(rows);
  if(error){console.error(error);toast('บันทึกขึ้นระบบไม่สำเร็จ: '+error.message);}
  else remoteStamp=now;
}
async function loadRemote(){
  if(!sb)return false;
  const {data,error}=await sb.from('shop_state').select('id,data,updated_at');
  if(error){console.error(error);return false;}
  remoteStamp=(data||[]).map(r=>r.updated_at||'').sort().pop()||'';
  const main=(data||[]).find(r=>r.id==='main'),priv=(data||[]).find(r=>r.id==='private');
  remoteReady=true;
  if(!main||!main.data||!Array.isArray(main.data.products))return false; // ยังไม่เคยตั้งค่าข้อมูลบนระบบ
  const merged=Object.assign({},main.data,priv&&priv.data?priv.data:{});
  privLoaded=!!(priv&&priv.data);const links=(priv&&priv.data&&priv.data.links)||{};delete merged.links;
  needsMigrate=!!sbSession&&(main.data.products||[]).some(p=>p.link);
  merged.products=(merged.products||[]).map(p=>Object.assign({},p,{link:p.link||links[p.id]||''}));
  if(!sbSession){ // ลูกค้าเห็นแค่ข้อมูลสาธารณะ ส่วนออเดอร์ทดลองของเขาอยู่ในแคชเครื่องเขาเอง
    const cached=load()||{};
    PRIVATE_KEYS.forEach(k=>{if(merged[k]===undefined)merged[k]=cached[k]||[];});
  }
  D=normalize(merged);
  if(sbSession){
    const demo=o=>o.src!=='stripe'&&(/^DP2609/.test(o.id||'')||/@example\.com$/.test(o.email||''));
    const demoCamp=c=>['calc1-early','grammar-students'].includes(c.name)&&['c1','c2'].includes(c.id);
    if(D.orders.some(demo)||D.campaigns.some(demoCamp)){D.orders=D.orders.filter(o=>!demo(o));D.campaigns=D.campaigns.filter(c=>!demoCamp(c));D.events=[];needsMigrate=true;}
    await loadOrders();
  }
  saveCache();
  return true;
}
/* ออเดอร์จริงจากตาราง orders (บันทึกโดยเซิร์ฟเวอร์เมื่อลูกค้าจ่ายผ่าน Stripe) */
async function loadOrders(){
  if(!sb||!sbSession)return;
  const {data,error}=await sb.from('orders').select('*').order('created_at',{ascending:false}).limit(500);
  if(error){console.error(error);return;}
  const real=(data||[]).map(r=>({id:String(r.session_id).slice(-8).toUpperCase(),sid:r.session_id,src:'stripe',productId:r.product_id||'',pname:r.product_name||'',name:r.name||'(ไม่ระบุชื่อ)',email:r.email||'',method:'stripe',
    base:Number(r.amount)||0,discount:0,amount:Number(r.amount)||0,coupon:'',campaign:r.campaign||'',status:r.status==='paid'?'paid':r.status==='expired'?'expired':'pending',
    created:Date.parse(r.created_at)||Date.now(),paidAt:r.paid_at?Date.parse(r.paid_at):null,items:[],paymentIntent:r.payment_intent||'',emailedAt:r.emailed_at?Date.parse(r.emailed_at):null,
    log:[{t:Date.parse(r.created_at)||Date.now(),text:r.status==='paid'?'ชำระเงินผ่าน Stripe สำเร็จ':'เปิดหน้าชำระเงิน ยังไม่จ่าย'}]}));
  D.orders=real.concat((D.orders||[]).filter(o=>o.src!=='stripe'));
}
let lastSync=0,syncing=false;
async function autoSync(force){
  if(!sb||!sbSession||syncing)return;
  if(!force&&Date.now()-lastSync<60e3)return;
  syncing=true;S.syncMsg='กำลังดึงออเดอร์ล่าสุดจาก Stripe...';render(true);
  try{const j=await adminApi('/api/orders-sync');if(j.ok){await loadOrders();lastSync=Date.now();S.syncMsg='';}else S.syncMsg='ดึงจาก Stripe ไม่สำเร็จ: '+(j.error||'');}
  catch(e){S.syncMsg='เชื่อมต่อ Stripe ไม่ได้';}

function square(file){
  const SIZE=1200;
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{
      const im=new Image();
      im.onerror=rej;
      im.onload=()=>{
        const c=document.createElement('canvas');
        c.width=SIZE;c.height=SIZE;
        const g=c.getContext('2d');
        g.fillStyle='#fff';g.fillRect(0,0,SIZE,SIZE);
        g.imageSmoothingQuality='high';
        const k=Math.min(SIZE/im.width,SIZE/im.height);
        const w=Math.round(im.width*k),h=Math.round(im.height*k);
        g.drawImage(im,Math.round((SIZE-w)/2),Math.round((SIZE-h)/2),w,h);
        let q=.86,url=c.toDataURL('image/jpeg',q);
        while(url.length>380000&&q>.55){q-=.08;url=c.toDataURL('image/jpeg',q);}
        res({url,w:im.width,h:im.height});
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init',String(id));pixelReady=true;
}
function track(name,data){
  if(pixelReady&&FB_EVENTS[name]&&!hasAdminAccess()){ // ไม่นับการเข้าดูของแอดมินเอง
    try{const d=Object.assign({},data||{});delete d.campaign;fbq('track',name,d);}catch(e){}
  }
  D.events.unshift({t:Date.now(),name,data:data||{}});
  D.events=D.events.slice(0,60);saveCache();
}
const getProduct=id=>D.products.find(p=>p.id===id);
const validLink=l=>l&&/^https?:\/\//.test(l)&&!l.includes('ใส่ลิงก์');
const linkBtn=(l,label)=>validLink(l)?`<a class="btn btn-cta btn-block" href="${esc(l)}" target="_blank" rel="noopener noreferrer">${label}</a>`:`<p class="fine" style="color:var(--bad)">ลิงก์ดาวน์โหลดยังไม่ถูกตั้งค่า ทางร้านจะส่งไฟล์ให้ทางแชทโดยตรง</p>`;
const getOrder=id=>D.orders.find(o=>o.id===id);
function curProduct(){return getProduct(S.productId)||D.products.find(p=>p.status==='published')||D.products[0]||null;}
function calc(p,code){
  const base=Number(p.price)||0;
  const c=D.coupons.find(x=>x.active&&x.code===code&&(x.scope==='all'||x.scope===p.id));
  let d=0;
  if(c)d=c.type==='percent'?Math.round(base*c.value/100):Math.min(c.value,base);
  d=Math.max(0,Math.min(d,base-1));
  return{base,discount:d,total:base-d,coupon:c||null};
}
function newId(){
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  return 'DP'+String(d.getFullYear()).slice(2)+p(d.getMonth()+1)+p(d.getDate())+'-'+Math.random().toString(36).slice(2,6).toUpperCase();
}
function markPaid(o,note){
  o.status='paid';o.paidAt=Date.now();
  o.log.push({t:Date.now(),text:note||'ได้รับเงินแล้ว (จำลอง)'});
  o.log.push({t:Date.now()+1,text:'ส่งลิงก์ดาวน์โหลดไปที่ '+o.email});
  const c=D.coupons.find(x=>x.code===o.coupon);if(c)c.uses++;
  track('Purchase',Object.assign({content_name:o.pname,value:o.amount,currency:'THB',event_id:o.id},o.campaign?{campaign:o.campaign}:{}));
  save();
}
function selectProduct(id){S.productId=id;S.coupon='';S.form.coupon='';S.couponErr='';S.err='';S.form.bump=false;}
function toast(msg){
  S.toast=msg;drawToast();
  clearTimeout(toast._t);toast._t=setTimeout(()=>{S.toast='';drawToast();},2600);
}
function drawToast(){$('#toast-root').innerHTML=S.toast?`<div class="toast" role="status">${esc(S.toast)}</div>`:'';}
function prodStats(p){
  const os=D.orders.filter(o=>o.productId===p.id);
  const paid=os.filter(o=>o.status==='paid');
  return{total:os.length,paid:paid.length,revenue:paid.reduce((a,o)=>a+o.amount,0)};
}

function paySafe(){return `<p class="paysafe"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>ชำระผ่าน <b class="stripe-w">stripe</b> เข้ารหัสมาตรฐานเดียวกับธนาคาร ร้านไม่เห็นและไม่เก็บเลขบัตรของคุณ</span></p>`;}
function fakeQR(seedStr){
  let h=2166136261;for(const ch of seedStr){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}
  const rnd=()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};
  const N=25,Q=2;let r='';
  const finder=(x,y)=>`<rect x="${x+Q}" y="${y+Q}" width="7" height="7" fill="#0F1B33"/><rect x="${x+Q+1}" y="${y+Q+1}" width="5" height="5" fill="#fff"/><rect x="${x+Q+2}" y="${y+Q+2}" width="3" height="3" fill="#0F1B33"/>`;
  const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(inF(x,y))continue;if(rnd()>.5)r+=`<rect x="${x+Q}" y="${y+Q}" width="1" height="1" fill="#0F1B33"/>`;}
  return `<svg viewBox="0 0 ${N+Q*2} ${N+Q*2}" shape-rendering="crispEdges" role="img" aria-label="QR จำลอง"><rect width="${N+Q*2}" height="${N+Q*2}" fill="#fff"/>${r}${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}</svg>`;
}

const ymd=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const dmy=k=>{const [y,m,d]=k.split('-');return Number(d)+' '+['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][Number(m)-1];};
function salesChart(paidAll){
  const N=S.range||30,days=[],map={};
  const start=new Date();start.setHours(0,0,0,0);
  for(let i=N-1;i>=0;i--){const k=ymd(start.getTime()-i*864e5);days.push(k);map[k]={rev:0,n:0};}
  paidAll.forEach(o=>{const k=ymd(o.paidAt||o.created);if(map[k]){map[k].rev+=Number(o.amount)||0;map[k].n++;}});
  const max=Math.max(1,...days.map(k=>map[k].rev));
  const W=640,H=200,padL=8,padR=8,padT=14,padB=26,iw=W-padL-padR,ih=H-padT-padB;
  const gap=2,bw=Math.max(2,iw/N-gap);
  const y=v=>padT+ih-(v/max)*ih;
  const nice=v=>v>=1000?(v/1000).toFixed(v%1000?1:0)+'k':String(Math.round(v));
  const grid=[0.5,1].map(f=>`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${y(max*f)}" y2="${y(max*f)}"/><text class="ylab" x="${padL}" y="${y(max*f)-3}">฿${nice(max*f)}</text>`).join('');
  const every=N<=7?1:N<=30?5:15;
  const bars=days.map((k,i)=>{const v=map[k].rev,x=padL+i*(iw/N)+gap/2,h=v?Math.max(4,ih*v/max):0,top=y(v);
    const sel=S.chartDay===k,dim=S.chartDay&&!sel;
    const r=Math.min(4,bw/2);
    const d=v?`M${x},${padT+ih} V${top+r} q0,-${r} ${r},-${r} h${bw-2*r} q${r},0 ${r},${r} V${padT+ih} Z`:'';
    return `<g data-a="pickDay" data-d="${k}"><rect x="${x-gap/2}" y="${padT}" width="${bw+gap}" height="${ih}" fill="transparent"/>${v?`<path class="bar ${sel?'sel':dim?'dim':''}" d="${d}"><title>${dmy(k)}: ฿${v.toLocaleString('th-TH')} · ${map[k].n} ออเดอร์</title></path>`:''}
      ${i%every===0||N<=7?`<text class="axis" x="${x+bw/2}" y="${H-8}" text-anchor="middle">${dmy(k)}</text>`:''}</g>`;}).join('');
  const total=days.reduce((a,k)=>a+map[k].rev,0),cnt=days.reduce((a,k)=>a+map[k].n,0);
  const pick=S.chartDay&&map[S.chartDay];
  return `<div class="chart">

      <div><b>ยอดขายรายวัน</b> <span class="muted">· ${N} วันล่าสุด รวม ${baht(total)} · ${cnt} ออเดอร์</span></div>
      <div class="chips">${[7,30,90].map(r=>`<button class="chip" data-a="range" data-v="${r}" aria-pressed="${N===r}">${r} วัน</button>`).join('')}</div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟยอดขายรายวัน ${N} วันล่าสุด">${grid}<line class="grid" x1="${padL}" x2="${W-padR}" y1="${padT+ih}" y2="${padT+ih}"/>${bars}</svg>
    <p class="fine" style="margin-top:6px">แตะแท่งเพื่อดูออเดอร์ของวันนั้น</p>
    ${pick?`<div class="daypick"><span><b>${dmy(S.chartDay)}</b> · ${baht(pick.rev)} · ${pick.n} ออเดอร์ (รายการด้านล่างกรองเฉพาะวันนี้)</span><button class="btn btn-line btn-sm" data-a="pickDay" data-d="${S.chartDay}">ดูทุกวัน</button></div>`:''}
    <details style="margin-top:8px"><summary class="fine">ดูเป็นตารางรายวัน</summary>
      <table><tr><th>วันที่</th><th>ออเดอร์</th><th>ยอดขาย</th></tr>${days.slice().reverse().filter(k=>map[k].n).map(k=>`<tr><td>${dmy(k)}</td><td>${map[k].n}</td><td>${baht(map[k].rev)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">ยังไม่มียอดขายในช่วงนี้</td></tr>'}</table></details>
  </div>`;
}

/* ตรวจลิงก์ไฟล์ของทุกสินค้าอัตโนมัติเมื่อเปิดแท็บสินค้า (ผลเก็บไว้ 5 นาที) */
const linkStatus={};
async function checkAllLinks(force){
  if(!sb||!sbSession)return;
  for(const p of D.products){
    if(!p.link||!validLink(p.link)){linkStatus[p.id]=privLoaded?{ok:false,text:'ยังไม่ได้ใส่ลิงก์ไฟล์',t:Date.now()}:{unknown:true,text:'ยังโหลดข้อมูลลิงก์ไฟล์ไม่ได้ (เซสชันอาจหมดอายุ) รีเฟรชหน้าหรือล็อกอินใหม่',t:0};continue;}
    const cur=linkStatus[p.id];
    if(!force&&cur&&cur.url===p.link&&Date.now()-cur.t<300e3)continue;
    linkStatus[p.id]={pending:true,text:'กำลังตรวจ...',url:p.link,t:Date.now()};render(true);
    try{const j=await adminApi('/api/link-check?url='+encodeURIComponent(p.link));
      if(j.ok||j.status)linkStatus[p.id]={ok:!!j.ok,text:j.text||j.error||'ตรวจไม่ได้',url:p.link,t:Date.now()};
      else linkStatus[p.id]={unknown:true,text:'ยังตรวจไม่ได้ ('+(j.error||'เชื่อมต่อไม่ได้')+') กด "ตรวจลิงก์" อีกครั้ง',url:p.link,t:0};}
    catch(e){linkStatus[p.id]={unknown:true,text:'ยังตรวจไม่ได้ (เชื่อมต่อไม่ได้) กด "ตรวจลิงก์" อีกครั้ง',url:p.link,t:0};}
    if(!sbSession)break;
    render(true);
  }
}
function linkBadge(p){const c=linkStatus[p.id];if(!c)return '';const cls=c.pending||c.unknown?'gray':c.ok?'ok':'bad';return `<span class="badge ${cls}" title="${esc(c.text)}">ไฟล์: ${c.pending?'กำลังตรวจ':c.unknown?'ยังไม่ได้ตรวจ':c.ok?'เปิดได้ ✓':'มีปัญหา ✗'}</span>`;}
function linkCheckMsg(id){const c=S.linkCheck;if(!c||c.id!==id)return '';return `<div class="fine" style="margin-top:6px;color:${c.pending?'var(--muted)':c.ok?'var(--ok)':'var(--bad)'}">${esc(c.text)}${!c.pending&&c.url?` · <a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">เปิดดู</a>`:''}</div>`;}

const BKK=7*3600e3;
const POLITE={hr:'ค่ะ',clip:'ครับ',market:'ค่ะ',guard:'ครับ',factory:'ครับ',writer:'ค่ะ',community:'ค่ะ',care:'ค่ะ',designer:'ค่ะ',manager:'ครับ',analyst:'ครับ',product:'ครับ',finance:'ครับ',trend:'ครับ'};
function teamStatus(k){
  const sc=SCHED[k];const m=TEAM[k]||{};
  const last=POSTS.filter(x=>x.source===k).map(x=>Date.parse(x.created_at)).sort((a,b)=>b-a)[0]||null;
  if(!sc)return{state:m.sched===''?'owner':'off',last,next:null};
  const now=Date.now();const base=new Date(now+BKK);let cur=null,next=null,prev=null;
  for(let d=-31;d<=45&&!next;d++){
    const day=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth(),base.getUTCDate()+d));
    const ok=sc.dow?sc.dow.includes(day.getUTCDay()):day.getUTCDate()===sc.dom;
    if(!ok)continue;
    for(const [h,mi] of sc.times){const t=Date.UTC(day.getUTCFullYear(),day.getUTCMonth(),day.getUTCDate(),h,mi)-BKK;
      if(now>=t&&now<t+sc.dur*60e3)cur=t;else if(t>now){if(!next)next=t;}else prev=t;}
  }
  let state='idle';
  if(cur)state='on';
  else if(last&&now-last<15*60e3)state='done';
  else if(prev&&(!last||last<prev)){state=now-prev<3*3600e3?'late':'missed';}
  return{state,last,next,prev};
}
const thDay=t=>{const d=new Date(t+BKK);const names=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];const today=new Date(Date.now()+BKK);
  const sameDay=d.getUTCDate()===today.getUTCDate()&&d.getUTCMonth()===today.getUTCMonth();const hm=String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');
  const diff=Math.round((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(today.getUTCFullYear(),today.getUTCMonth(),today.getUTCDate()))/864e5);
  return (sameDay?'วันนี้ ':diff===1?'พรุ่งนี้ ':'วัน'+names[d.getUTCDay()]+' ')+hm;};
function statusText(k){
  const st=teamStatus(k),p=POLITE[k]||'ค่ะ';
  switch(st.state){
    case 'owner':return '';
    case 'off':return 'ตำแหน่งว่าง รอรับสมัคร';
    case 'on':return 'ทำงานอยู่'+p;
    case 'done':return 'เพิ่งส่งงานเสร็จ'+p;
    case 'late':return 'สายนิดหน่อย'+p+' 😅';
    case 'missed':return 'รอบที่แล้วไม่ได้ส่งงาน'+p+' 🙏';
    default:{const h=new Date(Date.now()+BKK).getUTCHours();
      if(st.next&&st.next-Date.now()<6*3600e3)return 'ว่างอยู่'+p+' เดี๋ยว'+thDay(st.next).replace('วันนี้ ','')+' มีงาน';
      if(h>=22||h<7)return 'นอกเวลางาน'+p+' กลับมา'+(st.next?thDay(st.next):'');
      return 'ว่างอยู่'+p+' รอบหน้า'+(st.next?thDay(st.next):'');}
  }
}

function adDraft(p,v){

function ensureAd(){
  if(!D.products.length)return null;

/* อารมณ์ของสมาชิก: คำนวณจากผลงานจริง 7 วันล่าสุด (ไม่ใช้ AI เพิ่ม) */
function mood(k){
  const now=Date.now(),D=864e5;
  const notes=POSTS.filter(p=>p.source===k&&(p.status==='note'||p.status==='log')&&p.kind!=='reply'&&p.kind!=='chat').sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at));
  const last=notes[0],lastT=last?String(last.text||''):'',age=last?(now-Date.parse(last.created_at))/D:99;
  const wk=POSTS.filter(p=>p.status!=='note'&&p.status!=='log'&&now-Date.parse(p.created_at)<7*D);
  const M=(e,t,why)=>({e,t,why});
  switch(k){
    case 'writer':{const mine=wk.filter(p=>p.source==='writer');const R=mine.filter(p=>p.status==='rejected').length,A=mine.filter(p=>['approved','published'].includes(p.status)).length,W=mine.filter(p=>p.status==='draft').length;
      if(R>=2)return M('😣','เซ็งนิดๆ โดนปัดตก '+R+' ชิ้น','สัปดาห์นี้มีโพสต์ถูกพี่ต้นปัดตก '+R+' ชิ้น');
      if(R===1)return M('😅','โดนแก้ 1 ชิ้น ตั้งใจใหม่','มีโพสต์ถูกปัดตก 1 ชิ้นสัปดาห์นี้');
      if(W>0)return M('🤞','ลุ้นผลตรวจ '+W+' ชิ้น','ส่งร่างแล้ว '+W+' ชิ้น รอพี่ต้นตรวจ');
      if(A>=5)return M('😄','ฟิน งานผ่านรัวๆ','ผ่านการอนุมัติ '+A+' ชิ้นในสัปดาห์นี้');
      if(A>0)return M('🙂','พอใจ งานผ่าน '+A+' ชิ้น','ผ่านการอนุมัติ '+A+' ชิ้น');
      return M('✍️','กำลังคิดหัวข้อใหม่','ยังไม่มีงานเข้าระบบสัปดาห์นี้');}
    case 'designer':{if(/ไม่ผ่าน|ต้องแก้|แก้ใหม่/.test(lastT)&&age<8)return M('😤','งานเข้า รูปต้องแก้','รายงานล่าสุดมีรูปไม่ผ่านเกณฑ์');
      if(/ผ่าน/.test(lastT)&&age<8)return M('😌','สบายใจ รูปผ่านหมด','รูปล่าสุดผ่านเกณฑ์');
      return M('🎨','รอตรวจรูปชุดใหม่','ยังไม่มีรูปให้ตรวจรอบนี้');}
    case 'trend':{if(age<3)return M('🤩','เจอของใหม่มาเล่า','เพิ่งส่งลิสต์หัวข้อเมื่อไม่นาน');
      if(age<8)return M('🧐','กำลังส่องเทรนด์','ส่งงานล่าสุด '+Math.round(age)+' วันก่อน');
      return M('😶','เงียบมานาน','ไม่ได้ส่งงานเกิน 1 สัปดาห์');}
    case 'community':{const m=lastT.match(/รอตอบ\s*(\d+)/);const n=m?Number(m[1]):0;
      if(n>=6&&age<2)return M('😵','มือเป็นระวิง คอมเมนต์ '+n,'คอมเมนต์รอตอบ '+n+' รายการ');
      if(n>=1&&age<2)return M('😊','มีคนมาคุยด้วย','มีคอมเมนต์รอตอบ '+n+' รายการ');
      return M('😴','เงียบ รอคอมเมนต์','ไม่มีคอมเมนต์ใหม่รอบล่าสุด');}
    case 'analyst':{if(/ซื้อ\s*0\b|ยังไม่มีคนซื้อ|ไม่มีการซื้อ|ซื้อ 0 /.test(lastT)&&age<3)return M('😟','กังวล แอดยังไม่คุ้ม','รายงานล่าสุด: ใช้งบแล้วยังไม่มียอดซื้อ');
      if(/ซื้อ\s*[1-9]/.test(lastT)&&age<3)return M('🤓','ตัวเลขดูดี','รายงานล่าสุดมียอดซื้อจากแอด');
      return M('📊','กำลังดูตัวเลข','รอรอบรายงานถัดไป');}
    case 'manager':{const failed=POSTS.filter(p=>p.status==='failed').length,own=POSTS.filter(p=>p.status==='needs_owner').length;const plan=POSTS.find(p=>p.status==='note'&&p.kind==='plan'&&now-Date.parse(p.created_at)<7*D);
      if(failed)return M('😠','หงุดหงิด มีโพสต์ล้ม '+failed,'มีโพสต์ขึ้นไม่สำเร็จ '+failed+' ชิ้น');
      if(own)return M('🤔','รอคุณแดนตัดสิน '+own+' เรื่อง','ส่งเรื่องให้เจ้าของแล้ว '+own+' รายการ');
      if(plan)return M('😎','คุมเกมอยู่ แผนพร้อม','มีแผนสัปดาห์นี้แล้ว');
      return M('📋','เตรียมประชุมทีม','ยังไม่มีแผนสัปดาห์นี้');}
    case 'factory':{const j=FJOBS||[];if(j.some(x=>x.status==='producing'))return M('🔥','กำลังผลิตเต็มกำลัง','มีงานอยู่ในสายพาน');
      if(j.some(x=>x.status==='queued'))return M('🧰','มีใบสั่งรอ พร้อมลุย','มีใบสั่งรอผลิต');
      if(j.some(x=>x.status==='done'&&now-Date.parse(x.done_at||0)<3*D))return M('😮‍💨','เพิ่งส่งงานเสร็จ','ผลิตเสร็จภายใน 3 วันนี้');
      return M('😴','ว่าง รอใบสั่ง','ไม่มีงานในคิว');}
    case 'product':return age<35?M('💡','มีไอเดียสินค้าใหม่','ส่งข้อเสนอเดือนนี้แล้ว'):M('🗓️','รอรอบสิ้นเดือน','ยังไม่ถึงรอบรายงาน');
    case 'finance':return /ยอดขาย\s*0|0 ออเดอร์|ไม่มียอดขาย/.test(lastT)&&age<8?M('😐','เดือนนี้ยังเงียบ','ยอดขายสัปดาห์นี้ยังไม่มี'):M('🧮','ตัวเลขเรียบร้อย','บัญชีเป็นปัจจุบัน');
    case 'care':return M('☕','สแตนด์บาย','ยังไม่เปิดใช้งาน');

  ${onlineStrip()}

  ${CHAT.fastUntil>Date.now()&&!(CHAT.next_at&&Date.parse(CHAT.next_at)-Date.now()<15*60e3)?`<div class="msg typing">${ava('writer',1)}<div><div class="who">ทีม</div><div class="bub">กำลังพิมพ์…</div></div></div>`:''}

  ${DOCS.err?`<p class="fine" style="color:var(--bad)">${esc(DOCS.err)}</p>`:''}

  ${DOCS.links===null?(DOCS.err?'':'<p class="fine">กำลังโหลด...</p>'):links.length?Object.keys(cats).map(c=>`${Object.keys(cats).length>1||c!=='อื่นๆ'?`<p class="fine" style="margin:6px 0">${esc(c)}</p>`:''}<div class="docgrid">${cats[c].map(l=>docCard(l,true)).join('')}</div>`).join(''):'<p class="fine">ยังไม่มี เพิ่มลิงก์ที่ใช้บ่อยไว้ตรงนี้ เช่น ไดรฟ์ไฟล์ต้นฉบับชีท บัญชีธนาคาร หรือหน้าจัดการโดเมน</p>'}

  ${DOCS.files.length?`<div class="docgrid">${DOCS.files.map(f=>docCard({title:f.title,url:f.file_url,note:`${f.pages?f.pages+' หน้า · ':''}${f.price?f.price+' บาท':'แจกฟรี'}${f.done_at?' · เสร็จ '+fmt(f.done_at):''}`},false)).join('')}</div>`:'<p class="fine">ยังไม่มีไฟล์ที่ผลิตเสร็จ ใบสั่งที่รออยู่ดูได้ในแท็บทีม</p>'}

function render(keep){
  const y=window.scrollY,v=S.view;

    case 'reset':
      if(S.confirm==='reset'){D=normalize(seed());save();S.confirm='';S.coupon='';S.productId=null;S.open={};S.edit=null;render(true);toast('รีเซ็ตแล้ว');}
      else{S.confirm='reset';render(true);}break;
  }
}
document.addEventListener('keydown',e=>{
  if(S.zoom==null)return;
  if(e.key==='Escape'){S.zoom=null;drawLB();}
  else if(e.key==='ArrowRight')act('zoomNext',{dataset:{}});
  else if(e.key==='ArrowLeft')act('zoomPrev',{dataset:{}});
});
document.addEventListener('click',e=>{
  const tr=e.target.closest('[data-track]');
  if(tr){const p=curProduct();if(p)track(tr.dataset.track,Object.assign({content_name:p.name,value:p.price,currency:'THB'},S.src?{campaign:S.src}:{}));}
  const el=e.target.closest('[data-a]');if(el)act(el.dataset.a,el);
});
document.addEventListener('input',e=>{
  const t=e.target,ds=t.dataset||{};
  if(ds.f)S.form[ds.f]=t.value;
  if(ds.d&&S.draft)S.draft[ds.d]=t.value;
  if(ds.ad&&S.ad){S.ad[ds.ad]=t.value;adLive(ds.ad);}
  if(ds.cf&&S.cfgDraft){const [mk,fk]=ds.cf.split('|');const m=S.cfgDraft.members[mk];if(m){if(fk==='__note')m.note=t.value;else m.fields[fk]=t.value;}}
  if(ds.cfg&&S.cfgDraft){S.cfgDraft.global[ds.cfg]=t.type==='checkbox'?t.checked:t.value;}
});
document.addEventListener('scroll',e=>{const t=e.target;if(t&&t.id==='sp-car'){const c=document.getElementById('sp-count');if(c){const n=t.children.length;const i=Math.round(t.scrollLeft/Math.max(1,t.clientWidth));c.textContent='📷 '+(Math.min(n,i+1))+'/'+n;}const th=document.querySelectorAll('#sp-thumbs .sp-th');const ii=Math.round(t.scrollLeft/Math.max(1,t.clientWidth));th.forEach((b,k)=>b.classList.toggle('on',k===ii));}},true);
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='method'){S.method=t.value;render(true);}
  else if(t.id==='brief-files'){const ta=document.getElementById('brief-text');S.briefDraft=ta?ta.value:'';S.briefFiles=[...(S.briefFiles||[]),...Array.from(t.files||[])].slice(0,8);render(true);}
  else if(t.id==='pick'){selectProduct(t.value);const p=curProduct();if(p)track('ViewContent',{content_name:p.name,value:p.price,currency:'THB'});render(false);}
  else if(t.id==='src'){S.src=t.value;}
  else if(t.id==='ad-p'){const p=getProduct(t.value);S.ad.pid=p.id;S.ad.camp='';Object.assign(S.ad,adDraft(p,S.ad.var));render(true);}
  else if(t.id==='ad-cta'){S.ad.cta=t.value;render(true);}
  else if(t.id==='ad-camp'){S.ad.camp=t.value;render(true);}
  else if(t.id==='e-img'){addImages(t.files);t.value='';}
  else if(t.id==='e-pdf'){const f=t.files&&t.files[0];t.value='';if(f)makePreviews(f);}
  else if(t.id==='e-pvpages'){S.pvPages=t.value;}
  else if(t.id==='pf'){S.pfilter=t.value;render(true);}
  else if(t.id==='f-bump'){S.form.bump=t.checked;render(true);}
});

document.addEventListener('submit',e=>{
  if(e.target.id==='login-form'){e.preventDefault();doLogin($('#l-email').value.trim(),$('#l-pass').value);}
});

/* ตรวจผลการชำระเงินกับเซิร์ฟเวอร์ (ซึ่งถามต่อ Stripe) แล้วแสดงลิงก์ดาวน์โหลด */
async function verifyOrder(){
  S.order=null;render(true);
  try{
    const r=await fetch('/api/order?session_id='+encodeURIComponent(S.sessionId));
    const j=await r.json();
    if(!j.ok)S.order={paid:false,error:j.error||'เกิดข้อผิดพลาด'};
    else S.order=j;
    if(j.ok&&j.paid){
      const k='purchased:'+S.sessionId;
      if(!localStorage.getItem(k)){ // ยิง Purchase ครั้งเดียวต่อออเดอร์ แม้รีเฟรชหน้า
        try{localStorage.setItem(k,'1');}catch(e){}
        track('Purchase',Object.assign({content_name:j.productName,value:j.amount,currency:j.currency||'THB'},S.src?{campaign:S.src}:{}));
      }
    }
  }catch(e){S.order={paid:false,error:'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'};}
  render(true);
  const c=document.getElementById('paid-card');if(c)c.scrollIntoView({block:'start'});
}
/* ---------- start ---------- */
function applyUrl(){
  try{
    const m=location.pathname.match(/\/p\/([a-z0-9-]+)\/?$/i);
    if(m){
      const p=D.products.find(x=>x.slug===m[1]);
      if(p)S.productId=p.id;
    }
    const q=new URLSearchParams(location.search);
    const camp=q.get('utm_campaign');
    if(camp)S.src=camp;
    const sid=q.get('session_id');if(sid&&/^cs_(live|test)_[A-Za-z0-9]+$/.test(sid))S.sessionId=sid;
    if(q.has('admin')||location.hash==='#admin')S.view=hasAdminAccess()?'admin':'login';
  }catch(e){}
}
let authWired=false;
function wireAuth(){
  authWired=true;
  sb.auth.onAuthStateChange((ev,session)=>{
    const was=!!sbSession;sbSession=session||null;
    if(ev==='SIGNED_IN'){reloginShown=false;S.relogin=false;if(!was)afterLogin();}
    else if(ev==='TOKEN_REFRESHED'){reloginShown=false;}
    else if(ev==='SIGNED_OUT'){if(S.relogin){S.relogin=false;S.view='login';render(false);return;}S.view='shop';S.tab='todo';S.edit=null;S.draft=null;loadRemote().then(()=>render(false));render(false);}
  });
}
setInterval(()=>{if(S.view==='admin'&&S.tab==='chat'&&sbSession&&document.visibilityState==='visible'&&!CHAT.loading){loadChat().then(()=>render(true));}},60e3);
setInterval(()=>{if(CHAT.fastUntil>Date.now()&&S.view==='admin'&&S.tab==='chat'&&sbSession&&!CHAT.loading){const n=(CHAT.msgs||[]).length;loadChat().then(()=>{render(true);if((CHAT.msgs||[]).length>n){const b=document.getElementById('chat-end');if(b)b.scrollIntoView({block:'end',behavior:'smooth'});}});}},8e3);
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible'||!sb||!sbSession)return;
  try{const {data}=await sb.auth.getSession();if(!data||!data.session)sessionLost();else sbSession=data.session;}catch(e){}
});
(async function boot(){
  const inline=window.__SHOP__;
  if(inline&&Array.isArray(inline.products)){ // ข้อมูลฝังมากับหน้า: แสดงได้ทันที
    const cached=load()||{};
    D=normalize(Object.assign({},cached,inline));remoteReady=true;saveCache();
  }
  const q=new URLSearchParams(location.search);
  const wantAdmin=q.has('admin')||location.hash==='#admin'||hasAdminToken();
  S.loading=!inline&&!load(); // ไม่มีข้อมูลฝังและไม่มีแคช: รอโหลดจากระบบก่อน
  applyUrl();
  render(false);
  if(wantAdmin||!inline){ // แอดมิน (หรือหน้าที่ไม่มีข้อมูลฝัง เช่นเปิดไฟล์ตรงๆ) ค่อยโหลดไลบรารีและดึงจากระบบ
    try{
      await loadSb();
      const {data}=await sb.auth.getSession();
      sbSession=data&&data.session||null;
      await loadRemote();
      if(needsMigrate&&sbSession){needsMigrate=false;await pushAll();}
      wireAuth();
    }catch(e){console.error(e);}
  }
  S.loading=false;
  applyUrl();
  initPixel(D.settings.pixelId);
  if(S.sessionId)verifyOrder();
  track('PageView');
  {const p=curProduct();if(p)track('ViewContent',{content_name:p.name,value:p.price,currency:'THB'});}
  render(false);
})();
</script>
