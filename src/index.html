<style>
:root{
  --bg:#EDF1F7;--surface:#FFFFFF;--ink:#0F1B33;--muted:#56637D;--line:#D3DBE8;
  --brand:#2440E8;--hero-ink:#FFFFFF;--accent:#FFD23F;--accent-ink:#0F1B33;
  --ok:#0F7A55;--okbg:#DDF3EA;--warn:#8A5300;--warnbg:#FCEBC8;--bad:#B42318;--badbg:#FBE1DE;
  --font-body:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun',system-ui,-apple-system,sans-serif;
  --font-head:'Mitr','Prompt','IBM Plex Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220;--surface:#131C30;--ink:#EAF0FF;--muted:#9AA7C4;--line:#27334F;
    --brand:#8EA0FF;
    --ok:#5FD3A5;--okbg:#0F3527;--warn:#F3B85B;--warnbg:#3A2A0A;--bad:#FF8F84;--badbg:#3F1512;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220;--surface:#131C30;--ink:#EAF0FF;--muted:#9AA7C4;--line:#27334F;
  --brand:#8EA0FF;
  --ok:#5FD3A5;--okbg:#0F3527;--warn:#F3B85B;--warnbg:#3A2A0A;--bad:#FF8F84;--badbg:#3F1512;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65}
h1,h2,h3{font-family:var(--font-head);font-weight:500;line-height:1.3;margin:0}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;word-break:break-all}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.wrap.wide{max-width:960px}
.muted{color:var(--muted)}
.fine{font-size:14px;color:var(--muted)}

/* demo bar */
 #pvw,#pvbtn{display:none}
body.pv-on #pvw{display:flex;flex-direction:column;gap:8px;position:fixed;z-index:60;background:var(--bg)}
.pvw-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pvw-phone{flex:1;min-height:0;border:1px solid var(--line);border-radius:22px;overflow:hidden;background:var(--surface);box-shadow:0 8px 28px rgba(15,27,51,.14)}
.pvw-phone iframe{display:block;width:100%;height:100%;border:0}
@media(min-width:1100px){body.pv-on #pvw{top:64px;right:16px;bottom:16px;width:400px}body.pv-on #app{margin-right:432px}#pvw .pvw-x{display:none}}
@media(max-width:1099px){body.pv-on:not(.pv-open) #pvw{display:none}body.pv-open #pvw{inset:0;padding:10px 10px 0}body.pv-open .pvw-phone{border-radius:16px 16px 0 0}body.pv-open{overflow:hidden}
  body.pv-on:not(.pv-open) #pvbtn{display:inline-flex;position:fixed;right:16px;bottom:16px;z-index:59;box-shadow:0 6px 20px rgba(15,27,51,.25)}}
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;max-width:960px;margin:0 auto}
.bar-note{font-size:13px;color:var(--muted);line-height:1.3}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;flex-shrink:0}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.urlbar{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 0}
.urlbar-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.urlbar select{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;max-width:100%}
.draftnote{background:var(--warnbg);color:var(--warn);padding:8px 16px;text-align:center;font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 22px;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.98)}

.btn-line:hover{border-color:var(--ink)}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn-block{width:100%}

/* hero */
.hero{background:var(--hero,#2440E8);color:var(--hero-ink);padding:36px 0 40px}

.hero .fine{color:var(--hero-ink);opacity:.8;margin-top:12px}
.cover{width:100%;max-width:300px;height:auto;justify-self:center}
@media(min-width:760px){.hero-in{grid-template-columns:1fr 1fr;align-items:center}}

/* sections */
.section{padding:34px 0}
.section h2{font-size:24px;margin-bottom:16px}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:12px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.field{display:grid;gap:6px;margin-bottom:14px}

.input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}

textarea.input{min-height:110px;resize:vertical}
.row{display:flex;gap:8px}
.row .input{flex:1;min-width:0}
.err{color:var(--bad);font-size:14px}

.methods{display:grid;gap:10px;margin-bottom:16px}

.method input{accent-color:var(--brand);width:18px;height:18px}
.sum{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;display:grid;gap:6px;margin-bottom:16px}
.sum div{display:flex;justify-content:space-between}
.sum .total{font-weight:600;font-size:18px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
summary{cursor:pointer;font-weight:500}
details p{margin-top:8px;color:var(--muted)}
footer{padding:28px 0 110px;text-align:center}

}

let reloginShown=false,privLoaded=false;
function sessionLost(){
  if(reloginShown)return;reloginShown=true;
  sbSession=null;S.relogin=true;S.err='เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่อีกครั้ง';S.view='login';render(false);
  try{if(sb)sb.auth.signOut({scope:'local'}).catch(()=>{});}catch(e){}
  toast('เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
}
async function authFetch(path,opts){
  opts=opts||{};
  const {data}=await sb.auth.getSession();
  let s=data&&data.session;
  if(!s){sessionLost();return {ok:false,error:'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'};}
  const go=tok=>fetch(path,Object.assign({},opts,{headers:Object.assign({},opts.headers||{},{Authorization:'Bearer '+tok})}));
  let r=await go(s.access_token);
  if(r.status===401){
    let fresh=null;try{const rr=await sb.auth.refreshSession();fresh=rr&&rr.data&&rr.data.session||null;}catch(e){}
    if(fresh){sbSession=fresh;r=await go(fresh.access_token);}
    if(r.status===401){sessionLost();return {ok:false,error:'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่'};}
  }
  return r.json();
}
async function adminApi(path){
  return authFetch(path);

function square(file){
  const SIZE=1200;
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{
      const im=new Image();
      im.onerror=rej;
      im.onload=()=>{
        const c=document.createElement('canvas');
        c.width=SIZE;c.height=SIZE;
        const g=c.getContext('2d');
        g.fillStyle='#fff';g.fillRect(0,0,SIZE,SIZE);
        g.imageSmoothingQuality='high';
        const k=Math.min(SIZE/im.width,SIZE/im.height);
        const w=Math.round(im.width*k),h=Math.round(im.height*k);
        g.drawImage(im,Math.round((SIZE-w)/2),Math.round((SIZE-h)/2),w,h);
        let q=.86,url=c.toDataURL('image/jpeg',q);
        while(url.length>380000&&q>.55){q-=.08;url=c.toDataURL('image/jpeg',q);}
        res({url,w:im.width,h:im.height});
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function pdfPreviewUrls(buf,spec,quiet){
    if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}
    const doc=await window.pdfjsLib.getDocument({data:buf}).promise;
    let pages=parsePages(spec,doc.numPages);if(!pages.length&&!String(spec||'').trim())pages=parsePages('1-4',doc.numPages);
    if(pages.length<2&&doc.numPages<3)pages=parsePages('1-4',doc.numPages); // ไฟล์สั้นไม่ถึงหน้า 3
    if(!pages.length)throw new Error('เลขหน้าไม่ถูกต้อง ไฟล์นี้มี '+doc.numPages+' หน้า');
    const urls=[];
    for(const n of pages){
      if(!quiet)toast('กำลังแปลงหน้า '+n+' ('+(urls.length+1)+'/'+pages.length+')');
      const pg=await doc.getPage(n);const v0=pg.getViewport({scale:1});const vp=pg.getViewport({scale:1100/v0.width});
      const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const x=c.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:x,viewport:vp}).promise;
      x.save();x.globalAlpha=.10;x.fillStyle='#2440E8';x.font='700 54px sans-serif';x.translate(c.width/2,c.height/2);x.rotate(-Math.PI/6);
      for(let yy=-c.height;yy<c.height;yy+=220)for(let xx=-c.width;xx<c.width;xx+=620)x.fillText('SheetLab · ตัวอย่าง',xx,yy);x.restore();
      x.fillStyle='rgba(15,27,51,.78)';x.fillRect(0,c.height-56,c.width,56);x.fillStyle='#fff';x.font='600 26px sans-serif';x.textAlign='center';x.fillText('ตัวอย่างหน้า '+n+' จาก '+doc.numPages+' หน้า · SheetLab',c.width/2,c.height-19);
      urls.push(await uploadImage(c.toDataURL('image/jpeg',.82)));
    }
    return {urls,from:pages[0]};
}

/* อัปโหลดไฟล์ PDF ของสินค้าขึ้นที่เก็บไฟล์ของร้าน (แทน Google Drive) แล้วใส่ลิงก์ ทำหน้าตัวอย่าง นับหน้าให้ */
async function uploadPdf(file){
  if(!S.draft||!file)return;if(!sb||!sbSession){toast('ต้องล็อกอินก่อนอัปโหลด');return;}
  if(file.size>45*1024*1024){toast('ไฟล์ใหญ่เกิน 45 MB ลองบีบอัด PDF ก่อน');return;}
  S.fileBusy=true;render(true);toast('กำลังอัปโหลดไฟล์ PDF...');
  try{
    const u=await authFetch('/api/content?action=file_uploadurl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name})});
    if(!u||!u.ok)throw new Error((u&&u.error)||'ขอที่อัปโหลดไม่ได้');
    const put=await fetch(u.upload_url,{method:'PUT',headers:{'Content-Type':'application/pdf','x-upsert':'true'},body:file});
    if(!put.ok)throw new Error('อัปโหลดไม่สำเร็จ ('+put.status+')');
    S.draft.link=u.file_url;
    try{if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}
      const doc=await window.pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const n=doc.numPages;
      if(!String(S.draft.specs||'').trim())S.draft.specs=`รูปแบบ | ไฟล์ PDF\nจำนวนหน้า | ${n} หน้า`;
      else if(!/จำนวนหน้า/.test(S.draft.specs))S.draft.specs+=`\nจำนวนหน้า | ${n} หน้า`;}catch(e){}
    toast('อัปโหลดไฟล์แล้ว กำลังทำหน้าตัวอย่าง...');
    S.fileBusy=false;render(true);
    if(!(S.draft.previews||[]).length)await makePreviews(file);
    toast('เรียบร้อย ลิงก์ไฟล์ หน้าตัวอย่าง และจำนวนหน้าใส่ให้แล้ว อย่าลืมกดบันทึก');
  }catch(e){console.error(e);toast('อัปโหลดไม่สำเร็จ: '+(e.message||e));}
  S.fileBusy=false;render(true);pvPost(0);
}
async function addImages(files){
  const room=5-S.draft.images.length,list=Array.from(files).slice(0,Math.max(0,room));

  for(const f of list){
    try{
      const r=await square(f);
      S.draft.images.push(await uploadImage(r.url));
      if(Math.max(r.w,r.h)<1200)small.push(f.name);
    }
    catch(e){console.error(e);toast('อัปโหลด '+f.name+' ไม่สำเร็จ: '+(e.message||e));}
  }

/* อัปโหลดภาพ (data URL จาก square()) ขึ้น Supabase Storage แล้วคืน URL สาธารณะ */
async function uploadImage(dataUrl){
  if(!sb||!sbSession)throw new Error('ต้องล็อกอินก่อนอัปโหลดภาพ');
  const blob=await (await fetch(dataUrl)).blob();
  const path='products/'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  const {error}=await sb.storage.from('product-images').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
  if(error)throw error;
  return sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;
}

const FB_EVENTS={PageView:1,ViewContent:1,InitiateCheckout:1,Purchase:1,Lead:1};
let pixelReady=false;
function initPixel(id){
  if(pixelReady||!/^\d{6,20}$/.test(String(id||'')))return;
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init',String(id));pixelReady=true;

function track(name,data){
  if(PV)return;
  if(pixelReady&&FB_EVENTS[name]&&!hasAdminAccess()){ // ไม่นับการเข้าดูของแอดมินเอง
    try{const d=Object.assign({},data||{}),eid=d.event_id;delete d.campaign;delete d.event_id;if(eid)fbq('track',name,d,{eventID:String(eid)});else fbq('track',name,d);}catch(e){} // eventID = รหัสออเดอร์ ให้ Facebook ตัดซ้ำกับ Conversions API ฝั่งเซิร์ฟเวอร์
  }
  D.events.unshift({t:Date.now(),name,data:data||{}});
  D.events=D.events.slice(0,60);saveCache();
}

function calc(p,code){
  const base=Number(p.price)||0;
  const c=D.coupons.find(x=>x.active&&x.code===code&&(x.scope==='all'||x.scope===p.id));
  let d=0;
  if(c)d=c.type==='percent'?Math.round(base*c.value/100):Math.min(c.value,base);
  d=Math.max(0,Math.min(d,base-1));
  return{base,discount:d,total:base-d,coupon:c||null};
}

async function bxCompose(d,books){

  const F=(w,sz)=>`${w} ${sz}px Mitr, Prompt, "IBM Plex Sans Thai", sans-serif`;
  try{await document.fonts.load(F(700,72),'กTOEIC');await document.fonts.load(F(600,40),'ก');}catch(e){}
  const g=x.createLinearGradient(0,0,0,W);g.addColorStop(0,'#F5F8FF');g.addColorStop(1,'#DCE5FB');x.fillStyle=g;x.fillRect(0,0,W,W);
  // หัวข้อ: บรรทัดเดียวถ้าย่อแล้วยังใหญ่พอ ไม่งั้นตัด 2 บรรทัด (ไม่แยก "10 เล่ม")
  const title=String(d.name||'').trim().replace(/(\d+)\s+(เล่ม|ชุด|ข้อ|คำ)/g,'$1 $2');x.fillStyle='#0F1B33';x.textBaseline='alphabetic';
  x.font=F(700,80);let tsz=Math.min(80,Math.floor(80*900/x.measureText(title).width));
  if(tsz>=58){x.font=F(700,tsz);x.fillText(title,60,150);}
  else{const words=title.split(' ');let L=[''];x.font=F(700,70);for(const w of words){const t=(L[L.length-1]+' '+w).trim();if(x.measureText(t).width>900&&L[L.length-1])L.push(w);else L[L.length-1]=t;}L.slice(0,2).forEach((l,k)=>x.fillText(l,60,110+k*82));}
  // ป้ายจำนวนเล่ม
  x.fillStyle='#E11D48';x.beginPath();x.arc(1085,118,82,0,Math.PI*2);x.fill();x.fillStyle='#fff';x.textAlign='center';x.font=F(800,74);x.fillText(String(books.length),1085,128);x.font=F(600,34);x.fillText('เล่ม',1085,170);x.textAlign='left';
  // ปกทุกเล่ม: ช่องสี่เหลี่ยมจัตุรัส แถวละไม่เกิน 4 เล่ม เต็มพื้นที่กลางภาพ
  const urls=bxRefs(books);const imgs=(await Promise.all(urls.map(u=>new Promise(r=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>r(im);im.onerror=()=>r(null);im.src=/^data:/.test(u)?u:u+(u.includes('?')?'&':'?')+'cv=1';})))).filter(Boolean);
  if(!imgs.length)throw new Error('ไม่มีปกให้จัด');
  const n=imgs.length,per=n<=4?n:n<=8?Math.ceil(n/2):4,rows=[];for(let k=0;k<n;k+=per)rows.push(imgs.slice(k,k+per));
  // แถวสุดท้ายสั้นกว่า: เกลี่ยให้แถวท้ายๆ ยาวพอกัน (10 เล่ม = 4/3/3)
  if(rows.length===3&&rows[2].length<3){const all=imgs.slice();rows.length=0;rows.push(all.slice(0,4),all.slice(4,7),all.slice(7));}
  const gap=22,areaT=210,areaB=990,tile=Math.floor(Math.min((1080-(per-1)*gap)/per,(areaB-areaT-(rows.length-1)*gap)/rows.length,330));
  const y0=areaT+((areaB-areaT)-(rows.length*tile+(rows.length-1)*gap))/2;
  rows.forEach((row,ri)=>{const k=row.length,x0=(W-(k*tile+(k-1)*gap))/2,y=y0+ri*(tile+gap);
    row.forEach((im,i)=>{const X=x0+i*(tile+gap);x.save();x.shadowColor='rgba(15,27,51,.30)';x.shadowBlur=22;x.shadowOffsetY=8;x.fillStyle='#fff';x.fillRect(X-4,y-4,tile+8,tile+8);x.restore();
      const s2=Math.min(im.width,im.height);x.drawImage(im,(im.width-s2)/2,(im.height-s2)/2,s2,s2,X,y,tile,tile);});});
  // ป้ายราคา
  const price=bxPrice(d);if(price){x.font=F(800,64);const t=price.toLocaleString('th-TH')+' บาท',tw=x.measureText(t).width;const bw=tw+60,bx2=W-60-bw,by=1003;
    x.fillStyle='#FFD23F';x.strokeStyle='#0F1B33';x.lineWidth=6;x.beginPath();x.roundRect?x.roundRect(bx2,by,bw,96,18):x.rect(bx2,by,bw,96);x.fill();x.stroke();x.fillStyle='#0F1B33';x.fillText(t,bx2+30,by+72);}

  return c.toDataURL('image/jpeg',.9);
}

function bundleData(d){ // ชุดจากช่องที่กรอกอยู่ (ยังไม่ตรวจ) ใช้ทั้งตอนบันทึกและหน้าตัวอย่างสด
  const name=String(d.name||'').trim(),slug=String(d.slug||'').trim().toLowerCase();
  const items=d.items.filter(id=>getProduct(id)&&!isBundle(getProduct(id)));
  const plans=d.plans.map(x=>({key:x.key,name:x.name,on:x.key==='basic'?true:!!x.on,price:Number(x.price)||0,fullPrice:Number(x.fullPrice)||0,features:String(x.features||'')}));
  const def=plans.find(x=>x.key===d.planDefault&&x.on)||plans.find(x=>x.on);
  const first=getProduct(items[0]);
  return {type:'bundle',sell:SELL[d.sell]?d.sell:'both',slug,name,kind:'book',headline:String(d.headline||'').trim()||name,desc:String(d.desc||'').trim(),color:d.color,status:d.status,items,freeItem:items.includes(d.freeItem)?d.freeItem:'',
    plans,planDefault:def.key,price:def.price,fullPrice:def.fullPrice,promoEnd:d.promoEndStr?new Date(d.promoEndStr).getTime():0,guarantee:String(d.guarantee||'').trim(),faq:d.faq||'',reviews:d.reviews||'',
    cover:d.cover||'',images:d.cover?[d.cover]:first&&first.images&&first.images[0]?[first.images[0]]:[],planLinks:Object.assign({},d.planLinks),link:''};
}
function saveBundleDraft(el){
  const d=S.draft,isNew=S.edit==='new',selfId=isNew?null:S.edit;
  const name=String(d.name).trim(),slug=String(d.slug).trim().toLowerCase();
  if(!name)return 'กรอกชื่อชุด';
  if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug))return 'ชื่อในลิงก์ใช้ได้เฉพาะ a-z ตัวเลข และ - เช่น toeic-750';
  if(slugTaken(slug,selfId))return 'ชื่อในลิงก์นี้ถูกใช้แล้ว';
  const items=d.items.filter(id=>getProduct(id)&&!isBundle(getProduct(id)));
  if(items.length<2)return 'ชุดต้องมีอย่างน้อย 2 เล่ม';
  const plans=bundleData(d).plans;
  for(const x of plans)if(x.on&&!(x.price>=1))return `ใส่ราคาขายของแพ็กเกจ ${x.name}`;
  for(const k of Object.keys(d.planLinks))for(const line of String(d.planLinks[k]||'').split('\n').filter(l=>l.trim())){const i=line.lastIndexOf('|');if(i<1||!/^https:\/\//.test(line.slice(i+1).trim()))return `ไฟล์เพิ่มของแพ็กเกจ ${k}: ใช้รูปแบบ "ชื่อไฟล์ | https://ลิงก์" บรรทัดละไฟล์`;}
  const data=bundleData(d);
  let saved;
  if(isNew){saved=Object.assign({id:'b'+Date.now().toString(36)},data);D.products.push(saved);}
  else{saved=getProduct(selfId);Object.assign(saved,data);}
  if(saved.status==='published'&&!saved.publishedAt)saved.publishedAt=Date.now();
  if(d.fromProp)propDone(d.fromProp,true);
  S.edit=null;S.draft=null;S.err='';save();
  if(el.dataset.then==='view'){selectProduct(saved.id);go('shop');}else{render(false);toast('บันทึกชุดแล้ว');}
  return '';
}

  if(/notion/.test(t)||p.cat==='notion')o.push('notion');if(['work','speak'].includes(p.cat)||/business|travel|ทำงาน|เที่ยว/.test(t)&&!o.includes('toeic'))o.push('work');
  if(!o.filter(k=>k!=='bundle').length)o.push('other');return o;}

async function findOrder(email){
  const f=S.find;f.email=email;f.err='';
  if(!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)){f.err='กรอกอีเมลให้ถูกต้อง เช่น name@gmail.com';render(true);return;}
  f.busy=true;render(true);
  try{const j=await fetch('/api/order?m=resend',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}).then(r=>r.json());
    if(j&&j.ok)f.done=true;else f.err=(j&&j.error)||'ส่งไม่สำเร็จ ลองใหม่อีกครั้ง';}
  catch(e){f.err='เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง';}
  f.busy=false;render(true);
}

function route(){
  const m=location.pathname.match(/\/p\/([a-z0-9-]+)\/?$/i);
  if(m){const p=D.products.find(x=>x.slug===m[1]);if(p)selectProduct(p.id);S.view='shop';const c=curProduct();document.title=c?c.name:TITLE0;if(c)track('ViewContent',{content_name:c.name,value:c.price,currency:'THB'});}
  else if(location.pathname==='/order'){S.view='order';document.title='หาออเดอร์ของฉัน · SheetLab';}
  else if(location.pathname==='/checkout'){S.view='cart';document.title='ชำระเงิน · SheetLab';if(!S.sessionId&&cartItems().length)track('InitiateCheckout',Object.assign({content_name:'เลือก '+cartItems().length+' เล่ม',value:cartTotal(),currency:'THB',num_items:cartItems().length},S.src?{campaign:S.src}:{}));}
  else{S.view=storeMode()?'store':'shop';document.title=TITLE0;}
  render(false);
}

function paySafe(){return `<p class="paysafe"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span>ชำระผ่าน <b class="stripe-w">stripe</b> เข้ารหัสมาตรฐานเดียวกับธนาคาร ร้านไม่เห็นและไม่เก็บเลขบัตรของคุณ</span></p>`;}
function fakeQR(seedStr){
  let h=2166136261;for(const ch of seedStr){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}
  const rnd=()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};
  const N=25,Q=2;let r='';
  const finder=(x,y)=>`<rect x="${x+Q}" y="${y+Q}" width="7" height="7" fill="#0F1B33"/><rect x="${x+Q+1}" y="${y+Q+1}" width="5" height="5" fill="#fff"/><rect x="${x+Q+2}" y="${y+Q+2}" width="3" height="3" fill="#0F1B33"/>`;
  const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(inF(x,y))continue;if(rnd()>.5)r+=`<rect x="${x+Q}" y="${y+Q}" width="1" height="1" fill="#0F1B33"/>`;}
  return `<svg viewBox="0 0 ${N+Q*2} ${N+Q*2}" shape-rendering="crispEdges" role="img" aria-label="QR จำลอง"><rect width="${N+Q*2}" height="${N+Q*2}" fill="#fff"/>${r}${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}</svg>`;
}

const ymd=t=>{const d=new Date(t),p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());};
const dmy=k=>{const [y,m,d]=k.split('-');return Number(d)+' '+['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][Number(m)-1];};
function salesChart(paidAll){
  const N=S.range||30,days=[],map={};
  const start=new Date();start.setHours(0,0,0,0);
  for(let i=N-1;i>=0;i--){const k=ymd(start.getTime()-i*864e5);days.push(k);map[k]={rev:0,n:0};}
  paidAll.forEach(o=>{const k=ymd(o.paidAt||o.created);if(map[k]){map[k].rev+=Number(o.amount)||0;map[k].n++;}});
  const max=Math.max(1,...days.map(k=>map[k].rev));
  const W=640,H=200,padL=8,padR=8,padT=14,padB=26,iw=W-padL-padR,ih=H-padT-padB;
  const gap=2,bw=Math.max(2,iw/N-gap);
  const y=v=>padT+ih-(v/max)*ih;
  const nice=v=>v>=1000?(v/1000).toFixed(v%1000?1:0)+'k':String(Math.round(v));
  const grid=[0.5,1].map(f=>`<line class="grid" x1="${padL}" x2="${W-padR}" y1="${y(max*f)}" y2="${y(max*f)}"/><text class="ylab" x="${padL}" y="${y(max*f)-3}">฿${nice(max*f)}</text>`).join('');
  const every=N<=7?1:N<=30?5:15;
  const bars=days.map((k,i)=>{const v=map[k].rev,x=padL+i*(iw/N)+gap/2,h=v?Math.max(4,ih*v/max):0,top=y(v);
    const sel=S.chartDay===k,dim=S.chartDay&&!sel;
    const r=Math.min(4,bw/2);
    const d=v?`M${x},${padT+ih} V${top+r} q0,-${r} ${r},-${r} h${bw-2*r} q${r},0 ${r},${r} V${padT+ih} Z`:'';
    return `<g data-a="pickDay" data-d="${k}"><rect x="${x-gap/2}" y="${padT}" width="${bw+gap}" height="${ih}" fill="transparent"/>${v?`<path class="bar ${sel?'sel':dim?'dim':''}" d="${d}"><title>${dmy(k)}: ฿${v.toLocaleString('th-TH')} · ${map[k].n} ออเดอร์</title></path>`:''}
      ${i%every===0||N<=7?`<text class="axis" x="${x+bw/2}" y="${H-8}" text-anchor="middle">${dmy(k)}</text>`:''}</g>`;}).join('');
  const total=days.reduce((a,k)=>a+map[k].rev,0),cnt=days.reduce((a,k)=>a+map[k].n,0);
  const pick=S.chartDay&&map[S.chartDay];
  return `<div class="chart">
    <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:8px">
      <div><b>ยอดขายรายวัน</b> <span class="muted">· ${N} วันล่าสุด รวม ${baht(total)} · ${cnt} ออเดอร์</span></div>
      <div class="chips">${[7,30,90].map(r=>`<button class="chip" data-a="range" data-v="${r}" aria-pressed="${N===r}">${r} วัน</button>`).join('')}</div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="กราฟยอดขายรายวัน ${N} วันล่าสุด">${grid}<line class="grid" x1="${padL}" x2="${W-padR}" y1="${padT+ih}" y2="${padT+ih}"/>${bars}</svg>
    <p class="fine" style="margin-top:6px">แตะแท่งเพื่อดูออเดอร์ของวันนั้น</p>
    ${pick?`<div class="daypick"><span><b>${dmy(S.chartDay)}</b> · ${baht(pick.rev)} · ${pick.n} ออเดอร์ (รายการด้านล่างกรองเฉพาะวันนี้)</span><button class="btn btn-line btn-sm" data-a="pickDay" data-d="${S.chartDay}">ดูทุกวัน</button></div>`:''}
    <details style="margin-top:8px"><summary class="fine">ดูเป็นตารางรายวัน</summary>
      <table><tr><th>วันที่</th><th>ออเดอร์</th><th>ยอดขาย</th></tr>${days.slice().reverse().filter(k=>map[k].n).map(k=>`<tr><td>${dmy(k)}</td><td>${map[k].n}</td><td>${baht(map[k].rev)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">ยังไม่มียอดขายในช่วงนี้</td></tr>'}</table></details>
  </div>`;
}

/* ตรวจลิงก์ไฟล์ของทุกสินค้าอัตโนมัติเมื่อเปิดแท็บสินค้า (ผลเก็บไว้ 5 นาที) */
const linkStatus={};
async function checkAllLinks(force){
  if(!sb||!sbSession)return;
  for(const p of D.products){
    if(isBundle(p))continue; // ชุดไม่มีไฟล์ของตัวเอง ใช้ไฟล์ของแต่ละเล่ม
    if(!p.link||!validLink(p.link)){linkStatus[p.id]=privLoaded?{ok:false,text:'ยังไม่ได้ใส่ลิงก์ไฟล์',t:Date.now()}:{unknown:true,text:'ยังโหลดข้อมูลลิงก์ไฟล์ไม่ได้ (เซสชันอาจหมดอายุ) รีเฟรชหน้าหรือล็อกอินใหม่',t:0};continue;}
    const cur=linkStatus[p.id];
    if(!force&&cur&&cur.url===p.link&&Date.now()-cur.t<300e3)continue;
    linkStatus[p.id]={pending:true,text:'กำลังตรวจ...',url:p.link,t:Date.now()};render(true);
    try{const j=await adminApi('/api/link-check?url='+encodeURIComponent(p.link));
      if(j.ok||j.status)linkStatus[p.id]={ok:!!j.ok,text:j.text||j.error||'ตรวจไม่ได้',url:p.link,t:Date.now()};

function pHints(p){
  const h=[],pub=p.status==='published',ls=linkStatus[p.id];
  if(isBundle(p)){const miss=bundleBooks(p).filter(b=>!b.link).length;if(miss)h.push(['bad',`${miss} เล่มในชุดยังไม่มีลิงก์ไฟล์`]);if(!bundlePlans(p).length)h.push(['bad','ยังไม่ตั้งราคาแพ็กเกจ']);}

    else if(!(p.link&&validLink(p.link)))h.push(['bad','ยังไม่ใส่ลิงก์ไฟล์ ลูกค้าจ่ายแล้วจะไม่ได้ไฟล์']);

    if(pfmt(p)==='pdf'&&!(p.previews||[]).length)h.push(['warn','ยังไม่มีหน้าตัวอย่าง']);
  }
  if(p.fresh&&!pub&&p.freshNote)h.unshift([/🎧/.test(p.freshNote)?'warn':'muted','✨ มาใหม่ · '+p.freshNote]);
  if(!h.length)h.push(pub?(prodStats(p).paid?['ok','พร้อมขาย']:['muted','พร้อมขาย · ยังไม่มียอดขาย']):['muted','ฉบับร่าง ลูกค้ายังไม่เห็น']);

}

/* ชีทขายที่โรงงานผลิตเสร็จ รอคุณแดนตรวจแล้วกดอนุมัติลงขาย (โรงงานไม่เคยลงขายเอง) */
const FAC={jobs:null,loading:false,busy:''};
function loadFacJobs(){if(FAC.loading)return;FAC.loading=true;adminApi('/api/content?action=factory').then(j=>{const all=j&&j.ok?j.jobs:[];FAC.jobs=all.filter(x=>x.status==='done'&&(x.listing==='pending'||(x.listing==='listed'&&x.product_id&&Number(x.price)>0&&!getProduct(x.product_id))));FAC.queue=all.filter(x=>['queued','producing'].includes(x.status));FAC.global=all.filter(x=>x.lang==='en'&&['global_pending','global'].includes(x.listing));}).catch(()=>{FAC.jobs=[];FAC.queue=[];FAC.global=[];}).then(()=>{FAC.loading=false;render(true);});}
/* 📦 ชุดพร้อมลงขาย: ชุดที่คิวหนังสือบนคอมคุณแดนผลิตเสร็จ (ไฟล์อัปขึ้นคลังแล้ว) กดลงขายทั้งชุดครั้งเดียว: สร้างเล่มที่ยังไม่มี + สร้างชุด */
const SETI={items:null,loading:false,busy:''};
function loadSets(){if(SETI.loading)return;SETI.loading=true;adminApi('/api/content?action=set_list').then(j=>{SETI.items=j&&j.ok?j.items:[];}).catch(()=>{SETI.items=[];}).then(()=>{SETI.loading=false;setAutoImport();render(true);});}
/* ชุดที่ส่งมาจากคอม: สร้างเป็นฉบับร่างในแท็บ "มาใหม่" ทันทีที่เปิดหลังบ้าน (ราคาตามที่ทีมเสนอ ขายเฉพาะในชุด) คุณแดนตรวจแล้วกดเผยแพร่เอง */
SETI.auto={};
function setAutoImport(){if(!sbSession||!D.products.length)return;
  for(const x of (SETI.items||[]).filter(y=>y.status==='pending'&&!SETI.auto[y.id])){SETI.auto[x.id]=1;
    const sum=x.books.reduce((a,b)=>{const ex=setMatch(b);return a+(ex?Number(ex.price)||0:Number(b.price)||0);},0);
    setListRun(x,{price:Number(x.price)||sum,full:sum,solo:false,pub:false,auto:true}).then(()=>{toast('📦 ชุดใหม่ "'+x.name+'" เข้าแท็บมาใหม่แล้ว ตรวจแล้วกดเผยแพร่');SETI.items=(SETI.items||[]).filter(y=>y.id!==x.id);render(true);}).catch(e=>{console.error(e);delete SETI.auto[x.id];});}}
function setListRun(x,{price,full,solo,pub,auto}){
  const old=D.products.find(p=>isBundle(p)&&p.fromSet===x.id); // กันสร้างซ้ำ (เปิดหลายแท็บ)
  if(old)return adminPost('/api/content?action=set_done',{id:x.id,bundle_id:old.id});
  const now=Date.now(),ids=[];let n=0;const audio=x.books.filter(b=>b.audio&&!setMatch(b)).length;
  for(const b of x.books){const ex=setMatch(b);if(ex){ids.push(ex.id);continue;}if(!b.file_url)continue;
    const p=Object.assign(blankProduct(),{id:'p'+(now+n++).toString(36),name:b.name||b.title,slug:setSlug(b.title||b.name),kind:'book',headline:b.title||b.name,desc:b.desc||'',price:b.price||0,fullPrice:0,features:b.features||'',forwho:b.forwho||'',specs:b.specs||'',link:b.file_url,cat:CATS[b.cat]?b.cat:'',images:b.cover?[b.cover]:[],previews:b.previews||[],status:solo?'published':'draft',publishedAt:solo?now:0,fromSet:x.id});
    D.products.push(p);ids.push(p.id);}
  const first=x.books[0]&&(setMatch(x.books[0])||{}),cover=(x.books.find(b=>b.cover)||{}).cover||((first.images||[])[0])||'';
  const fp=full>price?full:0;
  const bd=Object.assign(blankBundle(),{id:'b'+now.toString(36),name:x.name,slug:setSlug(x.name),headline:x.headline||x.name,desc:x.desc||'',items:ids,status:pub?'published':'draft',publishedAt:pub?now:0,planDefault:'basic',price,fullPrice:fp,images:cover?[cover]:[],faq:'',reviews:'',
    fromSet:x.id,fresh:!pub,freshNote:[`${ids.length} เล่ม · เล่มใหม่ขายเฉพาะในชุด`,x.note||'',audio?`🎧 ${audio} เล่มมีไฟล์เสียงผ่าน QR → อัป mp3 ขึ้น Google Drive และแชร์ก่อนเผยแพร่`:''].filter(Boolean).join(' · ')});
  bd.plans=bd.plans.map(pl=>pl.key==='basic'?Object.assign({},pl,{name:'ครบชุด '+ids.length+' เล่ม',on:true,price,fullPrice:fp,features:x.features||pl.features}):Object.assign({},pl,{on:false}));
  D.products.push(bd);save();clearTimeout(saveTimer);
  return flushRemote().then(ok=>{if(!ok)throw new Error('บันทึกไม่สำเร็จ');return adminPost('/api/content?action=set_done',{id:x.id,bundle_id:bd.id});}).then(()=>{SETI.items=(SETI.items||[]).map(y=>y.id===x.id?Object.assign({},y,{status:'listed'}):y);});
}
// จับคู่เล่มในชุดกับสินค้าที่ร้านมีอยู่แล้ว (ไม่สร้างซ้ำ) จากคำสำคัญ match
function setMatch(b){if(!b.match)return null;const m=String(b.match).toLowerCase();return D.products.find(p=>!isBundle(p)&&String(p.name).toLowerCase().includes(m))||null;}
function setImportBox(){
  if(SETI.items===null&&!SETI.loading)loadSets();
  const list=(SETI.items||[]).filter(x=>x.status==='pending');if(!list.length)return '';

function setBookState(b){

/* ส่งออกสินค้าไปลง Shopee/Lazada เอง: CSV (เปิดใน Excel ภาษาไทยได้) + ZIP รูปแยกโฟลเดอร์ตามสินค้า */
const exportList=()=>D.products.filter(p=>p.status==='published');
function exportDesc(p){
  const L=t=>String(t||'').split('\n').map(x=>x.trim()).filter(Boolean),pairs=t=>L(t).map(x=>x.replace(/\s*\|\s*/,': '));
  const notion=pfmt(p)==='notion';
  const parts=[p.headline&&p.headline!==p.name?p.headline:'',p.desc||'',
    L(p.features).length?'สิ่งที่ได้รับ\n'+L(p.features).map(x=>'✅ '+x).join('\n'):'',
    L(p.forwho).length?'เหมาะกับ\n'+L(p.forwho).map(x=>'• '+x).join('\n'):'',
    L(p.specs).length?'รายละเอียด\n'+pairs(p.specs).join('\n'):'',
    notion?'วิธีรับสินค้า\nได้ลิงก์เทมเพลต Notion กด Duplicate เข้า Notion ของตัวเอง ใช้ได้กับ Notion ฟรี ทั้งมือถือและคอม':'วิธีรับสินค้า\nเป็นไฟล์ PDF (สินค้าดิจิทัล) ไม่มีการจัดส่งสินค้าจริง'];
  return parts.filter(Boolean).join('\n\n').slice(0,3000);
}
function exportCsv(one){
  const list=one?[one]:exportList();if(!list.length){toast('ยังไม่มีสินค้าที่เผยแพร่');return;}
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const head=['SKU','ชื่อสินค้า','ราคาขาย','ราคาปกติ (ก่อนลด)','ประเภท','หมวด','คำอธิบายสินค้า','รูปที่ 1 (ปก)','รูปที่ 2','รูปที่ 3','รูปที่ 4','รูปที่ 5','ลิงก์หน้าขายบนเว็บ'];
  const rows=list.map(p=>{const im=(p.images||[]).slice(0,5);while(im.length<5)im.push('');
    return [p.slug,String(p.name||'').slice(0,120),Number(p.price)||0,Number(p.fullPrice)>Number(p.price)?Number(p.fullPrice):'',PFMT[pfmt(p)][1],CATS[p.cat]||'',exportDesc(p),...im,location.origin+'/p/'+p.slug];});
  const csv='﻿'+[head,...rows].map(r=>r.map(q).join(',')).join('\r\n'); // BOM ให้ Excel อ่านภาษาไทยถูก
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=(one?'sheetlab-'+one.slug:'sheetlab-products-'+new Date().toISOString().slice(0,10))+'.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
  toast(one?'ดาวน์โหลดข้อมูล "'+String(one.name||'').slice(0,30)+'" แล้ว':'ดาวน์โหลดข้อมูลสินค้า '+list.length+' รายการแล้ว');
}
async function exportImgs(one){
  const list=(one?[one]:exportList()).filter(p=>(p.images||[]).length);if(!list.length){toast(one?'สินค้านี้ยังไม่มีรูป':'ยังไม่มีรูปสินค้า');return;}
  S.zipBusy=one?one.id:true;render(true);
  try{
    if(!window.JSZip)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    const zip=new window.JSZip();let n=0;
    for(const p of list){const dir=one?zip:zip.folder(p.slug);
      for(const [i,u] of (p.images||[]).slice(0,9).entries()){

async function loadPosts(){
  if(!sb||!sbSession)return;
  const {data,error}=await sb.from('posts').select('*').order('created_at',{ascending:false}).limit(400);
  if(error){console.error(error);toast('โหลดคิวโพสต์ไม่ได้: '+error.message+(/relation|does not exist/i.test(error.message)?' (ยังไม่ได้สร้างตาราง posts)':''));return;}
  POSTS=data||[];postsLoaded=true;
}
async function updatePost(id,patch){
  const {error}=await sb.from('posts').update(patch).eq('id',id);
  if(error){toast('บันทึกไม่สำเร็จ: '+error.message);return false;}

function teamStatus(k){
  const sc=SCHED[k];const m=TEAM[k]||{};
  const last=POSTS.filter(x=>x.source===k).map(x=>Date.parse(x.created_at)).sort((a,b)=>b-a)[0]||null;
  if(!sc)return{state:m.sched===''?'owner':m.exec?'exec':'off',last,next:null};
  const now=Date.now();const base=new Date(now+BKK);let cur=null,next=null,prev=null;
  for(let d=-31;d<=45&&!next;d++){
    const day=new Date(Date.UTC(base.getUTCFullYear(),base.getUTCMonth(),base.getUTCDate()+d));
    const ok=sc.dow?sc.dow.includes(day.getUTCDay()):day.getUTCDate()===sc.dom;
    if(!ok)continue;
    for(const [h,mi] of sc.times){const t=Date.UTC(day.getUTCFullYear(),day.getUTCMonth(),day.getUTCDate(),h,mi)-BKK;
      if(now>=t&&now<t+sc.dur*60e3)cur=t;else if(t>now){if(!next)next=t;}else prev=t;}
  }

  if(cur)state='on';
  else if(last&&now-last<15*60e3)state='done';
  else if(prev&&(!last||last<prev)){state=now-prev<3*3600e3?'late':'missed';}

const thDay=t=>{const d=new Date(t+BKK);const names=['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];const today=new Date(Date.now()+BKK);

  const diff=Math.round((Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())-Date.UTC(today.getUTCFullYear(),today.getUTCMonth(),today.getUTCDate()))/864e5);
  return (sameDay?'วันนี้ ':diff===1?'พรุ่งนี้ ':'วัน'+names[d.getUTCDay()]+' ')+hm;};
function statusText(k){

/* 🔮 ประเมินรายได้จากงบแอด: ใช้ผลจริงของแอดแบบยอดขาย (ประวัติทั้งหมดจาก Facebook) + ออเดอร์จริงในร้าน · ประเมินอย่างเดียว ไม่ตั้งงบให้ */
const ADF={budget:1000,days:7};
function adfModel(){
  const h=ADST.d&&ADST.d.history;if(!h)return null;
  // ใช้เฉพาะแคมเปญที่วัดยอดซื้อได้ (มีการซื้ออย่างน้อย 1) · แคมเปญที่ใช้เงินแต่วัดยอดซื้อไม่ได้แยกไว้ให้ดู
  const sales=h.filter(x=>x.purchases>0);
  const clicks=h.filter(x=>!sales.includes(x));
  const spend=sales.reduce((a,x)=>a+x.spendTHB,0),n=sales.reduce((a,x)=>a+x.purchases,0),val=sales.reduce((a,x)=>a+x.valueTHB,0);
  const daily=sales.reduce((a,x)=>a+x.spendTHB/Math.max(1,x.days),0); // ที่แอดเคยใช้จริงต่อวัน (รวมทุกแคมเปญยอดขาย)
  const names=sales.map(x=>String(x.name).toLowerCase()),since=Math.min(...sales.map(x=>Date.parse(x.start)||Date.now()));
  const real=(D.orders||[]).filter(o=>o.status==='paid'&&o.campaign&&names.includes(String(o.campaign).toLowerCase())&&o.created>=since-864e5);
  const recent=(D.orders||[]).filter(o=>o.status==='paid'&&o.created>Date.now()-60*864e5&&o.amount>0);
  const aov=recent.length>=5?recent.reduce((a,o)=>a+o.amount,0)/recent.length:n&&val?val/n:179;
  return {sales,clicks,spend,n,val,daily,real:{n:real.length,v:real.reduce((a,o)=>a+o.amount,0)},aov,aovSrc:recent.length>=5?`ออเดอร์จริง ${recent.length} รายการ 60 วันล่าสุด`:'ที่ Facebook นับ'};
}
function adfCalc(m,budget,days){
  const c=m.spend/m.n,z=1.645,lo=Math.max(.5,m.n-z*Math.sqrt(m.n)),extra=m.n<20?1.5:m.n<50?1.25:1.1;
  const scale=Math.max(1,(budget/Math.max(1,days))/Math.max(1,m.daily)); // ใช้เงินต่อวันมากกว่าที่เคย ต้นทุนต่อการซื้อมักแพงขึ้น
  const cpa={bad:m.spend/lo*extra*Math.sqrt(scale),mid:c*Math.pow(scale,.25)*(m.n<20?1.3:1.1),good:c};
  cpa.mid=Math.min(Math.max(cpa.mid,cpa.good),cpa.bad);
  const r={};for(const k in cpa){const o=budget/cpa[k];r[k]={cpa:cpa[k],orders:o,rev:o*m.aov,profit:o*m.aov-budget};}
  return {r,scale,c};
}
function adfOut(){
  const m=adfModel();if(!m||!m.n)return '';
  const B=Math.max(0,Number(ADF.budget)||0),Dd=Math.max(1,Number(ADF.days)||7);if(!B)return '<p class="fine">ใส่งบก่อน</p>';
  const {r,scale}=adfCalc(m,B,Dd),money=n=>'฿'+Math.round(n).toLocaleString('th-TH'),rng=(a,b)=>a===b?a:a+'–'+b;
  const col=(k,l)=>{const x=r[k];return `<div class="adf-c adf-${k}"><span>${l}</span><b>${money(x.rev)}</b><small>${Math.round(x.orders)} ออเดอร์ · ต้นทุน ${money(x.cpa)}/ออเดอร์</small><em class="${x.profit>=0?'up':'down'}">${x.profit>=0?'กำไร':'ขาดทุน'} ${money(Math.abs(x.profit))}</em></div>`;};
  return `<p class="adf-sum">ใส่ค่าแอด <b>${money(B)}</b> ใน ${Dd} วัน (วันละ ${money(B/Dd)}) → คาดว่าได้ <b>${rng(Math.round(r.bad.orders),Math.round(r.good.orders))} ออเดอร์</b> รายได้ประมาณ <b>${money(r.bad.rev)}–${money(r.good.rev)}</b></p>
    <div class="adf-cols">${col('bad','แบบแย่')}${col('mid','แบบกลาง (น่าจะเป็น)')}${col('good','แบบดี (เท่าตอนนี้)')}</div>
    ${scale>=1.5?`<p class="adf-warn">⚠️ งบวันละ ${money(B/Dd)} มากกว่าที่แอดเคยใช้จริง (วันละ ${money(m.daily)}) ประมาณ ${scale.toFixed(1)} เท่า ยิ่งเพิ่มงบเร็ว ต้นทุนต่อออเดอร์มักแพงขึ้น แนะนำเพิ่มทีละ 20-30% ทุก 3-4 วัน</p>`:''}
    <p class="fine" style="margin:8px 0 0">จุดคุ้มทุน: ต้นทุนต่อออเดอร์ต้องไม่เกิน <b>${money(m.aov)}</b> (ยอดเฉลี่ยต่อออเดอร์ ${m.aovSrc}) ถ้าเกินนี้แอดเริ่มขาดทุน</p>`;
}

/* แถบขั้นตอนแอด: อยู่ขั้นไหน และตอนนี้คุณแดนต้องทำอะไร (ร่าง → ตกลง → รีวิว → ทดสอบ 5 วัน → ดูผล → ทำรูปใหม่) */
const AD_STEPS=['ตรวจร่าง & กดตกลง','Facebook รีวิว','ทดสอบ 5 วัน','ดูผล & หยุดรูปที่แพ้','ทำรูปใหม่จากผู้ชนะ'];
function adFlow(x){const ads=(ADST.d&&ADST.d.ads)||[],mine=ads.filter(a=>(x.fb&&(x.fb.ads||[x.fb.ad]).includes(a.id))||(x.campaign&&a.campaign===x.campaign));
  const multi=(x.fb&&(x.fb.ads||[]).length>1)||((x.multi||[]).length>1),age=x.launched_at?(Date.now()-Date.parse(x.launched_at))/864e5:0;
  const T=adTests().find(t=>t.x.id===x.id),ended=mine.length&&mine.every(a=>['ended','paused'].includes(a.group));
  let i,now;
  if(['pending','failed'].includes(x.status)){i=0;now=x.status==='failed'?'ยิงไม่สำเร็จ ดูเหตุผลด้านล่าง แก้แล้วกด "ลองยิงใหม่"':`ตรวจรูป${multi?' ('+(x.multi||[]).length+' รูป)':''} ข้อความ งบ แล้วกด ✅ ตกลง ยิงแอด`;}
  else if(x.status==='launching'||mine.some(a=>a.group==='review')||(!mine.length&&age<1.5)){i=1;now='ไม่ต้องทำอะไร รอ Facebook รีวิว ปกติไม่เกิน 1 วัน';}
  else if(mine.some(a=>a.group==='fix')){i=Math.min(age>=5?3:2,3);now='มีแอดต้องแก้ ดูกลุ่ม 🔴 ต้องแก้ไข ด้านล่าง';}
  else if(!ended&&age<5){i=2;now=`ไม่ต้องทำอะไร ปล่อยให้ Facebook ${multi?'ทดสอบรูป':'เรียนรู้'} · ผลชัดวันที่ 5 (${new Date(Date.parse(x.launched_at)+5*864e5).toLocaleDateString('th-TH',{day:'numeric',month:'short'})})`;}
  else if(T&&T.lose.length){i=3;now=`กด ⏸ หยุดรูปที่แพ้ (${T.lose.length}) ในการ์ด 🏆 แล้วงบจะไปที่ ${T.win.label}`;}
  else{i=4;now=multi?'กด ✨ ทำรูปใหม่ 2 แบบแนวเดียวกับผู้ชนะ เพื่อทดสอบรอบต่อไป (หรือปล่อยวิ่งจนครบวัน)':'ดูผลในกล่องประเมินรายได้ ถ้าคุ้มทำแอดรอบใหม่ หรือลองหลายรูปรอบหน้า';}

function adTests(){const ads=(ADST.d&&ADST.d.ads)||[];

    const rows=x.fb.ads.map((id,k)=>{const a=ads.find(z=>z.id===id);const w=(a&&a.week)||{};const img=(x.launchImages||[])[k]||(a&&a.image)||'';
      return {id,k,a,img,label:(x.labels||{})[img]||'รูป '+(k+1),spend:w.spendTHB||0,buy:w.purchases||0,clicks:w.clicks||0,imp:w.impressions||0,cpa:w.purchases?(w.spendTHB||0)/w.purchases:Infinity,ctr:w.impressions?w.clicks/w.impressions:0,live:a&&a.status==='ACTIVE'};});
    const rank=rows.slice().sort((p,q)=>q.buy-p.buy||p.cpa-q.cpa||q.ctr-p.ctr),win=rank[0];
    const age=(Date.now()-Date.parse(x.launched_at))/864e5,done=age>=5||!rows.some(r=>r.live);
    const lose=done?rows.filter(r=>r!==win&&r.live&&(win.buy?(r.buy===0||r.cpa>win.cpa*1.5):r.ctr<win.ctr*0.6)):[];
    return {x,rows,win,age,done,lose};});}

  market:{title:'Market Research · ฝ่ายการตลาด',do:['ทุกเช้า 07:00 ดึงคำที่คนไทยค้นจริง (Google Suggest) และกระแสไทยวันนี้ (Google Trends) ก่อนทีมเริ่มงาน','อ่านตัวเลขเพจ 7 วัน โพสต์ที่ดีสุด/แย่สุด ผู้ติดตาม คำถามที่ลูกค้าถามซ้ำ','ส่งต่อให้ทุกฝ่าย: หัวข้อที่มีคนค้นอยู่แล้วและประโยคที่คนพูดจริงให้น้องเทรนด์/น้องปากกา ความต้องการสินค้าให้พี่โปร คีย์เวิร์ดแอดให้น้องบูสต์ ข้อเสนอเชิงกลยุทธ์ให้พี่ต้น','วันจันทร์สรุปสัปดาห์: คำค้นที่โต แนวที่ได้ผล สิ่งที่ควรเลิก เป้าที่แนะนำ'],when:'ทุกวัน 07:00 · จันทร์มีสรุปสัปดาห์'},

/* อารมณ์ของสมาชิก: คำนวณจากผลงานจริง 7 วันล่าสุด (ไม่ใช้ AI เพิ่ม) */
function mood(k){
  const now=Date.now(),D=864e5;
  const notes=POSTS.filter(p=>p.source===k&&(p.status==='note'||p.status==='log')&&p.kind!=='reply'&&p.kind!=='chat').sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at));
  const last=notes[0],lastT=last?String(last.text||''):'',age=last?(now-Date.parse(last.created_at))/D:99;
  const wk=POSTS.filter(p=>p.status!=='note'&&p.status!=='log'&&now-Date.parse(p.created_at)<7*D);
  const M=(e,t,why)=>({e,t,why});
  switch(k){
    case 'writer':{const mine=wk.filter(p=>p.source==='writer');const R=mine.filter(p=>p.status==='rejected').length,A=mine.filter(p=>['approved','published'].includes(p.status)).length,W=mine.filter(p=>p.status==='draft').length;
      if(R>=2)return M('😣','เซ็งนิดๆ โดนปัดตก '+R+' ชิ้น','สัปดาห์นี้มีโพสต์ถูกพี่ต้นปัดตก '+R+' ชิ้น');
      if(R===1)return M('😅','โดนแก้ 1 ชิ้น ตั้งใจใหม่','มีโพสต์ถูกปัดตก 1 ชิ้นสัปดาห์นี้');
      if(W>0)return M('🤞','ลุ้นผลตรวจ '+W+' ชิ้น','ส่งร่างแล้ว '+W+' ชิ้น รอพี่ต้นตรวจ');
      if(A>=5)return M('😄','ฟิน งานผ่านรัวๆ','ผ่านการอนุมัติ '+A+' ชิ้นในสัปดาห์นี้');
      if(A>0)return M('🙂','พอใจ งานผ่าน '+A+' ชิ้น','ผ่านการอนุมัติ '+A+' ชิ้น');
      return M('✍️','กำลังคิดหัวข้อใหม่','ยังไม่มีงานเข้าระบบสัปดาห์นี้');}
    case 'designer':{if(/ไม่ผ่าน|ต้องแก้|แก้ใหม่/.test(lastT)&&age<8)return M('😤','งานเข้า รูปต้องแก้','รายงานล่าสุดมีรูปไม่ผ่านเกณฑ์');
      if(/ผ่าน/.test(lastT)&&age<8)return M('😌','สบายใจ รูปผ่านหมด','รูปล่าสุดผ่านเกณฑ์');
      return M('🎨','รอตรวจรูปชุดใหม่','ยังไม่มีรูปให้ตรวจรอบนี้');}
    case 'trend':{if(age<3)return M('🤩','เจอของใหม่มาเล่า','เพิ่งส่งลิสต์หัวข้อเมื่อไม่นาน');
      if(age<8)return M('🧐','กำลังส่องเทรนด์','ส่งงานล่าสุด '+Math.round(age)+' วันก่อน');
      return M('😶','เงียบมานาน','ไม่ได้ส่งงานเกิน 1 สัปดาห์');}
    case 'community':{const m=lastT.match(/รอตอบ\s*(\d+)/);const n=m?Number(m[1]):0;
      if(n>=6&&age<2)return M('😵','มือเป็นระวิง คอมเมนต์ '+n,'คอมเมนต์รอตอบ '+n+' รายการ');
      if(n>=1&&age<2)return M('😊','มีคนมาคุยด้วย','มีคอมเมนต์รอตอบ '+n+' รายการ');
      return M('😴','เงียบ รอคอมเมนต์','ไม่มีคอมเมนต์ใหม่รอบล่าสุด');}
    case 'analyst':{if(/ซื้อ\s*0\b|ยังไม่มีคนซื้อ|ไม่มีการซื้อ|ซื้อ 0 /.test(lastT)&&age<3)return M('😟','กังวล แอดยังไม่คุ้ม','รายงานล่าสุด: ใช้งบแล้วยังไม่มียอดซื้อ');
      if(/ซื้อ\s*[1-9]/.test(lastT)&&age<3)return M('🤓','ตัวเลขดูดี','รายงานล่าสุดมียอดซื้อจากแอด');
      return M('📊','กำลังดูตัวเลข','รอรอบรายงานถัดไป');}
    case 'manager':{const failed=POSTS.filter(p=>p.status==='failed').length,own=POSTS.filter(p=>p.status==='needs_owner').length;const plan=POSTS.find(p=>p.status==='note'&&p.kind==='plan'&&now-Date.parse(p.created_at)<7*D);
      if(failed)return M('😠','หงุดหงิด มีโพสต์ล้ม '+failed,'มีโพสต์ขึ้นไม่สำเร็จ '+failed+' ชิ้น');
      if(own)return M('🤔','รอคุณแดนตัดสิน '+own+' เรื่อง','ส่งเรื่องให้เจ้าของแล้ว '+own+' รายการ');
      if(plan)return M('😎','คุมเกมอยู่ แผนพร้อม','มีแผนสัปดาห์นี้แล้ว');
      return M('📋','เตรียมประชุมทีม','ยังไม่มีแผนสัปดาห์นี้');}
    case 'factory':{const j=FJOBS||[];if(j.some(x=>x.status==='producing'))return M('🔥','กำลังผลิตเต็มกำลัง','มีงานอยู่ในสายพาน');
      if(j.some(x=>x.status==='queued'))return M('🧰','มีใบสั่งรอ พร้อมลุย','มีใบสั่งรอผลิต');
      if(j.some(x=>x.status==='done'&&now-Date.parse(x.done_at||0)<3*D))return M('😮‍💨','เพิ่งส่งงานเสร็จ','ผลิตเสร็จภายใน 3 วันนี้');
      return M('😴','ว่าง รอใบสั่ง','ไม่มีงานในคิว');}
    case 'product':return age<35?M('💡','มีไอเดียสินค้าใหม่','ส่งข้อเสนอเดือนนี้แล้ว'):M('🗓️','รอรอบสิ้นเดือน','ยังไม่ถึงรอบรายงาน');
    case 'finance':return /ยอดขาย\s*0|0 ออเดอร์|ไม่มียอดขาย/.test(lastT)&&age<8?M('😐','เดือนนี้ยังเงียบ','ยอดขายสัปดาห์นี้ยังไม่มี'):M('🧮','ตัวเลขเรียบร้อย','บัญชีเป็นปัจจุบัน');
    case 'care':return M('☕','สแตนด์บาย','ยังไม่เปิดใช้งาน');
    case 'ceo_sale':case 'ceo_store':{const pend=(PROP.list||[]).filter(x=>x.source===k).length;if(!last)return M(k==='ceo_sale'?'💼':'🏪','เพิ่งรับตำแหน่ง รอรอบแรก','ยังไม่มีรายงานฉบับแรก');if(pend)return M('🤞','รอคุณแดนดูข้อเสนอ '+pend+' เรื่อง','มีข้อเสนอค้างในแท็บสินค้า');return age<8?M('😎','ส่งรายงานแล้ว','รายงานล่าสุด '+Math.round(age)+' วันก่อน'):M('📋','เตรียมรายงานรอบใหม่','ยังไม่ถึงรอบ');}
    case 'hr':{const last=notes[0];if(!last)return M('📋','เตรียมทำความรู้จักทุกคน','ยังไม่มีรายงานทีมฉบับแรก');if(age<2)return M('🙂','ส่งรายงานทีมแล้ว','รายงานล่าสุดเมื่อ '+Math.round(age*24)+' ชม.ก่อน');return M('☕','สังเกตทีมอยู่','รอรอบวันจันทร์');}

function chatTab(){

  const byId={};msgs.forEach(m=>byId[m.id]=m);

  const seenN=m=>{const age=(Date.now()-Date.parse(m.at||m.created_at))/6e4;const base=age<10?1:age<120?4:8;return Math.min(12,base+hash(m.id)%4);};

    return sep+`<div class="msg ${me?'me':''}${meta.evt?' evt':''}">${ava(me?'manual':(TEAM[m.source]?m.source:'manager'),1)}<div><div class="who">${esc(who)}${meta.evt?' <span class="evtag">จากงานจริง</span>':''}</div><div class="bub">${q}${m.photo?`<img class="cph" src="${esc(m.photo)}" alt="รูปที่${esc(who)}ส่งมา" loading="lazy" data-a="chatPhoto" data-u="${esc(m.photo)}">`:''}${esc(m.text)}${poll}</div>${rx}</div><span class="t">${tm} <button class="tx" data-a="chatRemove" data-id="${m.id}" title="ลบข้อความนี้" style="font-size:14px">×</button></span></div>`;}).join('');
  return `<div class="chat"><p class="fine" style="margin:12px 0 4px">ห้องพักทีม (One Bangkok ชั้น 27 วิวสวนลุม): มุมคุยเล่นนอกเรื่องงานของทุกคน ข้อความทยอยเข้ามาทั้งวันตามจังหวะชีวิตแต่ละคน${CHAT.engine&&CHAT.engine!=='Claude'?' · ขับด้วย '+esc(CHAT.engine)+' ทักแล้วทีมตอบในไม่กี่นาที':''} คุณแดนแวะมาทักได้ ทีมจะตอบในรอบเช้าถัดไป <button class="chip" data-a="chatRefresh">รีเฟรช</button></p>
  ${onlineStrip()}

  ${CHAT.msgs===null?(CHAT.err?'':'<p class="fine">กำลังโหลด...</p>'):msgs.length?rows:'<p class="fine">ยังเงียบอยู่ ทุกคนจะเริ่มคุยกันรอบเที่ยงนี้</p>'}
  ${CHAT.fastUntil>Date.now()&&!(CHAT.next_at&&Date.parse(CHAT.next_at)-Date.now()<15*60e3)?`<div class="msg typing">${ava('writer',1)}<div><div class="who">ทีม</div><div class="bub">กำลังพิมพ์…</div></div></div>`:''}

const LEADS={tests:null,list:null,loading:false,err:'',sel:{},tpl:null,subj:null,body:null,sending:false,msg:'',auto:true,log:[]};

  authFetch('/api/content?action=test_emails').then(j=>{if(j&&j.ok){LEADS.tests=j.testEmails.join('\n');render(true);}}).catch(()=>{});
  try{const r=await authFetch('/api/content?action=leads');const j=r.json?await r.json():r;
    if(!j.ok)throw new Error(j.error||'โหลดไม่สำเร็จ');
    LEADS.list=j.leads;LEADS.tpl=j.template;LEADS.auto=j.auto!==false;LEADS.log=j.log||[];if(LEADS.subj===null){LEADS.subj=j.template.subject;LEADS.body=j.template.body;}

}

function healthCard(){if(HEALTH.d===null&&!HEALTH.loading)loadHealth();const h=HEALTH.d||{},C=h.checks||[];

  try{const d=new Date(Date.now()+7*3600e3).toISOString().slice(0,10),key='hit:'+d+':'+k;if(localStorage.getItem(key))return;localStorage.setItem(key,'1');
    if(!hit.pruned){hit.pruned=1;Object.keys(localStorage).forEach(x=>{if(x.startsWith('hit:')&&!x.startsWith('hit:'+d))localStorage.removeItem(x);});}}catch(e){return;}

      const pct=n>=9?0.5:n>=7?0.55:0.6,basic=end90(sum*pct),plus=end90(basic*1.65),pro=end90(plus*1.5),full={basic,plus,pro};

    case 'editProduct':S.draft=isBundle(getProduct(id))?bundleDraft(getProduct(id)):initDraft(getProduct(id));S.edit=id;S.err='';render(false);break;
    case 'cancelEdit':S.edit=null;S.draft=null;S.err='';S.coverOpen=false;S.coverImg=null;S.coverPrompt=null;S.imgSet=null;render(false);break;
    case 'rmImg':S.draft.images.splice(Number(el.dataset.i),1);render(true);break;
    case 'mvImg':{const L=S.draft[el.dataset.k]||[],i=Number(el.dataset.i),j=i+Number(el.dataset.d);if(j<0||j>=L.length)break;[L[i],L[j]]=[L[j],L[i]];render(true);pvPost(0);break;}
    case 'togglePub':{const p=getProduct(id);p.status=p.status==='published'?'draft':'published';if(p.status==='published')delete p.fresh;if(p.status==='published'&&!p.publishedAt){p.publishedAt=Date.now();adDraftSoon(p.id);}save();render(true);toast(p.status==='published'?'เผยแพร่เซลเพจแล้ว':'เปลี่ยนเป็นฉบับร่างแล้ว');break;}
    case 'dupProduct':{
      const p=getProduct(id);let slug=p.slug+'-copy',n=2;while(slugTaken(slug))slug=p.slug+'-copy'+n++;
      const nid='p'+Date.now().toString(36);
      D.products.push(Object.assign({},p,{id:nid,slug,name:p.name+' (สำเนา)',status:'draft',publishedAt:0,images:(p.images||[]).slice()}));
      save();render(true);toast('ทำสำเนาแล้ว เป็นฉบับร่าง');break;}
    case 'delProduct':{
      if(D.orders.some(o=>o.productId===id)){S.confirm='';render(true);toast('สินค้านี้มีออเดอร์แล้ว ลบไม่ได้ ให้เปลี่ยนเป็นฉบับร่างแทน');break;}
      if(S.confirm==='del:'+id){D.products=D.products.filter(p=>p.id!==id);D.coupons=D.coupons.filter(c=>c.scope!==id);if(S.productId===id)S.productId=null;S.confirm='';save();render(true);toast('ลบสินค้าแล้ว');}
      else{S.confirm='del:'+id;render(true);}break;}
    case 'saveProduct':{
      // รูปที่ AI สร้างไว้แต่ยังไม่ได้กด "ใช้เป็นปก"/"ใช้รูปที่เลือก": ใส่ให้ก่อนแล้วค่อยบันทึก (เดิมรูปหายถ้ากดบันทึกเลย)
      const pendSet=!!(S.imgSet&&S.imgSet.some(x=>x.pick&&x.url));
      if((S.coverImg||pendSet)&&!S.autoUsing){S.autoUsing=true;toast('กำลังใส่รูปที่สร้างไว้ก่อนบันทึก...');
        (async()=>{try{if(S.coverImg)await coverUse();else await imgSetUse();}finally{S.autoUsing=false;}
          if(!S.coverImg&&!(S.imgSet&&S.imgSet.some(x=>x.pick&&x.url)))act('saveProduct',el);else toast('ใส่รูปที่สร้างไม่สำเร็จ ลองกด "ใช้เป็นปก" อีกครั้ง');})();break;}
      const d=S.draft,isNew=S.edit==='new',selfId=isNew?null:S.edit;
      const name=String(d.name).trim(),slug=String(d.slug).trim().toLowerCase(),price=Number(d.price),full=Number(d.fullPrice)||0,link=String(d.link).trim(),sample=String(d.sampleLink).trim();
      if(!name){S.err='กรอกชื่อสินค้า';render(true);break;}
      if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)){S.err='ชื่อในลิงก์ใช้ได้เฉพาะ a-z ตัวเลข และ - เช่น calculus-1-summary';render(true);break;}
      if(slugTaken(slug,selfId)){S.err='ชื่อในลิงก์นี้ถูกใช้แล้ว เลือกชื่ออื่น';render(true);break;}
      if(!(price>=1)){S.err='ราคาขายต้องเป็นตัวเลขตั้งแต่ 1 บาทขึ้นไป';render(true);break;}
      if(link&&link!=='https://'&&!/^https?:\/\//.test(link)){S.err='ลิงก์ไฟล์ต้องขึ้นต้นด้วย https://';render(true);break;}
      if(sample&&sample!=='https://'&&!/^https?:\/\//.test(sample)){S.err='ลิงก์ไฟล์ตัวอย่างต้องขึ้นต้นด้วย https://';render(true);break;}
      const promoEnd=d.promoEndStr?new Date(d.promoEndStr).getTime():0;
      if(d.promoEndStr&&!(promoEnd>0)){S.err='วันเวลาโปรโมชันไม่ถูกต้อง';render(true);break;}
      const bumpPrice=Number(d.bumpPrice)||0;
      if(d.bumpProductId&&!(bumpPrice>=0)){S.err='ราคาพิเศษของ order bump ต้องเป็นตัวเลขตั้งแต่ 0 ขึ้นไป';render(true);break;}
      if(d.bumpProductId&&d.bumpProductId===selfId){S.err='เลือกสินค้าอื่นสำหรับ order bump ไม่ใช่สินค้านี้เอง';render(true);break;}
      const data=draftToProduct(d);
      if(data.stripeLink&&!/^https:\/\/buy\.stripe\.com\//.test(data.stripeLink)){S.err='ลิงก์ Stripe ต้องขึ้นต้นด้วย https://buy.stripe.com/';render(true);break;}
      let saved;
      if(isNew){saved=Object.assign({id:'p'+Date.now().toString(36)},data);D.products.push(saved);}
      else{saved=getProduct(selfId);Object.assign(saved,data);}
      if(saved.status==='published'&&!saved.publishedAt){saved.publishedAt=Date.now();adDraftSoon(saved.id);}
      if(d.fromProp)propDone(d.fromProp,true);
      S.edit=null;S.draft=null;S.err='';save();
      if(d.fromJob){const jid=d.fromJob,pid=saved.id;clearTimeout(saveTimer);
        flushRemote().then(ok=>{if(!ok||!getProduct(pid)){toast('ลงขายไม่สำเร็จ การ์ดโรงงานยังอยู่ กดอนุมัติใหม่อีกครั้ง');FAC.jobs=null;render(true);return;}
          authFetch('/api/content?action=factory_list',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:jid,product_id:pid})}).then(j=>{if(j&&j.ok)FAC.jobs=(FAC.jobs||[]).filter(x=>x.id!==jid);render(true);}).catch(()=>{});});}
      if(el.dataset.then==='view'){selectProduct(saved.id);go('shop');}
      else{render(false);toast('บันทึกสินค้าแล้ว');checkAllLinks();}
      break;}

    /* coupons */
    case 'addCoupon':{
      const code=$('#c-code').value.trim().toUpperCase().replace(/\s+/g,''),type=$('#c-type').value,scope=$('#c-scope').value,val=Number($('#c-value').value);
      if(!/^[A-Z0-9_-]{3,20}$/.test(code)){S.err='โค้ดใช้ได้เฉพาะ A-Z ตัวเลข และ - ยาว 3 ถึง 20 ตัว';render(true);break;}
      if(D.coupons.some(c=>c.code===code)){S.err='มีโค้ดนี้อยู่แล้ว';render(true);break;}
      if(!(val>0)||(type==='percent'&&val>90)){S.err='มูลค่าต้องมากกว่า 0 และเปอร์เซ็นต์ไม่เกิน 90';render(true);break;}
      D.coupons.unshift({code,type,value:val,scope,active:true,uses:0});S.err='';save();render(true);toast('เพิ่มโค้ด '+code+' แล้ว');break;}
    case 'toggleCoupon':{const c=D.coupons.find(x=>x.code===el.dataset.code);c.active=!c.active;if(!c.active&&S.coupon===c.code)S.coupon='';save();render(true);break;}
    case 'delCoupon':{D.coupons=D.coupons.filter(x=>x.code!==el.dataset.code);if(S.coupon===el.dataset.code)S.coupon='';save();render(true);break;}

    /* pixel + reset */
    case 'savePixel':{const id=$('#s-pixel').value.trim();if(id&&!/^\d{6,20}$/.test(id)){toast('Pixel ID ต้องเป็นตัวเลขล้วน');break;}D.settings.pixelId=id;save();render(true);toast('บันทึก Pixel ID แล้ว');break;}
    case 'saveFbVerify':{let v=$('#s-fbverify').value.trim();const m=v.match(/content=["']([^"']+)/);if(m)v=m[1];D.settings.fbDomainVerify=v;save();render(true);toast('บันทึกรหัสยืนยันโดเมนแล้ว');break;}
    case 'savePay':{D.settings.shopName=$('#s-shop').value.trim();D.settings.refundPolicy=$('#s-refund').value.trim();D.settings.customKinds=$('#s-kinds').value.trim();let chat=$('#s-chat').value.trim();if(chat&&!/^https?:\/\//.test(chat))chat='https://'+chat;D.settings.chatLink=chat;D.settings.promptpayId=$('#s-pp').value.trim();D.settings.bankInfo=$('#s-bank').value.trim();D.settings.contactInfo=$('#s-contact').value.trim();save();toast('บันทึกข้อมูลรับเงินแล้ว');break;}
    case 'clearEvents':D.events=[];save();render(true);break;
    case 'clearDemo':
      if(S.confirm==='clearDemo'){D.orders=[];D.campaigns=[];D.events=[];S.confirm='';S.currentId=null;save();render(true);toast('ล้างออเดอร์และแคมเปญตัวอย่างแล้ว');}
      else{S.confirm='clearDemo';render(true);}break;
    case 'reset':
      if(S.confirm==='reset'){D=normalize(seed());save();S.confirm='';S.coupon='';S.productId=null;S.open={};S.edit=null;render(true);toast('รีเซ็ตแล้ว');}
      else{S.confirm='reset';render(true);}break;
  }
}

/* เลื่อนหน้าลงไปหาช่องชำระเงินแบบนุ่มๆ: คำนวณปลายทางใหม่ทุกเฟรม รูปที่โหลดทีหลังดันตำแหน่งก็ยังไปหยุดถูกที่ */
function glideTo(id){
  const el=document.getElementById(id);if(!el)return;
  const target=()=>Math.max(0,Math.min(el.getBoundingClientRect().top+scrollY-8,document.documentElement.scrollHeight-innerHeight));
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){scrollTo(0,target());return;}
  const y0=scrollY,dist=Math.abs(target()-y0),dur=Math.min(1100,Math.max(500,dist*0.35)),t0=performance.now();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  let stop=false;const cancel=()=>{stop=true;};
  addEventListener('wheel',cancel,{once:true,passive:true});addEventListener('touchstart',cancel,{once:true,passive:true});
  (function step(now){
    if(stop)return;
    const k=Math.min(1,(now-t0)/dur);
    scrollTo(0,y0+(target()-y0)*ease(k));
    if(k<1)requestAnimationFrame(step);
    else setTimeout(()=>{if(!stop&&Math.abs(target()-scrollY)>4)scrollTo({top:target(),behavior:'smooth'});},250); // รูปเพิ่งโหลดเสร็จ จัดให้ตรงอีกนิด
  })(t0);
}

setInterval(()=>{if(S.view==='admin'&&S.tab==='chat'&&sbSession&&document.visibilityState==='visible'&&!CHAT.loading){loadChat().then(()=>render(true));}},60e3);
setInterval(()=>{if(CHAT.fastUntil>Date.now()&&S.view==='admin'&&S.tab==='chat'&&sbSession&&!CHAT.loading){const n=(CHAT.msgs||[]).length;loadChat().then(()=>{render(true);if((CHAT.msgs||[]).length>n){const b=document.getElementById('chat-end');if(b)b.scrollIntoView({block:'end',behavior:'smooth'});}});}},8e3);
document.addEventListener('visibilitychange',async()=>{
  if(document.visibilityState!=='visible'||!sb||!sbSession)return;
  try{const {data}=await sb.auth.getSession();if(!data||!data.session)sessionLost();else sbSession=data.session;}catch(e){}
});
(async function boot(){
  const inline=window.__SHOP__;
  if(inline&&Array.isArray(inline.products)){ // ข้อมูลฝังมากับหน้า: แสดงได้ทันที
    const cached=load()||{};
    D=normalize(Object.assign({},cached,inline));remoteReady=true;saveCache();
  }
  const q=new URLSearchParams(location.search);
  const wantAdmin=q.has('admin')||location.hash==='#admin'||hasAdminToken();
  S.loading=!inline&&!load(); // ไม่มีข้อมูลฝังและไม่มีแคช: รอโหลดจากระบบก่อน
  applyUrl();
  render(false);
  if(PV){S.loading=!S.pvGot;render(false);try{window.parent.postMessage({type:'pvReady'},location.origin);}catch(e){}return;}
  if(wantAdmin||!inline){ // แอดมิน (หรือหน้าที่ไม่มีข้อมูลฝัง เช่นเปิดไฟล์ตรงๆ) ค่อยโหลดไลบรารีและดึงจากระบบ
    try{
      await loadSb();
      const {data}=await sb.auth.getSession();
      sbSession=data&&data.session||null;
      await loadRemote();
      if(needsMigrate&&sbSession){needsMigrate=false;await pushAll();}
      wireAuth();
    }catch(e){console.error(e);}
  }
  S.loading=false;
  applyUrl();
  initPixel(D.settings.pixelId);
  if(S.sessionId)verifyOrder();
  track('PageView');
  {const p=curProduct();if(p&&S.view==='shop')track('ViewContent',{content_name:p.name,value:p.price,currency:'THB'});}
  render(false);
})();
</script>
</body>
</html>
