<script>
$('clouds').innerHTML = [[150, 420, 1], [700, 380, 1.3], [420, 1150, .8], [880, 1050, 1]].map(([x, y, s]) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse rx="110" ry="46" fill="#fff"/><ellipse cx="-60" cy="10" rx="70" ry="36" fill="#fff"/><ellipse cx="70" cy="12" rx="80" ry="38" fill="#fff"/></g>`).join('');
$('cwin').innerHTML = Array.from({ length: 8 }, (_, i) => `<rect x="${-150 + i * 46}" y="-40" width="26" height="26"/>`).join('');
$('hw').innerHTML = [140, 940].map((x) => `<g transform="translate(${x} 900) scale(.45)"><use href="#WR"/></g>`).join('');
$('corners').innerHTML = [[-200, -200], [200, -200], [200, 200], [-200, 200]].map(([x, y]) => `<circle class="cn" cx="${x}" cy="${y}" r="34" fill="#FF4B4B"/>`).join('');
// รอยร้าว: เส้นหยักออกจากมุม
const crackD = [[-190, -190, -1, -1], [190, -190, 1, -1], [190, 190, 1, 1], [-190, 190, -1, 1]].map(([x, y, sx, sy], k) => { let d = `M${x} ${y}`, cx = x, cy = y; for (let i = 0; i < 6; i++) { cx += sx * (22 + (i * 13 + k * 7) % 16); cy += sy * (20 + (i * 17 + k * 5) % 18) * (i % 2 ? 0.4 : 1.1); d += ` L${cx.toFixed(0)} ${cy.toFixed(0)}`; } return d; });
$('cracks').innerHTML = crackD.map((d) => `<path class="ck" d="${d}" stroke-dasharray="400" stroke-dashoffset="400"/>`).join('');
// ลูกศรแรงพุ่งเข้ามุม (เหลี่ยม)
$('sarr').innerHTML = [[-1, -1], [1, -1], [1, 1], [-1, 1]].flatMap(([sx, sy]) => [`<line class="sa" data-sx="${sx}" data-sy="${sy}" data-h="1" stroke="#FF4B4B" marker-end="url(#ah)"/>`, `<line class="sa" data-sx="${sx}" data-sy="${sy}" data-h="0" stroke="#FF4B4B" marker-end="url(#ah)"/>`]).join('');
// จุดแรงไหลรอบหน้าต่างกลม
$('flow').innerHTML = Array.from({ length: 14 }, (_, i) => `<circle class="fd" data-i="${i}" r="16" fill="#2F9E44"/>`).join('');
$('fog').innerHTML = [[-60, -60, 90], [50, 20, 110], [-30, 110, 80], [60, -120, 70]].map(([x, y, r]) => `<ellipse class="fg" cx="${x}" cy="${y}" rx="${r}" ry="${r * .7}" fill="#fff"/>`).join('');
// ลูกศรอัดอากาศ
$('parr').innerHTML = Array.from({ length: 8 }, (_, i) => `<line class="pa" data-i="${i}" stroke="#E8590C" stroke-width="16" stroke-linecap="round" marker-end="url(#ah)"/>`).join('');
$('fseats').innerHTML = [-150, -50, 50, 150].map((x) => `<g transform="translate(${x} -20) scale(.45)" style="color:#4C6EF5"><use href="#SEAT"/></g>`).join('');
// แถวที่นั่ง: หน้าต่าง | A B C | ทางเดิน
$('row').innerHTML = `<rect x="40" y="1080" width="60" height="220" rx="12" fill="#D3DCE8" stroke="#0F1B33" stroke-width="7"/><g transform="translate(70 1190) scale(.22)"><use href="#WR"/></g>
  <g id="seatA" transform="translate(220 1190)" style="color:#4C6EF5"><use href="#SEAT"/></g><g transform="translate(390 1190)" style="color:#4C6EF5"><use href="#SEAT"/></g><g id="seatC" transform="translate(560 1190)" style="color:#4C6EF5"><use href="#SEAT"/></g>
  <rect x="650" y="1080" width="190" height="220" fill="#C9D3E3"/><path d="M745 1100 v180" stroke="#fff" stroke-width="10" stroke-dasharray="24 18"/>
  <g transform="translate(930 1190)" style="color:#4C6EF5"><use href="#SEAT"/></g>`;
$('endseats').innerHTML = [[290, '#4C6EF5', '🪟'], [790, '#E8590C', '🚶']].map(([x, c]) => `<g class="es" transform="translate(${x} 900) scale(1.6)" style="color:${c}"><use href="#SEAT"/></g>`).join('') + [[290, 'ริมหน้าต่าง'], [790, 'ริมทางเดิน']].map(([x, l]) => `<text x="${x}" y="1100" text-anchor="middle" font-family="K" font-weight="800" font-size="72" fill="#0F1B33">${l}</text>`).join('') + `<text x="540" y="870" text-anchor="middle" font-family="K" font-weight="800" font-size="110" fill="#0F1B33">VS</text>`;
$('host').innerHTML = `<g id="hg">${SHEETGUY}</g>`;

// ---------- ไทม์ไลน์ ----------
const L = {}, H = [], SFX = []; let T = 0.4;
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const red = (s) => esc(s).replace(/\*([^*]+)\*/g, '<b>$1</b>');
const EM = ['window seat', 'aisle seat'];
for (const ln of window.EP) {
  const a = T, b = T + ln.dur; L[ln.k] = { a, b, ch: (ln.chunks || []).map((c) => a + c[0]) }; SFX.push([+a.toFixed(2), `why2/${ln.k}.wav`]);
  if (ln.kind === 'narr') ln.chunks.forEach(([s, e, txt]) => H.push(`<div class="sub" data-in="${(a + s).toFixed(2)}" data-out="${(a + e - 0.02).toFixed(2)}" data-anim="pop">${red(txt)}</div>`));
  else { let tx = esc(ln.text); EM.forEach((w) => { tx = tx.replace(w, `<em>${w}</em>`); }); H.push(`<div class="bub" data-in="${a.toFixed(2)}" data-out="${(b + 0.6).toFixed(2)}" data-anim="pop">🔊 ${tx}</div>`); H.push(`<div class="sub en" data-in="${a.toFixed(2)}" data-out="${(b + 0.6).toFixed(2)}" data-anim="none">${esc(ln.th)}</div>`); }
  T = b + (ln.kind === 'narr' ? 0.4 : 0.7);
}
const at = (k, i) => L[k].ch[i];
const chip = (a, b, style, html) => H.push(`<div class="chip" data-in="${a.toFixed(2)}" data-out="${b.toFixed(2)}" data-anim="pop" style="${style}">${html}</div>`);
H.push(`<div class="title" data-in="${at('n1', 2).toFixed(2)}" data-out="${(L.n1.b + 0.3).toFixed(2)}" data-anim="pop">ไม่มีมุมแหลม?</div>`);
chip(at('n2', 2), L.n2.b + 0.3, 'left:80px;top:420px;background:#FF6B6B', '💥 แตกกลางอากาศ!');
chip(at('n3', 0), L.n3.b + 0.3, 'left:80px;top:420px', '📅 ปี 1954');
chip(at('n3', 2), L.n3.b + 0.3, 'left:80px;top:560px;font-size:52px;background:#fff', '✈️ เจ็ตโดยสารลำแรกของโลก');
chip(at('n3', 3), L.n3.b + 0.3, 'right:80px;top:1130px;background:#FF6B6B', '✖ ✖ ตก 2 ลำ');
chip(at('n4', 3), L.n4.b + 0.3, 'left:80px;top:420px', '🔁 ทุกเที่ยวบิน');
chip(at('n5', 0), L.n5.b + 0.3, 'left:80px;top:420px;background:#FF6B6B', '⚠️ แรงกองที่มุม');
chip(at('n6', 1), L.n6.b + 0.3, 'left:80px;top:420px;background:#8CE99A', '✅ แรงกระจายรอบๆ');
chip(at('n7', 1), L.n7.b + 0.3, 'left:80px;top:420px;font-size:52px;background:#fff', '🔍 รูเล็กๆ บนกระจกบานกลาง');
chip(at('n7', 2), L.n7.b + 0.3, 'left:80px;top:1130px;font-size:54px', '⚖️ ปรับแรงดัน');
chip(at('n7', 3), L.n7.b + 0.3, 'right:80px;top:1130px;font-size:54px;background:#A5D8FF', '💨 กันฝ้า');
// การ์ดคำศัพท์
const V0 = at('n8', 2), VE = L.e2.b + 0.6;
H.push(`<div class="word" data-in="${V0.toFixed(2)}" data-out="${VE.toFixed(2)}" data-anim="pop" style="top:400px"><span>cabin window</span><u>หน้าต่างเครื่องบิน</u></div>`);
H.push(`<div class="word" data-in="${(L.e1.a).toFixed(2)}" data-out="${VE.toFixed(2)}" data-anim="pop" style="top:580px"><span>window seat</span><u>ริมหน้าต่าง</u></div>`);
H.push(`<div class="word" data-in="${at('n9', 1).toFixed(2)}" data-out="${VE.toFixed(2)}" data-anim="pop" style="top:740px"><span>aisle seat</span><i>/aɪl/</i><u>ริมทางเดิน</u></div>`);
const E0 = T;
H.push(`<div class="sub" data-in="${E0.toFixed(2)}" data-out="${(E0 + 4).toFixed(2)}" data-anim="pop" style="font-size:66px">เมนต์ว่าคุณสายไหน 👇<br><b>+ ติดตาม</b> รอ "ทำไม" ตอนต่อไป</div>`);
SFX.push([+at('n1', 2).toFixed(2), 'boing'], [+at('n2', 2).toFixed(2), 'whoosh'], [+L.n3.a.toFixed(2), 'whoosh'], [+at('n3', 3).toFixed(2), 'pop'], [+L.n4.a.toFixed(2), 'whoosh'], [+at('n5', 2).toFixed(2), 'boing'], [+L.n6.a.toFixed(2), 'chime'], [+at('n7', 1).toFixed(2), 'pop'], [+V0.toFixed(2), 'ding'], [+at('n9', 1).toFixed(2), 'pop'], [+E0.toFixed(2), 'tada']);
window.DURATION = +(E0 + 4.2).toFixed(2); window.SFX = SFX;
// 🔤 คำอังกฤษเด้งตอนพากย์ถึงคำนั้น (ไม่ซ้ำการ์ดคำศัพท์ cabin window / window seat / aisle seat) · ตอนรอยร้าวย้ายไปขวาบน ไม่บังมุมหน้าต่าง
const POP = [[at('n1', 2) + 0.15, 'corner', 'มุม'], [at('n2', 1) + 0.45, 'square', 'สี่เหลี่ยม'], [at('n4', 1) + 0.6, 'pressure', 'แรงดันอากาศ'], [at('n5', 1) + 0.3, 'fatigue', 'โลหะล้า', { top: 262, right: 40 }], [at('n5', 2) + 0.35, 'crack', 'รอยร้าว', { top: 262, right: 40 }], [at('n6', 0) + 0.5, 'rounded', 'โค้งมน']];
H.push(popWords(POP));
$('dyn').innerHTML = H.join('');
document.querySelectorAll('.sub,.chip').forEach((el) => { let f = parseFloat(getComputedStyle(el).fontSize); const max = el.classList.contains('chip') ? 920 : el.clientWidth; while ((el.classList.contains('chip') ? el.scrollWidth > max : el.scrollWidth > el.clientWidth) && f > 36) { f -= 4; el.style.fontSize = f + 'px'; } });
const els = [...document.querySelectorAll('[data-in]')];
const inR = (a, b, t) => t >= a && t < b;

function seek(t) {
  tick(els, t);
  const S = t < L.n2.a ? 'hook' : t < L.n3.a ? 'crack' : t < L.n4.a ? 'sky' : t < L.n5.a ? 'press' : t < L.n6.a ? 'stress' : t < L.n7.a ? 'round' : t < L.n8.a ? 'hole' : t < L.n10.a ? 'vocab' : 'end';
  const show = (id, on) => $(id).setAttribute('opacity', on ? 1 : 0);
  show('sHook', S === 'hook'); show('sCrack', S === 'crack'); show('sSky', S === 'sky'); show('sPress', S === 'press'); show('sStress', S === 'stress'); show('sRound', S === 'round'); show('sHole', S === 'hole'); show('sVocab', S === 'vocab'); show('sEnd', S === 'end');
  document.querySelectorAll('.vc').forEach((c) => c.setAttribute('transform', `translate(${((t * 60) % 520) - 260} 0)`));
  // หน้าต่างตัวเอก
  const W = $('win'), round = ['hook', 'round', 'hole'].includes(S), square = ['crack', 'stress'].includes(S);
  show('win', round || square); show('winR', round); show('winS', square);
  let wy = 880, ws = 1.25, sh = 0;
  if (S === 'hook') { const p = back(cl((t - L.n1.a) / 0.5)); ws = 1.25 * (0.5 + 0.5 * p); }
  if (S === 'crack' && t > at('n2', 2)) sh = Math.sin(t * 80) * 12 * cl(1 - (t - at('n2', 2)) / 1.2);
  if (S === 'hole') ws = 1.35;
  W.setAttribute('transform', `translate(${540 + sh} ${wy}) scale(${ws})`);
  $('sq').setAttribute('opacity', S === 'hook' && t > at('n1', 2) ? 1 : 0);
  document.querySelectorAll('.cn').forEach((c) => c.setAttribute('r', 26 + Math.abs(Math.sin(t * 6)) * 14));
  // รอยร้าว: ฉาก crack (ตอนแตก) และ stress (ช่วงท้าย)
  const ckP = S === 'crack' ? cl((t - at('n2', 1)) / 1.6) : S === 'stress' ? cl((t - at('n5', 2)) / 1.4) : 0;
  document.querySelectorAll('.ck').forEach((c) => c.setAttribute('stroke-dashoffset', 400 * (1 - ckP)));
  $('flash').setAttribute('opacity', S === 'crack' && inR(at('n2', 2), at('n2', 2) + 0.25, t) ? 0.5 : 0);
  // ลูกศรแรงพุ่งเข้ามุม
