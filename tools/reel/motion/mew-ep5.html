<!doctype html>
<html lang="th"><head><meta charset="utf-8">
<!-- 🎬 มิว EP.4 "สั่งกาแฟร้านฝรั่ง แต่ได้ของผิด" (คุณแดน 24 ต.ค. 69 ทำคลิปแนวนี้เยอะๆ) ฉากร้านกาแฟ
     มิวพูดแค่ "One small ice" ได้น้ำแข็งแก้วเปล่า → กฎสั่งกาแฟ ขนาด + ร้อน/เย็น + เมนู · เสียง/เวลาใน ep5/data.js (ep5/gen.py)
     ขอบปลอดภัย IG/FB: ไม่มีตัวหนังสือบนสุด 250 px และล่างสุด 380 px · คำอังกฤษเด้ง popWords(POP) จาก cast.js -->
<style>
@font-face{font-family:K;src:url(../fonts/Kanit-ExtraBold.ttf);font-weight:800}
@font-face{font-family:K;src:url(../fonts/Kanit-SemiBold.ttf);font-weight:600}
*{box-sizing:border-box;margin:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#F3E3CF;font-family:K,sans-serif}
svg{position:absolute;inset:0}
.pill{position:absolute;top:270px;padding:12px 30px;border-radius:60px;background:#0F1B33E6;color:#fff;font-weight:600;font-size:40px;z-index:8}
.sub{position:absolute;left:30px;right:30px;top:1365px;z-index:8;text-align:center;white-space:nowrap;font-weight:800;font-size:96px;line-height:1.15;color:#fff;-webkit-text-stroke:15px #0F1B33;paint-order:stroke fill}
.sub b{color:#FF4B4B}
.sub.en{font-size:64px;-webkit-text-stroke:12px #0F1B33;color:#FFE27A}
.sub.th{top:1560px;font-size:64px}
.bub{position:absolute;z-index:6;background:#fff;border:8px solid #0F1B33;border-radius:38px;padding:18px 30px;font-weight:800;font-size:54px;line-height:1.2;color:#0F1B33;text-align:center;max-width:760px}
.bub:after{content:"";position:absolute;bottom:-44px;border:22px solid transparent;border-top:28px solid #0F1B33}
.bub.l:after{left:110px}.bub.r:after{right:110px}
.bub.bad{border-color:#E5484D}.bub.bad:after{border-top-color:#E5484D}
.bub.ok{border-color:#2DBE6C;background:#F0FCF4}.bub.ok:after{border-top-color:#2DBE6C}
.bub em{font-style:normal;background:#FFD43B;border-radius:10px;padding:0 8px}
.rule{position:absolute;left:46px;right:46px;top:360px;z-index:7;background:#FFF8EC;border:6px solid #0F1B33;border-radius:16px;padding:22px 34px 30px;box-shadow:0 14px 0 #0F1B3330}
.rule small{display:inline-block;background:#E5484D;color:#fff;font-weight:800;font-size:38px;padding:2px 18px;border-radius:10px;margin-bottom:10px}
.rule div{font-weight:800;font-size:68px;color:#0F1B33;line-height:1.15}
[data-in]{opacity:0;transform-origin:center}
.title{position:absolute;left:40px;right:40px;top:380px;z-index:7;text-align:center;font-weight:800;font-size:104px;line-height:1.1;color:#E5484D;-webkit-text-stroke:14px #fff;paint-order:stroke fill}
.title small{display:block;font-size:64px;color:#0F1B33}
.word{position:absolute;left:60px;right:60px;z-index:7;background:#fff;border:8px solid #0F1B33;border-radius:30px;padding:16px 36px;display:flex;align-items:baseline;gap:24px;font-weight:800;color:#0F1B33;white-space:nowrap}
.word span{font-size:72px;color:#E8590C}.word u{text-decoration:none;font-size:52px;margin-left:auto}
#tint{position:absolute;inset:0;z-index:5;background:#0F1B33;opacity:0}
.cup{position:absolute}
</style></head><body>
<svg viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#F3E3CF"/>
  <rect y="0" width="1080" height="1000" fill="#EAD2B5"/>
  <g opacity=".35" stroke="#C9A97F" stroke-width="4"><line x1="60" y1="0" x2="60" y2="1000"/><line x1="180" y1="0" x2="180" y2="1000"/><line x1="300" y1="0" x2="300" y2="1000"/><line x1="420" y1="0" x2="420" y2="1000"/><line x1="540" y1="0" x2="540" y2="1000"/><line x1="660" y1="0" x2="660" y2="1000"/><line x1="780" y1="0" x2="780" y2="1000"/><line x1="900" y1="0" x2="900" y2="1000"/><line x1="1020" y1="0" x2="1020" y2="1000"/></g>
  <!-- ป้ายเมนู -->
  <g id="menu" transform="translate(560 300)"><rect width="460" height="300" rx="20" fill="#2B2B2B" stroke="#6B4423" stroke-width="12"/>
    <text x="230" y="70" text-anchor="middle" font-family="K" font-weight="800" font-size="52" fill="#FFD43B">MENU</text>
    <text x="40" y="140" font-family="K" font-weight="600" font-size="40" fill="#fff">Americano</text><text x="420" y="140" text-anchor="end" font-family="K" font-weight="600" font-size="40" fill="#fff">$3</text>
    <text x="40" y="196" font-family="K" font-weight="600" font-size="40" fill="#fff">Latte</text><text x="420" y="196" text-anchor="end" font-family="K" font-weight="600" font-size="40" fill="#fff">$4</text>
    <text x="40" y="252" font-family="K" font-weight="600" font-size="40" fill="#fff">Mocha</text><text x="420" y="252" text-anchor="end" font-family="K" font-weight="600" font-size="40" fill="#fff">$4</text></g>
  <g id="fx"></g>
  <!-- เคาน์เตอร์ (บังขาบาริสต้า) -->
  <rect x="470" y="1010" width="610" height="320" fill="#8A5A36"/><rect x="450" y="990" width="630" height="34" rx="10" fill="#C08A5C"/>
  <g transform="translate(980 900)"><rect x="-60" y="0" width="120" height="90" rx="12" fill="#495057" stroke="#0F1B33" stroke-width="5"/><rect x="-40" y="-60" width="80" height="62" rx="10" fill="#868E96" stroke="#0F1B33" stroke-width="5"/></g>
  <rect y="1330" width="1080" height="590" fill="#B98A62"/><rect y="1330" width="1080" height="14" fill="#9C6F4A"/>
  <g id="cupIce" opacity="0"><path d="M-36 -110 h72 l-10 110 h-52z" fill="#E7F5FF" stroke="#0F1B33" stroke-width="6"/><g fill="#fff" stroke="#74C0FC" stroke-width="3"><rect x="-22" y="-80" width="20" height="20" rx="4"/><rect x="4" y="-66" width="20" height="20" rx="4"/><rect x="-12" y="-46" width="20" height="20" rx="4"/></g></g>
  <g id="cupCof" opacity="0"><path d="M-40 -130 h80 l-12 130 h-56z" fill="#E7F5FF" stroke="#0F1B33" stroke-width="6"/><path d="M-36 -96 h72 l-9 92 h-54z" fill="#5C3317"/><rect x="-44" y="-142" width="88" height="16" rx="6" fill="#F1F3F5" stroke="#0F1B33" stroke-width="5"/><line x1="12" y1="-142" x2="30" y2="-200" stroke="#2F9E44" stroke-width="10" stroke-linecap="round"/></g>
  <g id="mew"></g><g id="sg"></g>
  <g id="conf"></g>
</svg>
<div id="tint"></div>
<div class="pill" style="left:46px">🎬 มิวเอาตัวรอดเมืองฝรั่ง · EP.4</div>
<div id="dyn"></div>
<script src="ep5/data.js"></script>
<script src="cast.js"></script>
<script>
$('mew').innerHTML = person('m', MEW);
$('fx').innerHTML = `<g id="f">${person('f', { top: '#2F9E44', legs: '#343A40', male: true, hair: '#5C3A21', skin: '#F8D9C2' })}</g>`;
$('sg').innerHTML = SHEETGUY;
$('conf').innerHTML = Array.from({ length: 30 }, (_, i) => `<rect class="cf" width="22" height="34" rx="4" fill="${['#FFD43B', '#E5484D', '#2DBE6C', '#1F6FEB'][i % 4]}"/>`).join('');
const L = {}, H = [], SFX = []; let T = 0.4;
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const red = (s) => esc(s).replace(/\*([^*]+)\*/g, '<b>$1</b>');
const EM = ['small iced Americano', 'small ice', 'For here or to go', 'To go', 'cup of ice'];
for (const ln of window.EP) {
  const a = T, b = T + ln.dur; L[ln.k] = { a, b, ch: (ln.chunks || []).map((c) => a + c[0]) }; SFX.push([+a.toFixed(2), `ep5/${ln.k}.wav`]);
  if (ln.kind === 'narr') ln.chunks.forEach(([s, e, txt]) => H.push(`<div class="sub" data-in="${(a + s).toFixed(2)}" data-out="${(a + e - 0.02).toFixed(2)}" data-anim="pop">${red(txt)}</div>`));
  else {
    const who = ln.kind === 'men' ? 'l' : 'r', cls = ln.k === 'm1' ? 'bad' : ln.k === 'm3' ? 'ok' : '';
    let txt = esc(ln.text); EM.forEach((w) => { txt = txt.replace(new RegExp(`(^|[^>\\w])${w}(?![\\w<])`), (m, p) => `${p}<em>${w}</em>`); });
    H.push(`<div class="bub ${who} ${cls}" data-in="${a.toFixed(2)}" data-out="${(b + 0.5).toFixed(2)}" data-anim="pop" style="${who === 'l' ? 'left:40px' : 'right:40px'};top:560px;max-width:700px">${txt}</div>`);
    H.push(`<div class="sub en" data-in="${a.toFixed(2)}" data-out="${(b + 0.5).toFixed(2)}" data-anim="none">${esc(ln.th)}</div>`);
  }
  T = b + (ln.kind === 'narr' ? 0.35 : 0.55);
}
const at = (k, i) => L[k].ch[i];
H.push(`<div class="title" data-in="0.30" data-out="${(at('n1', 3) - 0.1).toFixed(2)}" data-anim="pop"><small>มิว EP.4 สั่งกาแฟ</small>แต่ได้ของผิด!</div>`);
H.push(`<div class="rule" data-in="${L.n2.a.toFixed(2)}" data-out="${(L.n2.b + 0.3).toFixed(2)}" data-anim="pop"><small>For here or to go?</small><div>For here = ทานที่นี่<br>To go = เอากลับบ้าน</div></div>`);
H.push(`<div class="rule" data-in="${L.n4.a.toFixed(2)}" data-out="${(L.n4.b + 0.3).toFixed(2)}" data-anim="pop"><small>กฎสั่งกาแฟ</small><div>ขนาด + ร้อน/เย็น + เมนู<p style="font-size:56px;margin-top:6px;color:#1F6FEB">small · iced · Americano</p></div></div>`);
[['iced', 'เย็น (ใส่น้ำแข็ง)'], ['for here', 'ทานที่นี่'], ['to go', 'เอากลับบ้าน']].forEach(([en, th], i) => H.push(`<div class="word" data-in="${at('n5', i + 1).toFixed(2)}" data-out="${(L.n5.b + 0.3).toFixed(2)}" data-anim="pop" style="top:${380 + i * 170}px"><span>${en}</span><u>${th}</u></div>`));
const E0 = T;
H.push(`<div class="sub" data-in="${E0.toFixed(2)}" data-out="${(E0 + 4.2).toFixed(2)}" data-anim="pop" style="font-size:66px">เคยสั่งผิดไหม? เมนต์เลย 👇<br><b>+ ติดตาม</b> รอตอนต่อไป</div>`);
const POP = [[at('n1', 2) + 0.3, 'café', 'ร้านกาแฟ'], [at('n3', 1) + 0.3, 'ice', 'น้ำแข็ง'], [at('n4', 1) + 0.1, 'size', 'ขนาด', { top: 1175 }], [at('n4', 3) + 0.1, 'menu', 'เมนู', { top: 1175 }], [at('n6', 0) + 0.3, 'order', 'สั่ง (อาหาร/เครื่องดื่ม)']];
H.push(popWords(POP));
SFX.push([0.3, 'pop'], [+(L.m1.a).toFixed(2), 'boing'], [+(L.n2.a).toFixed(2), 'ding'], [+(L.f3.a).toFixed(2), 'boing'], [+(L.n4.a).toFixed(2), 'ding'], [+(L.f4.a).toFixed(2), 'chime'], [+(L.n5.a).toFixed(2), 'whoosh'], [+E0.toFixed(2), 'tada']);
window.DURATION = +(E0 + 4.4).toFixed(2); window.SFX = SFX;
$('dyn').innerHTML = H.join('');
document.querySelectorAll('.sub,.word').forEach((el) => { let f = parseFloat(getComputedStyle(el).fontSize); while (el.scrollWidth > el.clientWidth && f > 40) { f -= 4; el.style.fontSize = f + 'px'; } });
const els = [...document.querySelectorAll('[data-in]')];
const inL = (k, t, pad = 0) => t >= L[k].a - pad && t < L[k].b + pad;
function seek(t) {
  tick(els, t);
  $('menu').setAttribute('opacity', cl((t - at('n1', 3) + 0.1) / 0.4)); // ฮุก 3 วิแรกไม่ให้ป้ายเมนูทับหัวข้อ
  const walk = cl((t - 0.6) / 2.2), mx = -250 + 530 * outc(walk);
  $('mew').setAttribute('transform', `translate(${mx} ${1330 + (walk < 1 ? -Math.abs(Math.sin(t * 7)) * 10 : Math.sin(t * 3) * 4)}) scale(0.72)`);
  $('fx').setAttribute('transform', `translate(800 ${1330 + Math.sin(t * 2.5) * 4}) scale(0.72)`);
  let fm = 'smile', mm = 'smile';
  if (t >= L.f2.b && t < L.m2.a) mm = 'think';
  if (t >= L.f3.a && t < L.n4.a) mm = 'shock';
  if (t >= L.n4.a && t < L.m3.a) mm = 'determined';
  if (t >= L.f4.a) { fm = 'happy'; mm = 'happy'; }
  const talkF = ['f1', 'f2', 'f3', 'f4'].some((k) => inL(k, t)), talkM = ['m1', 'm2', 'm3'].some((k) => inL(k, t));
  face('f', talkF ? 'talk' : fm, t + 1.2); face('m', talkM ? 'talk' : mm, t);
  arms('f', fm === 'happy' ? 150 : 14, inL('f3', t) || inL('f4', t) ? -70 : -14);
  arms('m', mm === 'happy' ? 160 : mm === 'shock' ? 160 : 14, talkM ? -60 - Math.sin(t * 6) * 14 : mm === 'happy' ? -160 : mm === 'shock' ? -160 : -14);
  const ice = t >= L.f3.a && t < L.m3.b; $('cupIce').setAttribute('opacity', ice ? 1 : 0); $('cupIce').setAttribute('transform', `translate(600 ${1000 - (ice ? 0 : 0)}) scale(${ice ? 0.9 + 0.1 * back(cl((t - L.f3.a) / 0.4)) : 1})`);
  const cof = t >= L.f4.b - 0.4; $('cupCof').setAttribute('opacity', cof ? 1 : 0); $('cupCof').setAttribute('transform', `translate(600 1000) scale(${cof ? 0.9 + 0.1 * back(cl((t - L.f4.b + 0.4) / 0.4)) : 1})`);
  const dim = inL('n4', t, 0.2) || inL('n5', t, 0.2) || inL('n2', t, 0.2); $('tint').style.opacity = dim ? 0.35 : 0;
  const sgOn = inL('n4', t, 0.1), sp = cl((t - L.n4.a) / 0.5);
  $('sg').setAttribute('opacity', sgOn ? 1 : 0); $('sg').setAttribute('transform', `translate(540 ${1230 - 240 * back(sp) - Math.abs(Math.sin(t * 5)) * 20}) scale(1.3)`);
  const tt = t - L.f4.b + 0.3; document.querySelectorAll('.cf').forEach((c, i) => { if (tt < 0 || tt > 1.6) { c.setAttribute('opacity', 0); return; } const vx = ((i * 37) % 21 - 10) * 30, vy = -700 - ((i * 53) % 9) * 70; c.setAttribute('opacity', 1); c.setAttribute('transform', `translate(${540 + vx * tt} ${900 + vy * tt + 900 * tt * tt}) rotate(${i * 40 + tt * 400})`); });
}
window.seek = seek; seek(0);
</script>
</body></html>
