<style>

<svg viewBox="0 0 1080 1920">

      <circle cx="370" cy="70" r="14" fill="#FFF3BF" stroke="#0F1B33" stroke-width="5"/></g>

  <g id="sRoad"><rect width="1080" height="1920" fill="url(#sky)"/><g id="clouds"></g><rect y="1000" width="1080" height="400" fill="#7BC67E"/><rect y="1080" width="1080" height="200" fill="#495057"/><path id="lane" d="" stroke="#fff" stroke-width="12" stroke-dasharray="60 50"/></g>
  <g id="sDim"><rect width="1080" height="1920" fill="#1B2440"/><rect y="1080" width="1080" height="200" fill="#2B3036"/><g id="oldbus"></g><rect id="dark" width="1080" height="1320" fill="#0B1020" opacity="0"/></g>
  <g id="sMeet"><rect width="1080" height="1920" fill="#FFF4E2"/><rect x="190" y="430" width="700" height="360" rx="20" fill="#2F5D50" stroke="#6B4F2A" stroke-width="18"/><text x="540" y="580" text-anchor="middle" font-family="K" font-weight="800" font-size="120" fill="#fff">1939</text><text x="540" y="700" text-anchor="middle" font-family="K" font-weight="600" font-size="50" fill="#fff" opacity=".85">SCHOOL BUS STANDARDS</text>
    <rect x="160" y="1140" width="760" height="70" rx="20" fill="#B0773C" stroke="#0F1B33" stroke-width="7"/><g id="heads"></g></g>
  <g id="sSwatch"><rect width="1080" height="1920" fill="#F1F3F5"/><g id="sw"></g><rect id="swsel" y="0" width="120" height="420" rx="16" fill="none" stroke="#0F1B33" stroke-width="12"/></g>
  <g id="sDawn"><rect width="1080" height="1920" fill="url(#dawn)"/><circle cx="880" cy="1060" r="110" fill="#FFB86B"/><rect y="1080" width="1080" height="240" fill="#2B3036"/><g id="car" opacity=".35"><rect x="-150" y="-70" width="300" height="110" rx="30" fill="#868E96" stroke="#0F1B33" stroke-width="7"/><circle cx="-90" cy="45" r="32" fill="#212529"/><circle cx="90" cy="45" r="32" fill="#212529"/></g></g>
  <g id="sText"><rect width="1080" height="1920" fill="#FFF9DB"/></g>
  <g id="sVocab"><rect width="1080" height="1920" fill="#E9F3FF"/><g transform="translate(160 1030)"><rect x="-120" y="-200" width="240" height="260" fill="#FFC9C9" stroke="#0F1B33" stroke-width="7"/><path d="M-150 -200 L0 -300 L150 -200z" fill="#E5484D" stroke="#0F1B33" stroke-width="7"/><rect x="-40" y="-60" width="80" height="120" fill="#845EF7" stroke="#0F1B33" stroke-width="6"/></g><rect y="1090" width="1080" height="230" fill="#ADB5BD"/></g>
  <g id="sEnd"><rect width="1080" height="1920" fill="#FFF4E2"/><g id="endbus"></g></g>
  <!-- รถโรงเรียนตัวเอก -->
  <g id="bus" style="color:#FFB000"><circle id="bglow" r="460" fill="url(#glow)" opacity="0"/><use href="#BUS"/></g>

  <line id="karr" stroke="#2F9E44" stroke-width="16" stroke-linecap="round" marker-end="url(#ah)" opacity="0"/>
  <rect y="1320" width="1080" height="600" fill="#0F1B33" opacity=".86"/>
  <g id="host"></g>
</svg>
<div class="pill" style="left:46px">🤔 ทำไมถึงเป็นแบบนั้น? · EP.3</div>
<div id="dyn"></div>
<script src="why3/data.js"></script>
<script src="cast.js"></script>
<script>
$('clouds').innerHTML = [[150, 450, 1], [700, 400, 1.3], [420, 650, .8], [900, 700, 1]].map(([x, y, s]) => `<g transform="translate(${x} ${y}) scale(${s})"><ellipse rx="110" ry="46" fill="#fff"/><ellipse cx="-60" cy="10" rx="70" ry="36" fill="#fff"/><ellipse cx="70" cy="12" rx="80" ry="38" fill="#fff"/></g>`).join('');
// รถเก่าสีต่างๆ (แดง ขาว น้ำเงิน)
$('oldbus').innerHTML = [['#C92A2A', 200, 760], ['#F1F3F5', 760, 900], ['#1C3D8C', 300, 1180]].map(([c, x, y]) => `<g transform="translate(${x} ${y}) scale(.6)" style="color:${c}"><use href="#BUS"/></g>`).join('');
$('heads').innerHTML = [260, 420, 580, 740, 860].map((x, i) => `<g transform="translate(${x} 1120)"><rect x="-55" y="-90" width="110" height="100" rx="40" fill="${['#4C6EF5', '#2F9E44', '#E8590C', '#845EF7', '#495057'][i]}"/><circle cy="-140" r="55" fill="#F2C29B" stroke="#0F1B33" stroke-width="6"/><path d="M-55 -150 C-55 -215 55 -215 55 -150 C30 -175 -30 -175 -55 -150z" fill="${i === 2 ? '#ADB5BD' : '#1F1A24'}"/>${i === 2 ? '<circle cx="-20" cy="-140" r="16" fill="none" stroke="#0F1B33" stroke-width="5"/><circle cx="20" cy="-140" r="16" fill="none" stroke="#0F1B33" stroke-width="5"/>' : ''}</g>`).join('');
const SW = ['#FFF3A0', '#FFEC6E', '#FFE03D', '#FFD21F', '#FFB000', '#FF9800', '#FF7A1A', '#F25C2A', '#E03B2A'];
$('sw').innerHTML = SW.map((c, i) => `<rect x="${40 + i * 112}" y="560" width="100" height="400" rx="12" fill="${c}" stroke="#0F1B33" stroke-width="5"/>`).join('');
$('endbus').innerHTML = [['#FF6EB4', 280, 720], ['#4C6EF5', 800, 880], ['#2F9E44', 360, 1100]].map(([c, x, y]) => `<g transform="translate(${x} ${y}) scale(.55)" style="color:${c}"><use href="#BUS"/><text x="0" y="-200" text-anchor="middle" font-family="K" font-weight="800" font-size="160" fill="#0F1B33">?</text></g>`).join('');
$('host').innerHTML = `<g id="hg">${SHEETGUY}</g>`;

// ---------- ไทม์ไลน์ ----------
const L = {}, H = [], SFX = []; let T = 0.4;
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[c]);
const red = (s) => esc(s).replace(/\*([^*]+)\*/g, '<b>$1</b>');
const EM = ['drop off', 'pick me up'];
for (const ln of window.EP) {
  const a = T, b = T + ln.dur; L[ln.k] = { a, b, ch: (ln.chunks || []).map((c) => a + c[0]) }; SFX.push([+a.toFixed(2), `why3/${ln.k}.wav`]);
  if (ln.kind === 'narr') ln.chunks.forEach(([s, e, txt]) => H.push(`<div class="sub" data-in="${(a + s).toFixed(2)}" data-out="${(a + e - 0.02).toFixed(2)}" data-anim="pop">${red(txt)}</div>`));
  else { let tx = esc(ln.text); EM.forEach((w) => { tx = tx.replace(w, `<em>${w}</em>`); }); H.push(`<div class="bub" data-in="${a.toFixed(2)}" data-out="${(b + 0.6).toFixed(2)}" data-anim="pop">🔊 ${tx}</div>`); H.push(`<div class="sub en" data-in="${a.toFixed(2)}" data-out="${(b + 0.6).toFixed(2)}" data-anim="none">${esc(ln.th)}</div>`); }
  T = b + (ln.kind === 'narr' ? 0.4 : 0.7);
}
const at = (k, i) => L[k].ch[i];
const chip = (a, b, style, html) => H.push(`<div class="chip" data-in="${a.toFixed(2)}" data-out="${b.toFixed(2)}" data-anim="pop" style="${style}">${html}</div>`);
H.push(`<div class="title" data-in="${at('n1', 1).toFixed(2)}" data-out="${(L.n1.b + 0.3).toFixed(2)}" data-anim="pop">ทำไมสีเหลือง?</div>`);
chip(at('n2', 3), L.n2.b + 0.3, 'left:80px;top:420px;background:#FF6B6B', '😵 มองเห็นยาก');
chip(at('n3', 1), L.n3.b + 0.3, 'left:80px;top:810px;font-size:56px;background:#fff', '👨‍🏫 อาจารย์แฟรงก์ ไซร์');
chip(at('n3', 3), L.n3.b + 0.3, 'right:80px;top:1200px;font-size:52px', '📋 มาตรฐานรถโรงเรียน');
chip(at('n4', 1), L.n4.b + 0.3, 'left:40px;top:1000px;font-size:48px;background:#FFF3A0', '🍋 เหลืองมะนาว');
chip(at('n4', 2), L.n4.b + 0.3, 'right:40px;top:1000px;font-size:48px;background:#F25C2A;color:#fff', 'ส้มแดง 🔥');
chip(at('n5', 0), L.n5.b + 0.3, 'left:80px;top:420px;background:#FFB000', '✅ เหลืองทอง');
chip(at('n5', 2), L.n5.b + 0.3, 'right:80px;top:560px;font-size:52px;background:#fff', '🌅 เช้ามืด · 🌇 ตอนเย็น');
chip(at('n6', 2), L.n6.b + 0.3, 'left:80px;top:420px;font-size:56px', '🖤 ดำบนเหลือง = อ่านชัด');
// การ์ดคำศัพท์
const VE = L.e2.b + 0.6;
H.push(`<div class="word" data-in="${at('n7', 1).toFixed(2)}" data-out="${VE.toFixed(2)}" data-anim="pop" style="top:400px"><span>school bus</span><u>รถโรงเรียน</u></div>`);
H.push(`<div class="word" data-in="${at('n7', 2).toFixed(2)}" data-out="${VE.toFixed(2)}" data-anim="pop" style="top:560px"><span>drop off</span><u>ไปส่ง</u></div>`);
H.push(`<div class="word" data-in="${at('n7', 3).toFixed(2)}" data-out="${VE.toFixed(2)}" data-anim="pop" style="top:720px"><span>pick up</span><u>ไปรับ</u></div>`);
const E0 = T;
H.push(`<div class="sub" data-in="${E0.toFixed(2)}" data-out="${(E0 + 4).toFixed(2)}" data-anim="pop" style="font-size:66px">เมนต์สีที่คุณเลือก 👇<br><b>+ ติดตาม</b> รอ "ทำไม" ตอนต่อไป</div>`);
SFX.push([+at('n1', 1).toFixed(2), 'boing'], [+L.n2.a.toFixed(2), 'whoosh'], [+at('n2', 3).toFixed(2), 'pop'], [+L.n3.a.toFixed(2), 'whoosh'], [+L.n4.a.toFixed(2), 'whoosh'], [+at('n5', 0).toFixed(2), 'ding'], [+L.n6.a.toFixed(2), 'whoosh'], [+at('n7', 1).toFixed(2), 'pop'], [+at('n7', 2).toFixed(2), 'pop'], [+at('n7', 3).toFixed(2), 'pop'], [+E0.toFixed(2), 'tada']);
window.DURATION = +(E0 + 4.2).toFixed(2); window.SFX = SFX;
$('dyn').innerHTML = H.join('');
document.querySelectorAll('.sub').forEach((el) => { let f = parseFloat(getComputedStyle(el).fontSize); while (el.scrollWidth > el.clientWidth && f > 40) { f -= 4; el.style.fontSize = f + 'px'; } });
const els = [...document.querySelectorAll('[data-in]')];
const inR = (a, b, t) => t >= a && t < b;

function seek(t) {
  tick(els, t);
  const S = t < L.n2.a ? 'road' : t < L.n3.a ? 'dim' : t < L.n4.a ? 'meet' : t < L.n5.a ? 'swatch' : t < L.n6.a ? 'dawn' : t < L.n7.a ? 'text' : t < L.n8.a ? 'vocab' : 'end';
  const show = (id, on) => $(id).setAttribute('opacity', on ? 1 : 0);
  ['road', 'dim', 'meet', 'swatch', 'dawn', 'text', 'vocab', 'end'].forEach((k) => show('s' + k[0].toUpperCase() + k.slice(1), S === k));
  $('clouds').setAttribute('transform', `translate(${-((t * 40) % 300)} 0)`);
  let d = ''; for (let x = -((t * 300) % 110); x < 1080; x += 110) d += `M${x} 1180 h60 `; $('lane').setAttribute('d', d);
  // รถตัวเอก
  const bus = $('bus'), bob = Math.abs(Math.sin(t * 9)) * 5;
  let bx = 540, by = 1000, bs = 1, on = ['road', 'dawn', 'text', 'vocab'].includes(S);
  if (S === 'road') { bx = -400 + 940 * outc(cl((t - L.n1.a) / 1.6)); by = 1080 - bob; bs = 1; }
  if (S === 'dawn') { bx = 420; by = 1120 - bob; bs = 0.9; }
  if (S === 'text') { bx = 560; by = 880; bs = 1.45; }
  if (S === 'vocab') { bx = 650; by = 1120; bs = 0.8; }
  bus.setAttribute('transform', `translate(${bx} ${by}) scale(${bs})`); show('bus', on);
  $('bglow').setAttribute('opacity', S === 'dawn' && t > at('n5', 1) ? 0.6 + Math.sin(t * 5) * 0.2 : 0);
  document.querySelectorAll('.bt').forEach((x) => x.setAttribute('font-size', S === 'text' && t > L.n6.a ? 50 + 6 * Math.abs(Math.sin(t * 4)) : 50));
  $('car').setAttribute('transform', `translate(${900 - ((t - L.n5.a) * 60)} 1180)`);
  // รถเก่ามืดลง
  $('dark').setAttribute('opacity', S === 'dim' ? 0.65 * cl((t - at('n2', 3)) / 0.8) : 0);
  // แถบสี: กรอบเลื่อนจากซ้ายไปขวา แล้วหยุดที่เหลืองทอง
  const sp = S === 'swatch' ? cl((t - at('n4', 1)) / (L.n4.b - at('n4', 1))) : 1, idx = S === 'swatch' ? sp * 8 : 4;
  $('swsel').setAttribute('x', 40 + idx * 112 - 10); $('swsel').setAttribute('y', 550); $('swsel').setAttribute('height', 420);
  // เด็กขึ้นลงรถ (drop off / pick up)
  const kidOn = S === 'vocab' && t > at('n7', 2), up = t > at('n7', 3) && !inR(L.e1.a, L.e1.b + 0.6, t);
  show('kid', kidOn); $('kid').setAttribute('transform', `translate(${up ? 420 : 330} ${1280 + (Math.sin(t * 6) > 0 ? -6 : 0)}) scale(.9)`);
  $('karr').setAttribute('opacity', kidOn ? 1 : 0);
  if (up) { $('karr').setAttribute('x1', 330); $('karr').setAttribute('y1', 1200); $('karr').setAttribute('x2', 440); $('karr').setAttribute('y2', 1200); } else { $('karr').setAttribute('x1', 440); $('karr').setAttribute('y1', 1200); $('karr').setAttribute('x2', 300); $('karr').setAttribute('y2', 1200); }
  // พี่ชีท
  const talking = window.EP.some((e) => e.kind === 'narr' && inR(L[e.k].a, L[e.k].b, t));
  $('host').setAttribute('transform', `translate(960 ${1310 - (talking ? Math.abs(Math.sin(t * 7)) * 18 : 0)}) scale(.42)`);
}
window.seek = seek; seek(0);
</script>
