<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ร้านหนังสือ/ชีทเรียน</title>
<!--OG-START--><meta property="og:type" content="website"><meta property="og:title" content="ร้านหนังสือ/ชีทเรียน"><meta property="og:description" content="ชีทสรุปและอีบุ๊ก PDF ชำระเงินแล้วดาวน์โหลดได้ทันที"><meta name="twitter:card" content="summary_large_image"><!--OG-END-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Mitr:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#EDF1F7;--surface:#FFFFFF;--ink:#0F1B33;--muted:#56637D;--line:#D3DBE8;
  --brand:#2440E8;--hero-ink:#FFFFFF;--accent:#FFD23F;--accent-ink:#0F1B33;
  --ok:#0F7A55;--okbg:#DDF3EA;--warn:#8A5300;--warnbg:#FCEBC8;--bad:#B42318;--badbg:#FBE1DE;
  --font-body:'IBM Plex Sans Thai','Noto Sans Thai','Sarabun',system-ui,-apple-system,sans-serif;
  --font-head:'Mitr','Prompt','IBM Plex Sans Thai',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1220;--surface:#131C30;--ink:#EAF0FF;--muted:#9AA7C4;--line:#27334F;
    --brand:#8EA0FF;
    --ok:#5FD3A5;--okbg:#0F3527;--warn:#F3B85B;--warnbg:#3A2A0A;--bad:#FF8F84;--badbg:#3F1512;
  }
}
:root[data-theme="dark"]{
  --bg:#0B1220;--surface:#131C30;--ink:#EAF0FF;--muted:#9AA7C4;--line:#27334F;
  --brand:#8EA0FF;
  --ok:#5FD3A5;--okbg:#0F3527;--warn:#F3B85B;--warnbg:#3A2A0A;--bad:#FF8F84;--badbg:#3F1512;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.65}
h1,h2,h3{font-family:var(--font-head);font-weight:500;line-height:1.3;margin:0}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 6px;word-break:break-all}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.wrap.wide{max-width:960px}
.muted{color:var(--muted)}
.fine{font-size:14px;color:var(--muted)}

/* demo bar */
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 16px;max-width:960px;margin:0 auto}
.bar-note{font-size:13px;color:var(--muted);line-height:1.3}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;flex-shrink:0}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.urlbar{background:var(--surface);border-bottom:1px solid var(--line);padding:10px 0}
.urlbar-in{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.urlbar select{background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;max-width:100%}
.draftnote{background:var(--warnbg);color:var(--warn);padding:8px 16px;text-align:center;font-size:14px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 22px;font-weight:600;font-size:16px;cursor:pointer;text-decoration:none;transition:transform .12s ease,filter .12s ease}
.btn:active{transform:scale(.98)}
.btn-cta{background:var(--accent);color:var(--accent-ink)}
.btn-cta:hover{filter:brightness(.96)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-line{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
.btn-danger{background:var(--bad);color:#fff}
.btn-sm{padding:8px 14px;font-size:14px;border-radius:10px}
.btn-block{width:100%}

/* hero */
.hero{background:var(--hero,#2440E8);color:var(--hero-ink);padding:36px 0 40px}
.hero-in{display:grid;gap:28px}
.hero h1{font-size:clamp(28px,7.2vw,44px);letter-spacing:-.01em}
.lead{font-size:17px;margin-top:14px;opacity:.92;max-width:34em}
.price-row{display:flex;align-items:baseline;gap:12px;margin:22px 0 16px}
.price-row .old{text-decoration:line-through;opacity:.65;font-size:18px}
.price-row .now{font-family:var(--font-head);font-size:34px}
.hero .fine{color:var(--hero-ink);opacity:.8;margin-top:12px}
.cover{width:100%;max-width:300px;height:auto;justify-self:center}
@media(min-width:760px){.hero-in{grid-template-columns:1fr 1fr;align-items:center}}

/* sections */
.section{padding:34px 0}
.section h2{font-size:24px;margin-bottom:16px}
.feat{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.feat li{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.tick{flex:0 0 24px;height:24px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;margin-top:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.field{display:grid;gap:6px;margin-bottom:14px}
.field label,.field .lbl{font-weight:500;font-size:15px}
.input{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px}
.input:focus{border-color:var(--brand);outline:none}
textarea.input{min-height:110px;resize:vertical}
.row{display:flex;gap:8px}
.row .input{flex:1;min-width:0}
.err{color:var(--bad);font-size:14px}
.okmsg{color:var(--ok);font-size:14px}
.methods{display:grid;gap:10px;margin-bottom:16px}
.method{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;background:var(--bg)}
.method:has(input:checked){border-color:var(--brand);background:var(--surface);box-shadow:inset 0 0 0 1px var(--brand)}
.method input{accent-color:var(--brand);width:18px;height:18px}
.sum{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px;display:grid;gap:6px;margin-bottom:16px}
.sum div{display:flex;justify-content:space-between}
.sum .total{font-weight:600;font-size:18px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:10px}
summary{cursor:pointer;font-weight:500}
details p{margin-top:8px;color:var(--muted)}
footer{padding:28px 0 110px;text-align:center}

/* sticky cta */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;transform:translateY(0);transition:transform .2s ease}
.sticky.hide{transform:translateY(110%)}
.sticky-in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px}
.sticky-in .p{font-family:var(--font-head);font-size:20px;white-space:nowrap}
.sticky-in .btn{flex:1}

/* pay + thanks */
.center{text-align:center}
.qrbox{background:#fff;border-radius:14px;padding:10px;width:230px;margin:14px auto;border:1px solid var(--line)}
.qrbox svg{display:block;width:100%;height:auto}
.amount{font-family:var(--font-head);font-size:38px;margin:4px 0}
.stack{display:grid;gap:10px;margin-top:16px}
.big-ok{width:64px;height:64px;border-radius:50%;background:var(--okbg);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px}

/* admin */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:14px 0 4px}
.tabs button{border:1.5px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500;white-space:nowrap;font-size:15px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}
@media(min-width:640px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .v{font-family:var(--font-head);font-size:24px;line-height:1.2}
.kpi .l{font-size:14px;color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:6px 0 12px}
.filters select{background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.order{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.order-head{width:100%;display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;text-align:left;background:transparent;border:0;padding:12px 16px;cursor:pointer}
.order-head .l1{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order-head .r1{font-weight:600;text-align:right}
.order-head .l2{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.order-head .badge{justify-self:end}
.badge{display:inline-block;font-size:13px;font-weight:600;padding:2px 10px;border-radius:999px}
.badge.ok{background:var(--okbg);color:var(--ok)}
.badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)}
.badge.gray{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.order-body{border-top:1px solid var(--line);padding:12px 16px 14px;display:grid;gap:10px}
.o-info{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--muted)}
.log{list-style:none;margin:0;padding:0 0 0 14px;border-left:2px solid var(--line);display:grid;gap:6px;font-size:14px}
.log .muted{margin-right:6px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.empty{text-align:center;padding:36px 16px;background:var(--surface);border:1px dashed var(--line);border-radius:14px}
.empty p{margin-bottom:14px}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px}
.prod{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;display:grid;gap:8px;border-left:6px solid var(--c,#2440E8)}
.prod-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
.prod-top b{font-size:17px}
.prod-stats{display:flex;flex-wrap:wrap;gap:2px 16px;font-size:14px;color:var(--muted)}
.linkline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;gap:12px}
@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{position:relative;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px 6px 10px;cursor:pointer;background:var(--bg)}
.sw input{position:absolute;opacity:0;inset:0;cursor:pointer}
.sw:has(input:checked){border-color:var(--ink);background:var(--surface)}
.sw:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.dot{width:16px;height:16px;border-radius:50%;background:var(--c)}
.ev{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.ev b{font-weight:600}
.h3{font-size:18px;margin:6px 0 10px}
.note{background:var(--warnbg);color:var(--warn);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:14px}
.field.hot{background:var(--badbg);border:2px solid var(--bad);border-radius:12px;padding:12px}
.field.hot label,.field.hot .lbl{color:var(--bad);font-weight:600}
.field.hot .input{border-color:var(--bad)}
.prod .warnline{color:var(--bad);font-size:14px;font-weight:500;margin:4px 0}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:15px;z-index:40;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}

/* sales page extras */
.cover-wrap{position:relative;width:100%;max-width:460px;justify-self:center}
.cover-wrap.has-img::before{content:"";position:absolute;inset:8px -8px -8px 8px;background:var(--accent);border-radius:20px;transform:rotate(4deg)}
.cover-img{position:relative;display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain;border-radius:12px;border:4px solid #fff;background:#fff;box-shadow:0 12px 30px rgba(0,0,0,.3)}
.tag{position:absolute;top:-14px;right:-8px;width:86px;height:86px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;text-align:center;font-family:var(--font-head);line-height:1.1;transform:rotate(10deg);box-shadow:0 6px 16px rgba(0,0,0,.28);z-index:2}
.tag b{font-size:26px;font-weight:600}
.proof{margin-top:16px;padding-left:12px;border-left:4px solid var(--accent);font-size:15px;opacity:.95}
.promo{background:var(--ink);color:var(--bg);padding:12px 0}
.promo-in{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;font-weight:500}
.cd{display:flex;gap:6px}
.cd div{background:var(--accent);color:var(--accent-ink);border-radius:8px;min-width:50px;padding:4px 6px 3px;text-align:center;line-height:1.1}
.cd b{display:block;font-family:var(--font-head);font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.cd small{font-size:11px}
.pain{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pain li{display:flex;gap:12px;align-items:flex-start;padding:2px 0}
.cross{flex:0 0 24px;height:24px;border-radius:50%;background:var(--badbg);color:var(--bad);display:grid;place-items:center;margin-top:2px}
.midcta{text-align:center;margin-top:20px}
.gal{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.ticket{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--surface);border:2px dashed var(--brand);border-radius:14px;padding:12px 16px;margin-bottom:10px;font-weight:500}
.ticket .val{font-family:var(--font-head);color:var(--brand);white-space:nowrap;font-weight:500}
.chat{display:grid;gap:14px}
.msg .who{font-size:13px;color:var(--muted);margin:0 0 4px 12px}
.bub{background:var(--surface);border:1px solid var(--line);border-radius:18px 18px 18px 4px;padding:12px 16px;max-width:94%}
.guar{display:flex;gap:14px;align-items:center;margin-top:16px;padding:14px 16px;border-radius:14px;border:2px solid var(--ok);background:var(--okbg)}
.guar svg{flex:0 0 36px;color:var(--ok)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumb{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;cursor:pointer;font-size:16px;line-height:1}
.add{position:relative;width:84px;height:84px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;font-size:14px;color:var(--muted);cursor:pointer;text-align:center}
.add input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.add:has(input:focus-visible){outline:3px solid var(--brand);outline-offset:2px}
.sep{border:0;border-top:1px solid var(--line);margin:20px 0}

/* books and study sheets */
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.btn-ghost{background:transparent;border:1.5px solid rgba(255,255,255,.75);color:#fff}
.btn-ghost:hover{background:rgba(255,255,255,.12)}
.specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.specs>div{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.specs .k{font-size:13px;color:var(--muted)}
.specs b{font-weight:600}
.toc{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.toc li{display:flex;align-items:baseline;gap:6px}
.toc .dots{flex:1;border-bottom:2px dotted var(--line);transform:translateY(-4px);min-width:16px}
.toc .pg{color:var(--muted);font-variant-numeric:tabular-nums}
.toc-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.toc-card details{border:0;padding:0;margin:12px 0 0;background:transparent}
.who{display:grid;gap:12px}
@media(min-width:640px){.who.two{grid-template-columns:1fr 1fr}}
.who h3{font-size:17px;margin-bottom:10px}
.author{display:flex;gap:14px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.avatar{flex:0 0 52px;height:52px;border-radius:50%;background:var(--c,#2440E8);color:#fff;display:grid;place-items:center;font-family:var(--font-head);font-size:22px}
.author b{font-size:17px}
.terms{margin-top:10px;text-align:center}

/* full-size square images + lightbox */
.zoom{display:block;width:100%;padding:0;border:0;background:none;cursor:zoom-in;font:inherit}
.cover-wrap .zoom{position:relative}
.gal .zoom{flex:0 0 min(86%,440px);width:auto;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;scroll-snap-align:start}
.gal .zoom img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:contain}
.lb{position:fixed;inset:0;z-index:60;background:rgba(5,10,20,.94);display:grid;place-items:center;padding:12px;cursor:zoom-out}
.lb img{display:block;max-width:calc(100vw - 24px);max-height:calc(100vh - 24px);max-height:calc(100dvh - 24px);width:auto;height:auto;object-fit:contain;background:#fff;border-radius:8px}
.lb-x,.lb-n{position:absolute;border:0;border-radius:50%;width:44px;height:44px;background:rgba(255,255,255,.18);color:#fff;font-size:24px;line-height:1;cursor:pointer}
.lb-x{top:12px;right:12px}
.lb-n{top:50%;transform:translateY(-50%)}
.lb-n.prev{left:10px}.lb-n.next{right:10px}
.lb-c{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);color:#fff;font-size:14px;background:rgba(0,0,0,.45);padding:2px 12px;border-radius:999px}

/* ads tab */
.camp{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:8px;display:grid;gap:8px}
.adprev{max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ad-h{display:flex;gap:10px;align-items:center;padding:12px 14px}
.ad-h b{display:block;line-height:1.3}
.ad-h .avatar{flex:0 0 36px;width:36px;height:36px;font-size:16px}
.ad-p{padding:0 14px 10px;white-space:pre-line;font-size:15px;line-height:1.55;word-break:break-word}
.ad-img{position:relative;aspect-ratio:1/1;background:#fff;overflow:hidden}
.ad-img img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.ad-art{width:100%;height:100%;display:grid;place-items:center}
.ad-art .cover{width:70%;max-width:none}
.ad-f{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--bg);border-top:1px solid var(--line)}
.ad-f b{display:block;line-height:1.3;overflow-wrap:anywhere}
.ad-f .fine{display:block;line-height:1.3}
.ad-cta{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-weight:600;font-size:14px;white-space:nowrap}
.cnt{font-size:13px;color:var(--muted)}
.linkbox{display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.linkbox code{flex:1;min-width:0}

/* order bump + upsell */
.bump{display:flex;gap:12px;align-items:flex-start;border:1.5px dashed var(--brand);background:var(--bg);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.bump input{margin-top:3px;width:19px;height:19px;accent-color:var(--brand);flex-shrink:0}
.bump label{display:block;cursor:pointer}
.bump b{font-size:15px}
.bump .was{text-decoration:line-through;color:var(--muted);font-weight:400}
.bump p{margin-top:2px;color:var(--muted);font-size:14px}
.upsell{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left}
.upsell img,.upsell .thumb-art{flex:0 0 64px;width:64px;height:64px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line)}
.upsell .thumb-art{display:grid;place-items:center}
.upsell .thumb-art svg{width:80%}
.upsell .info{flex:1;min-width:0}
.upsell .info b{display:block;font-size:15px}
.upsell .info span{font-size:14px;color:var(--muted)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

function square(file){
  const SIZE=1200;
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onerror=rej;
    fr.onload=()=>{
      const im=new Image();
      im.onerror=rej;
      im.onload=()=>{
        const c=document.createElement('canvas');
        c.width=SIZE;c.height=SIZE;
        const g=c.getContext('2d');
        g.fillStyle='#fff';g.fillRect(0,0,SIZE,SIZE);
        g.imageSmoothingQuality='high';
        const k=Math.min(SIZE/im.width,SIZE/im.height);
        const w=Math.round(im.width*k),h=Math.round(im.height*k);
        g.drawImage(im,Math.round((SIZE-w)/2),Math.round((SIZE-h)/2),w,h);
        let q=.86,url=c.toDataURL('image/jpeg',q);
        while(url.length>380000&&q>.55){q-=.08;url=c.toDataURL('image/jpeg',q);}
        res({url,w:im.width,h:im.height});
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

async function uploadImage(dataUrl){
  if(!sb||!sbSession)throw new Error('ต้องล็อกอินก่อนอัปโหลดภาพ');
  const blob=await (await fetch(dataUrl)).blob();
  const path='products/'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  const {error}=await sb.storage.from('product-images').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'});
  if(error)throw error;
  return sb.storage.from('product-images').getPublicUrl(path).data.publicUrl;
}

/* Facebook Pixel: โหลดเมื่อมี Pixel ID ในตั้งค่า แล้วส่ง event มาตรฐานของ Meta */
const FB_EVENTS={PageView:1,ViewContent:1,InitiateCheckout:1,Purchase:1,Lead:1};
let pixelReady=false;
function initPixel(id){
  if(pixelReady||!/^\d{6,20}$/.test(String(id||'')))return;
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init',String(id));pixelReady=true;
}
function track(name,data){
  if(pixelReady&&FB_EVENTS[name]&&!hasAdminAccess()){ // ไม่นับการเข้าดูของแอดมินเอง
    try{const d=Object.assign({},data||{});delete d.campaign;fbq('track',name,d);}catch(e){}
  }
  D.events.unshift({t:Date.now(),name,data:data||{}});
  D.events=D.events.slice(0,60);saveCache();
}

function calc(p,code){
  const base=Number(p.price)||0;
  const c=D.coupons.find(x=>x.active&&x.code===code&&(x.scope==='all'||x.scope===p.id));
  let d=0;
  if(c)d=c.type==='percent'?Math.round(base*c.value/100):Math.min(c.value,base);
  d=Math.max(0,Math.min(d,base-1));
  return{base,discount:d,total:base-d,coupon:c||null};
}

function fakeQR(seedStr){
  let h=2166136261;for(const ch of seedStr){h^=ch.charCodeAt(0);h=Math.imul(h,16777619);}
  const rnd=()=>{h+=0x6D2B79F5;let t=h;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};
  const N=25,Q=2;let r='';
  const finder=(x,y)=>`<rect x="${x+Q}" y="${y+Q}" width="7" height="7" fill="#0F1B33"/><rect x="${x+Q+1}" y="${y+Q+1}" width="5" height="5" fill="#fff"/><rect x="${x+Q+2}" y="${y+Q+2}" width="3" height="3" fill="#0F1B33"/>`;
  const inF=(x,y)=>(x<8&&y<8)||(x>N-9&&y<8)||(x<8&&y>N-9);
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){if(inF(x,y))continue;if(rnd()>.5)r+=`<rect x="${x+Q}" y="${y+Q}" width="1" height="1" fill="#0F1B33"/>`;}
  return `<svg viewBox="0 0 ${N+Q*2} ${N+Q*2}" shape-rendering="crispEdges" role="img" aria-label="QR จำลอง"><rect width="${N+Q*2}" height="${N+Q*2}" fill="#fff"/>${r}${finder(0,0)}${finder(N-7,0)}${finder(0,N-7)}</svg>`;
}

async function doLogin(email,pass){
  if(!sb){S.err='โหลดไลบรารี Supabase ไม่ได้ ลองรีเฟรชหน้า';render(true);return;}
  S.loginEmail=email;S.busy=true;S.err='';render(true);
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  S.busy=false;
  if(error){S.err=/invalid/i.test(error.message)?'อีเมลหรือรหัสผ่านไม่ถูกต้อง':error.message;render(true);}
  // สำเร็จ: onAuthStateChange จะจัดการต่อ
}
async function afterLogin(){
  const had=await loadRemote();
  if(!had){ // ระบบยังว่าง: ถ้ามีข้อมูลเก่าในเบราว์เซอร์นี้ให้นำเข้า ไม่งั้นใช้ข้อมูลที่แสดงอยู่
    const legacy=loadLegacy();
    if(legacy&&Array.isArray(legacy.products)&&confirm('พบข้อมูลสินค้าที่เคยแก้ไว้ในเบราว์เซอร์นี้ ต้องการนำเข้าขึ้นระบบไหม')){D=normalize(legacy);}
    await pushAll();toast('ตั้งค่าข้อมูลบนระบบเรียบร้อย');
  }
  if(needsMigrate){needsMigrate=false;await pushAll();}
  S.view='admin';S.err='';render(false);
  if(S.tab==='orders')autoSync(true);
}
function render(keep){
  const y=window.scrollY,v=S.view;
  const isAdmin=hasAdminAccess();
  $('#bar').style.display=isAdmin?'':'none';
  $('#bar-note').innerHTML=isAdmin?`หลังบ้าน<br><span style="word-break:break-all">${esc(sbSession.user.email)}</span> · <a href="#" data-a="logout">ออกจากระบบ</a>`:'';
  $('#seg').innerHTML=isAdmin?`<button data-a="toShop" aria-pressed="${v!=='admin'}">หน้าลูกค้า</button><button data-a="toAdmin" aria-pressed="${v==='admin'}">หลังบ้าน</button>`:'';
  if(S.loading){$('#app').innerHTML=`<div class="wrap" style="padding:60px 16px;text-align:center"><p class="muted">กำลังโหลด...</p></div>`;return;}
  $('#app').innerHTML=({shop:shopView,pay:payView,thanks:thanksView,admin:adminView,login:loginView}[v])();
  window.scrollTo(0,keep?y:0);
  tick();
  if(io){io.disconnect();io=null;}
  const cs=document.getElementById('checkout'),st=document.getElementById('sticky');
  if(cs&&st&&'IntersectionObserver' in window){
    io=new IntersectionObserver(es=>{st.classList.toggle('hide',es[0].isIntersecting);},{threshold:.15});
    io.observe(cs);
  }
}
function go(v){
  if(v==='admin'&&!hasAdminAccess()){v='login';}
  S.view=v;S.err='';S.confirm='';S.zoom=null;drawLB();
  if(v==='shop'){const p=curProduct();if(p)track('ViewContent',{content_name:p.name,value:p.price,currency:'THB'});}
  render(false);
}

    case 'checkStatus':{toast('กำลังตรวจสอบ...');adminApi('/api/status').then(j=>{
      if(!j.ok)S.status={ok:false,text:j.error||'ตรวจสอบไม่ได้'};
      else if(!j.stripeKey||!j.supabaseKey)S.status={ok:false,text:'คีย์บน Vercel ยังไม่ครบ: '+(!j.stripeKey?'STRIPE_SECRET_KEY ':'')+(!j.supabaseKey?'SUPABASE_SECRET_KEY':'')+' (ใส่แล้วต้อง Redeploy)'};
      else if(j.stripeError)S.status={ok:false,text:'Stripe ตอบกลับผิดพลาด: '+j.stripeError};
      else S.status={ok:true,text:'พร้อมรับเงิน: บัญชี Stripe "'+(j.account&&j.account.name)+'" ('+(j.account&&j.account.country)+') · PromptPay: '+(j.promptpay==='active'?'เปิดใช้แล้ว':j.promptpay)};
      render(true);}).catch(e=>{S.status={ok:false,text:'เชื่อมต่อไม่ได้'};render(true);});break;}
    case 'viewUpsell':selectProduct(id);go('shop');break;
    case 'toAdmin':go('admin');break;
    case 'logout':if(sb)sb.auth.signOut();break;
    case 'importLegacy':{
      if(S.confirm==='import'){const l=loadLegacy();if(l){D=normalize(l);S.confirm='';S.productId=null;pushAll().then(()=>{render(true);toast('นำเข้าข้อมูลเก่าแล้ว');});}}
      else{S.confirm='import';render(true);}break;}
    case 'toCheckout':{const c=document.getElementById('checkout');if(c)c.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth'});break;}
    case 'applyCoupon':{
      const p=curProduct(),code=(S.form.coupon||'').trim().toUpperCase();S.form.coupon=code;
      if(!code){S.coupon='';S.couponErr='';}
      else if(D.coupons.find(x=>x.active&&x.code===code&&(x.scope==='all'||x.scope===p.id))){S.coupon=code;S.couponErr='';}
      else{S.coupon='';S.couponErr='โค้ดนี้ใช้กับสินค้านี้ไม่ได้ หรือถูกปิดใช้งานแล้ว';}
      render(true);break;}
    case 'createOrder':{
      const p=curProduct(),name=(S.form.name||'').trim(),email=(S.form.email||'').trim();
      if(!name){S.err='กรอกชื่อก่อนชำระเงิน';render(true);break;}
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){S.err='กรอกอีเมลให้ถูกต้อง เพื่อรับลิงก์ดาวน์โหลด';render(true);break;}
      const c=calc(p,S.coupon);
      const bp=p.bumpProductId?getProduct(p.bumpProductId):null;
      const useBump=!!(S.form.bump&&bp);
      const items=[{productId:p.id,name:p.name,price:c.total}];
      if(useBump)items.push({productId:bp.id,name:bp.name,price:Number(p.bumpPrice)||0});
      const total=items.reduce((a,it)=>a+it.price,0);
      const o={id:newId(),productId:p.id,pname:p.name,name,email,method:S.method,base:c.base,discount:c.discount,amount:total,coupon:c.coupon?c.coupon.code:'',campaign:S.src||'',status:'pending',created:Date.now(),paidAt:null,items,log:[{t:Date.now(),text:'สร้างออเดอร์ สถานะรอชำระ'+(useBump?' (รวม '+bp.name+')':'')}]};
      D.orders.unshift(o);track('InitiateCheckout',Object.assign({content_name:p.name,value:o.amount,currency:'THB'},o.campaign?{campaign:o.campaign}:{}));save();
      S.currentId=o.id;S.err='';go('pay');break;}
    case 'simulatePay':{const o=getOrder(S.currentId);if(o&&o.status==='pending')markPaid(o);go('thanks');break;}
    case 'cancelPay':go('shop');break;
    case 'adVar':{const p=getProduct(S.ad.pid);S.ad.var=el.dataset.v;Object.assign(S.ad,adDraft(p,S.ad.var));render(true);break;}
    case 'adCopy':{
      const k=el.dataset.k,p=getProduct(S.ad.pid);
      copyText(k==='link'?adLink(p,S.ad.camp,S.ad.var):S.ad[k],'คัดลอกแล้ว');break;}
    case 'addCamp':{
      const name=$('#k-name').value.trim().toLowerCase(),pid=$('#k-prod').value,spend=Number($('#k-spend').value)||0;
      if(!/^[a-z0-9][a-z0-9_-]{2,39}$/.test(name)){S.err='ชื่อแคมเปญใช้ได้เฉพาะ a-z ตัวเลข - และ _ ยาว 3 ถึง 40 ตัว';render(true);break;}
      if(D.campaigns.some(c=>c.name===name)){S.err='มีแคมเปญชื่อนี้แล้ว';render(true);break;}
      if(spend<0){S.err='ค่าโฆษณาต้องไม่ติดลบ';render(true);break;}
      D.campaigns.push({id:'c'+Date.now().toString(36),name,productId:pid,spend});S.err='';save();render(true);toast('เพิ่มแคมเปญ '+name+' แล้ว');break;}
    case 'saveSpend':{
      const c=D.campaigns.find(x=>x.id===id),v=Number(document.getElementById('sp-'+id).value);
      if(!(v>=0)){toast('ค่าโฆษณาต้องเป็นตัวเลขตั้งแต่ 0 ขึ้นไป');break;}
      c.spend=v;save();render(true);toast('บันทึกค่าโฆษณาแล้ว');break;}
    case 'delCamp':{
      if(S.confirm==='camp:'+id){D.campaigns=D.campaigns.filter(x=>x.id!==id);S.confirm='';if(S.ad&&S.ad.camp&&!D.campaigns.some(c=>c.name===S.ad.camp))S.ad.camp='';save();render(true);toast('ลบแคมเปญแล้ว');}
      else{S.confirm='camp:'+id;render(true);}break;}
    case 'zoom':S.zoom=Number(el.dataset.i);drawLB();break;
    case 'closeZoom':S.zoom=null;drawLB();break;
    case 'zoomPrev':case 'zoomNext':{const n=(curProduct().images||[]).length;if(n){S.zoom=(S.zoom+(a==='zoomNext'?1:n-1))%n;drawLB();}break;}
    case 'filter':S.filter=el.dataset.v;render(true);break;
    case 'tab':S.tab=el.dataset.v;S.err='';S.confirm='';S.edit=null;render(false);if(S.tab==='orders')autoSync();break;
    case 'toggle':S.open[id]=!S.open[id];render(true);break;
    case 'resend':{const o=getOrder(id);o.log.push({t:Date.now(),text:'ส่งลิงก์ดาวน์โหลดซ้ำไปที่ '+o.email});save();render(true);toast('ส่งลิงก์ซ้ำแล้ว (จำลอง)');break;}
    case 'refund':{
      if(S.confirm==='refund:'+id){const o=getOrder(id);o.status='refunded';o.log.push({t:Date.now(),text:'คืนเงิน '+baht(o.amount)});S.confirm='';save();render(true);toast('คืนเงินแล้ว');}
      else{S.confirm='refund:'+id;render(true);}break;}
    case 'manualPaid':{const o=getOrder(id);markPaid(o,'แอดมินยืนยันว่าชำระแล้ว');render(true);toast('เปลี่ยนสถานะเป็นชำระแล้ว');break;}

    /* products */
    case 'viewPage':selectProduct(id);go('shop');break;
    case 'copyLink':{const p=getProduct(id);copyText(DOMAIN+p.slug);break;}
    case 'newProduct':S.draft=initDraft(blankProduct());S.edit='new';S.err='';render(false);break;
    case 'editProduct':S.draft=initDraft(getProduct(id));S.edit=id;S.err='';render(false);break;
    case 'cancelEdit':S.edit=null;S.draft=null;S.err='';render(false);break;
    case 'rmImg':S.draft.images.splice(Number(el.dataset.i),1);render(true);break;
    case 'togglePub':{const p=getProduct(id);p.status=p.status==='published'?'draft':'published';save();render(true);toast(p.status==='published'?'เผยแพร่เซลเพจแล้ว':'เปลี่ยนเป็นฉบับร่างแล้ว');break;}
    case 'dupProduct':{
      const p=getProduct(id);let slug=p.slug+'-copy',n=2;while(slugTaken(slug))slug=p.slug+'-copy'+n++;
      const nid='p'+Date.now().toString(36);
      D.products.push(Object.assign({},p,{id:nid,slug,name:p.name+' (สำเนา)',status:'draft',images:(p.images||[]).slice()}));
      save();render(true);toast('ทำสำเนาแล้ว เป็นฉบับร่าง');break;}
    case 'delProduct':{
      if(D.orders.some(o=>o.productId===id)){S.confirm='';render(true);toast('สินค้านี้มีออเดอร์แล้ว ลบไม่ได้ ให้เปลี่ยนเป็นฉบับร่างแทน');break;}
      if(S.confirm==='del:'+id){D.products=D.products.filter(p=>p.id!==id);D.coupons=D.coupons.filter(c=>c.scope!==id);if(S.productId===id)S.productId=null;S.confirm='';save();render(true);toast('ลบสินค้าแล้ว');}
      else{S.confirm='del:'+id;render(true);}break;}
    case 'saveProduct':{
      const d=S.draft,isNew=S.edit==='new',selfId=isNew?null:S.edit;
      const name=String(d.name).trim(),slug=String(d.slug).trim().toLowerCase(),price=Number(d.price),full=Number(d.fullPrice)||0,link=String(d.link).trim(),sample=String(d.sampleLink).trim();
      if(!name){S.err='กรอกชื่อสินค้า';render(true);break;}
      if(!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(slug)){S.err='ชื่อในลิงก์ใช้ได้เฉพาะ a-z ตัวเลข และ - เช่น calculus-1-summary';render(true);break;}
      if(slugTaken(slug,selfId)){S.err='ชื่อในลิงก์นี้ถูกใช้แล้ว เลือกชื่ออื่น';render(true);break;}
      if(!(price>=1)){S.err='ราคาขายต้องเป็นตัวเลขตั้งแต่ 1 บาทขึ้นไป';render(true);break;}
      if(link&&link!=='https://'&&!/^https?:\/\//.test(link)){S.err='ลิงก์ไฟล์ต้องขึ้นต้นด้วย https://';render(true);break;}
      if(sample&&sample!=='https://'&&!/^https?:\/\//.test(sample)){S.err='ลิงก์ไฟล์ตัวอย่างต้องขึ้นต้นด้วย https://';render(true);break;}
      const promoEnd=d.promoEndStr?new Date(d.promoEndStr).getTime():0;
      if(d.promoEndStr&&!(promoEnd>0)){S.err='วันเวลาโปรโมชันไม่ถูกต้อง';render(true);break;}
      const bumpPrice=Number(d.bumpPrice)||0;
      if(d.bumpProductId&&!(bumpPrice>=0)){S.err='ราคาพิเศษของ order bump ต้องเป็นตัวเลขตั้งแต่ 0 ขึ้นไป';render(true);break;}
      if(d.bumpProductId&&d.bumpProductId===selfId){S.err='เลือกสินค้าอื่นสำหรับ order bump ไม่ใช่สินค้านี้เอง';render(true);break;}
      const t=k=>String(d[k]==null?'':d[k]).trim();
      const data={slug,name,kind:d.kind,headline:t('headline')||name,desc:t('desc'),price,fullPrice:full,features:d.features,link:link==='https://'?'':link,color:d.color,status:d.status,
        specs:d.specs,toc:d.toc,forwho:d.forwho,notfor:d.notfor,authorName:t('authorName'),authorBio:t('authorBio'),sampleLink:sample==='https://'?'':sample,terms:t('terms'),
        proof:t('proof'),promoEnd,pains:d.pains,bonus:d.bonus,reviews:d.reviews,faq:d.faq,guarantee:t('guarantee'),images:d.images.slice(),
        bumpProductId:d.bumpProductId||'',bumpPrice,stripeLink:t('stripeLink')};
      if(data.stripeLink&&!/^https:\/\/buy\.stripe\.com\//.test(data.stripeLink)){S.err='ลิงก์ Stripe ต้องขึ้นต้นด้วย https://buy.stripe.com/';render(true);break;}
      let saved;
      if(isNew){saved=Object.assign({id:'p'+Date.now().toString(36)},data);D.products.push(saved);}
      else{saved=getProduct(selfId);Object.assign(saved,data);}
      S.edit=null;S.draft=null;S.err='';save();
      if(el.dataset.then==='view'){selectProduct(saved.id);go('shop');}
      else{render(false);toast('บันทึกสินค้าแล้ว');}
      break;}

    /* coupons */
    case 'addCoupon':{
      const code=$('#c-code').value.trim().toUpperCase().replace(/\s+/g,''),type=$('#c-type').value,scope=$('#c-scope').value,val=Number($('#c-value').value);
      if(!/^[A-Z0-9_-]{3,20}$/.test(code)){S.err='โค้ดใช้ได้เฉพาะ A-Z ตัวเลข และ - ยาว 3 ถึง 20 ตัว';render(true);break;}
      if(D.coupons.some(c=>c.code===code)){S.err='มีโค้ดนี้อยู่แล้ว';render(true);break;}
      if(!(val>0)||(type==='percent'&&val>90)){S.err='มูลค่าต้องมากกว่า 0 และเปอร์เซ็นต์ไม่เกิน 90';render(true);break;}
      D.coupons.unshift({code,type,value:val,scope,active:true,uses:0});S.err='';save();render(true);toast('เพิ่มโค้ด '+code+' แล้ว');break;}
    case 'toggleCoupon':{const c=D.coupons.find(x=>x.code===el.dataset.code);c.active=!c.active;if(!c.active&&S.coupon===c.code)S.coupon='';save();render(true);break;}
    case 'delCoupon':{D.coupons=D.coupons.filter(x=>x.code!==el.dataset.code);if(S.coupon===el.dataset.code)S.coupon='';save();render(true);break;}

    /* pixel + reset */
    case 'savePixel':{const id=$('#s-pixel').value.trim();if(id&&!/^\d{6,20}$/.test(id)){toast('Pixel ID ต้องเป็นตัวเลขล้วน');break;}D.settings.pixelId=id;save();render(true);toast('บันทึก Pixel ID แล้ว');break;}
    case 'saveFbVerify':{let v=$('#s-fbverify').value.trim();const m=v.match(/content=["']([^"']+)/);if(m)v=m[1];D.settings.fbDomainVerify=v;save();render(true);toast('บันทึกรหัสยืนยันโดเมนแล้ว');break;}
    case 'savePay':{D.settings.shopName=$('#s-shop').value.trim();D.settings.refundPolicy=$('#s-refund').value.trim();let chat=$('#s-chat').value.trim();if(chat&&!/^https?:\/\//.test(chat))chat='https://'+chat;D.settings.chatLink=chat;D.settings.promptpayId=$('#s-pp').value.trim();D.settings.bankInfo=$('#s-bank').value.trim();D.settings.contactInfo=$('#s-contact').value.trim();save();toast('บันทึกข้อมูลรับเงินแล้ว');break;}
    case 'clearEvents':D.events=[];save();render(true);break;
    case 'clearDemo':
      if(S.confirm==='clearDemo'){D.orders=[];D.campaigns=[];D.events=[];S.confirm='';S.currentId=null;save();render(true);toast('ล้างออเดอร์และแคมเปญตัวอย่างแล้ว');}
      else{S.confirm='clearDemo';render(true);}break;
    case 'reset':
      if(S.confirm==='reset'){D=normalize(seed());save();S.confirm='';S.coupon='';S.productId=null;S.open={};S.edit=null;render(true);toast('รีเซ็ตแล้ว');}
      else{S.confirm='reset';render(true);}break;
  }
}
document.addEventListener('keydown',e=>{
  if(S.zoom==null)return;
  if(e.key==='Escape'){S.zoom=null;drawLB();}
  else if(e.key==='ArrowRight')act('zoomNext',{dataset:{}});
  else if(e.key==='ArrowLeft')act('zoomPrev',{dataset:{}});
});
document.addEventListener('click',e=>{
  const tr=e.target.closest('[data-track]');
  if(tr){const p=curProduct();if(p)track(tr.dataset.track,Object.assign({content_name:p.name,value:p.price,currency:'THB'},S.src?{campaign:S.src}:{}));}
  const el=e.target.closest('[data-a]');if(el)act(el.dataset.a,el);
});
document.addEventListener('input',e=>{
  const t=e.target,ds=t.dataset||{};
  if(ds.f)S.form[ds.f]=t.value;
  if(ds.d&&S.draft)S.draft[ds.d]=t.value;
  if(ds.ad&&S.ad){S.ad[ds.ad]=t.value;adLive(ds.ad);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='method'){S.method=t.value;render(true);}
  else if(t.id==='pick'){selectProduct(t.value);const p=curProduct();if(p)track('ViewContent',{content_name:p.name,value:p.price,currency:'THB'});render(false);}
  else if(t.id==='src'){S.src=t.value;}
  else if(t.id==='ad-p'){const p=getProduct(t.value);S.ad.pid=p.id;S.ad.camp='';Object.assign(S.ad,adDraft(p,S.ad.var));render(true);}
  else if(t.id==='ad-cta'){S.ad.cta=t.value;render(true);}
  else if(t.id==='ad-camp'){S.ad.camp=t.value;render(true);}
  else if(t.id==='e-img'){addImages(t.files);t.value='';}
  else if(t.id==='pf'){S.pfilter=t.value;render(true);}
  else if(t.id==='f-bump'){S.form.bump=t.checked;render(true);}
});

document.addEventListener('submit',e=>{
  if(e.target.id==='login-form'){e.preventDefault();doLogin($('#l-email').value.trim(),$('#l-pass').value);}
});

/* ตรวจผลการชำระเงินกับเซิร์ฟเวอร์ (ซึ่งถามต่อ Stripe) แล้วแสดงลิงก์ดาวน์โหลด */
async function verifyOrder(){
  S.order=null;render(true);
  try{
    const r=await fetch('/api/order?session_id='+encodeURIComponent(S.sessionId));
    const j=await r.json();
    if(!j.ok)S.order={paid:false,error:j.error||'เกิดข้อผิดพลาด'};
    else S.order=j;
    if(j.ok&&j.paid){
      const k='purchased:'+S.sessionId;
      if(!localStorage.getItem(k)){ // ยิง Purchase ครั้งเดียวต่อออเดอร์ แม้รีเฟรชหน้า
        try{localStorage.setItem(k,'1');}catch(e){}
        track('Purchase',Object.assign({content_name:j.productName,value:j.amount,currency:j.currency||'THB'},S.src?{campaign:S.src}:{}));
      }
    }
  }catch(e){S.order={paid:false,error:'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'};}
  render(true);
  const c=document.getElementById('paid-card');if(c)c.scrollIntoView({block:'start'});
}
/* ---------- start ---------- */
function applyUrl(){
  try{
    const m=location.pathname.match(/\/p\/([a-z0-9-]+)\/?$/i);
    if(m){
      const p=D.products.find(x=>x.slug===m[1]);
      if(p)S.productId=p.id;
    }
    const q=new URLSearchParams(location.search);
    const camp=q.get('utm_campaign');
    if(camp)S.src=camp;
    const sid=q.get('session_id');if(sid&&/^cs_(live|test)_[A-Za-z0-9]+$/.test(sid))S.sessionId=sid;
    if(q.has('admin')||location.hash==='#admin')S.view=hasAdminAccess()?'admin':'login';
  }catch(e){}
}
(async function boot(){
  const hadCache=!!load();
  S.loading=!hadCache&&!!sb; // ไม่มีแคช: รอข้อมูลจากระบบก่อน จะได้ไม่เห็นข้อมูลตัวอย่างแวบขึ้นมา
  applyUrl();
  render(false);
  if(sb){
    try{
      const {data}=await sb.auth.getSession();
      sbSession=data&&data.session||null;
      await loadRemote();
      if(needsMigrate&&sbSession){needsMigrate=false;await pushAll();}
      sb.auth.onAuthStateChange((ev,session)=>{
        const was=!!sbSession;sbSession=session||null;
        if(ev==='SIGNED_IN'&&!was){afterLogin();}
        else if(ev==='SIGNED_OUT'){S.view='shop';S.tab='orders';S.edit=null;S.draft=null;loadRemote().then(()=>render(false));render(false);}
      });
    }catch(e){console.error(e);}
  }
  S.loading=false;
  applyUrl();
  initPixel(D.settings.pixelId);
  if(S.sessionId)verifyOrder();
  track('PageView');
  {const p=curProduct();if(p)track('ViewContent',{content_name:p.name,value:p.price,currency:'THB'});}
  render(false);
})();
</script>
</body>
