# เช็กหน้าจ่ายเงินบนเว็บจริง (sheetlabth.com) ตาม CLAUDE.md · รันเมื่อ push ขึ้น branch live-check หรือกด Run workflow ในแท็บ Actions
# ดักคำขอ QR ไว้ ไม่สร้างการจ่ายเงินจริง
name: live-check
on:
  workflow_dispatch:
  push:
    branches: [live-check]
jobs:
  checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: node tools/live/checkout-check.mjs https://sheetlabth.com
        env: { CHROME_PATH: /usr/bin/google-chrome }
      - name: gov zone pages
        run: |
          for p in /gov /gov/kp-phak-kor /gov/learn/kp-think-number-series /gov/learn/kp-law-good-official /gov/quiz/kp-think-math-word-10 /gov/quiz/kp-english-10; do
            code=$(curl -s -o /tmp/p.html -w '%{http_code}' "https://sheetlabth.com$p"); title=$(grep -o '<title>[^<]*' /tmp/p.html | head -1 | cut -c8-90)
            echo "$code $p · $title"; [ "$code" = 200 ] || exit 1
          done
          echo "sitemap /gov URLs: $(curl -s https://sheetlabth.com/sitemap.xml | grep -o '/gov[^<]*' | wc -l)"
